<div class="pdca-wheel" aria-label="วงจร PDCA">
  <div class="q p"><b>P</b>Plan<br><small>วางแผน</small></div>
  <div class="q d"><b>D</b>Do<br><small>ปฏิบัติ</small></div>
  <div class="q a"><b>A</b>Act<br><small>ปรับปรุง</small></div>

<p>ปัญหาเป็นสิ่งที่หลีกเลี่ยงไม่ได้ แต่เราเรียนรู้ที่จะแก้ปัญหาได้ ปัจจุบันมีเครื่องมือมากมาย เช่น POCCC, POSDC, POLC — PDCA คือกระบวนการที่ให้ความสำคัญมากกว่าแค่การวางแผน แต่รวมถึง<b>การลงมือทำ ตรวจสอบ และปรับปรุงพัฒนาอย่างเป็นระบบ</b></p>
<div class="callout"><b>PDCA</b> คือ <b>วงจรบริหารงานคุณภาพ</b> ประกอบด้วย 4 ขั้นตอน Plan-Do-Check-Act เป็นกระบวนการปรับปรุงการทำงานขององค์กรอย่างเป็นระบบ เพื่อแก้ปัญหาและเกิด<b>การพัฒนาอย่างต่อเนื่อง (Continuous Improvement)</b> — ทำซ้ำได้เรื่อย ๆ จนกลายเป็นวงจร (Cycle)</div>

<h3>ที่มา</h3>
<p>เกิดขึ้นช่วงทศวรรษ 1950 โดยบิดาแห่งการควบคุมคุณภาพสมัยใหม่ <b>ดร.วิลเลียม เอ็ดเวิร์ดส์ เดมมิ่ง (Dr. William Edwards Deming)</b> ซึ่งพัฒนาต่อจากปรมาจารย์ของเขา <b>วอลเตอร์ เอ ชิวฮาร์ท (Walter Andrew Shewhart)</b> จึงมีชื่อเรียกอีกว่า <b>Deming Cycle</b> หรือ <b>Shewhart Cycle</b></p>
<p>เดมมิ่งคิดค้น PDCA จากความเชื่อว่า <b>“คุณภาพสามารถปรับปรุงพัฒนาได้”</b> ใช้ได้กับองค์กรทุกประเภท ธุรกิจทุกรูปแบบ และแม้กระทั่งชีวิตประจำวัน</p>

<div class="card tip"><h4>💡 Do You Know?</h4><p>กระบวนการ <b>Kaizen</b> ก็ใช้แนวคิดแบบวงจร PDCA เช่นกัน ผ่านหัวใจสำคัญคือการปรับปรุงพัฒนาต่อเนื่องไม่หยุดยั้ง — Kaizen แปลตรง ๆ ว่า <b>“การปรับปรุงให้ดีขึ้นกว่าเดิม”</b></p></div>`,

<h3>Visual Control — การควบคุมด้วยการมองเห็น</h3>
<p>เพื่อแสดงให้เห็นการจัดการว่ายังเป็นปกติ หรือมีความผิดปกติเกิดขึ้น เพื่อให้คนรีบดำเนินการแก้ไขได้อย่างถูกต้องเหมาะสม เช่น เกจวัดต่าง ๆ</p>
<figure><img class="page-img" src="${IMG["5s-visual-control"]}" alt="ตัวอย่าง Visual Control: ถังมีแถบบอกระดับ เกจวัดมีแถบสีเขียว เหลือง แดง และแผงเกจวัดเรียงเป็นแถว"></figure>

<h3>Visual Management — การบริหารจัดการด้วยการมองเห็น</h3>
<p>เปลี่ยนข้อมูล ข่าวสาร สถานะ หรือเป้าหมายในการทำงานให้กลายเป็นป้าย สัญลักษณ์ สี รูปภาพ หรือบอร์ด เพื่อให้ทุกคนที่เกี่ยวข้องมองเห็น เข้าใจ และรับรู้สภาพความเป็นจริงของหน้างานได้ทันที โดยไม่จำเป็นต้องเอ่ยปากถาม หรือเปิดอ่านเอกสารรายงานยาว ๆ</p>
<figure><img class="page-img" src="${IMG["5s-visual-mgmt"]}" alt="ตัวอย่าง Visual Management: บอร์ดติดตามผล บอร์ดกิจกรรม 5ส และกราฟแสดงผลการดำเนินงาน"></figure>

<h3>ประโยชน์จากการทำ “สะดวก”</h3>
<ol>
  <li>ลดเวลาในการค้นหาอุปกรณ์หรือเอกสาร</li>
  <li>ลดการสูญหายของอุปกรณ์หรือเอกสาร ทำงานได้เสร็จทันตามแผน</li>
  <li>ลดเวลาการทำงาน หากเป็นงานเกี่ยวกับการให้บริการ จะได้รับบริการที่รวดเร็วขึ้น</li>
  <li>ช่วยเพิ่มประสิทธิภาพในการทำงานให้ดีขึ้น</li>
  <li>ช่วยสร้างบรรยากาศในที่ทำงานให้น่าอยู่ ซึ่งมีผลต่อสุขภาพกายและใจของผู้ปฏิบัติงาน</li>
</ol>
<figure><img src="${IMG["5s-seiton-ask"]}" alt="ทำสะดวกต้องตอบได้ เก็บอะไร เก็บที่ไหน จำนวนเท่าไหร่"></figure>`,

        title: "ส3 สะอาด (Seiso)",
        minutes: 5,
        body: `
<p class="lead">SEISO (เซโซ) · Cleaning — ลงมือทำความสะอาด</p>
<div class="card"><h4>ส3 สะอาด คือ</h4><ul><li>มีขั้นตอนการทำความสะอาด</li><li>อย่าให้ขาดผู้รับผิดชอบ</li><li>หมั่นตรวจสอบสิ่งผิดปกติ</li><li>กำหนดแผนงาน ตามความถี่</li></ul></div>
<div class="grid2">
  <div class="card"><h4>วัตถุประสงค์</h4><p>ตรวจสอบสิ่งผิดปกติ และแก้ไข</p></div>
  <div class="card"><h4>ผลลัพธ์ที่ได้</h4><p>อุปกรณ์ เครื่องจักร มีความพร้อมใช้ สภาพแวดล้อมน่าทำงานและ<b>ปลอดภัย</b></p></div>
</div>

<h3>ขั้นตอนการทำ “สะอาด”</h3>
<ol class="steps">
  <li><span class="step-no">1</span>กำหนดผู้รับผิดชอบตามพื้นที่รับผิดชอบให้ชัดเจน</li>
  <li><span class="step-no">2</span>จัดทำขั้นตอนการทำความสะอาด โดยระบุวิธีการตรวจสอบ การบำรุงรักษาที่ชัดเจน</li>
  <li><span class="step-no">3</span>จัดทำแผนการทำความสะอาดพื้นที่ และกำหนดความถี่ที่เหมาะสม</li>
  <li><span class="step-no">4</span>ลงมือทำความสะอาดตามความถี่ที่กำหนด โดยให้ตรวจสอบอุปกรณ์หรือเครื่องมือ หากผิดปกติให้รีบทำการแก้ไขทันที</li>
</ol>

<h3>การตรวจสอบโดยใช้ประสาทสัมผัส</h3>
<figure><img class="page-img" src="${IMG["5s-senses"]}" alt="ตา ค้นหารอยรั่ว น้อตโบลต์ที่หลวม หู ค้นหาเสียงลมรั่ว เสียงสั่นคลอน จมูก ค้นหากลิ่นไหม้ น้ำมันรั่ว แก๊สรั่ว สารเคมีหก สัมผัส ค้นหาการทำงานที่ผิดปกติ เช่น อุณหภูมิมอเตอร์สูงกว่าปกติ การสั่นสะเทือน การโยกคลอน"></figure>

<h3>ประโยชน์จากการทำ “สะอาด”</h3>
<ol>
  <li>สภาพแวดล้อมในที่น่าทำงานมีความสะอาดและปลอดภัย</li>
  <li>บรรยากาศในที่ทำงานมีความสดชื่น น่าอยู่</li>
  <li>ช่วยเพิ่มประสิทธิภาพการทำงานของเครื่องมือ เครื่องจักร และวัสดุอุปกรณ์ต่าง ๆ</li>
  <li>ช่วยยืดอายุการใช้งานของเครื่องมือ เครื่องจักร วัสดุอุปกรณ์ ให้ยาวนานยิ่งขึ้น</li>
  <li>ลดของเสียของเครื่องจักร อันเนื่องมาจากความสกปรก ซึ่งเป็นสาเหตุทำให้เครื่องจักรเสียหายได้</li>
</ol>
<figure><img src="${IMG["5s-seiso-team"]}" alt="ภาพการ์ตูนทุกคนช่วยกันทำความสะอาด"></figure>`,

        title: "ส4 สร้างมาตรฐาน (Seiketsu)",

        body: `
<p class="lead">SEIKETSU (เซเคทซึ) · Standardization — สร้างแนวทางปฏิบัติที่ดีร่วมกัน</p>
<div class="card"><h4>ส4 สร้างมาตรฐาน คือ</h4><ul><li>กำหนดเป็นลายลักษณ์อักษร</li><li>หมั่นติดตามและประเมินผล</li><li>ฝึกอบรม เพื่อเพิ่มทักษะคน</li><li>สร้างแรงจูงใจคน ให้ร่วมปรับปรุงงาน</li></ul></div>
<div class="grid2">
  <div class="card"><h4>วัตถุประสงค์</h4><p>เพื่อรักษา พัฒนา และยกระดับการทำ 3ส แรก และลดความเสี่ยงในการปฏิบัติงาน</p></div>
  <div class="card"><h4>ผลลัพธ์ที่ได้</h4><p>ทุกคนยอมรับ และปฏิบัติตามมาตรฐาน และ<b>สามารถทำงานแทนกันได้</b></p></div>
</div>

<h3>แนวทางกำหนดมาตรฐาน 5ส</h3>
<figure><img class="page-img" src="${IMG["5s-standard-guide"]}" alt="มาตรฐานที่ดี: สามารถปฏิบัติตามได้เหมือนกัน สิ่งที่ทุกคนร่วมกันกำหนดขึ้น ระบุรายละเอียดชัดเจนเข้าใจง่าย เปลี่ยนแปลงได้ตามความเหมาะสม สอดคล้องกันนโยบาย เกิดผลดีต่อทุกคนและบริษัท"><figcaption>ยอมรับแนวทางการปฏิบัติ และสามารถทำแทนกันได้ตามผลลัพธ์ที่ต้องการ</figcaption></figure>

<h3>ประเภทมาตรฐาน 5ส</h3>
<div class="callout"><b>มาตรฐาน 5ส = มาตรฐานกลาง + มาตรฐานพื้นที่</b><br>
มาตรฐาน<b>กลาง</b> คือสิ่งที่มีเหมือนกัน/พื้นที่ใช้ร่วมกัน<br>
มาตรฐาน<b>พื้นที่</b> คือมาตรฐานของแต่ละพื้นที่ ที่หัวหน้าพื้นที่และสมาชิกร่วมจัดทำขึ้น มี 3 ประเภท ได้แก่ จัดเก็บ ใช้งาน บำรุงรักษาเบื้องต้น<br>
<b>การจัดทำมาตรฐานพื้นที่จะต้องไม่ขัดแย้งกับมาตรฐานกลาง</b></div>
<table class="compare">
  <thead><tr><th>ช่วงเวลา</th><th>มาตรฐาน</th><th>ตัวอย่าง</th></tr></thead>
  <tbody>
    <tr><td><b>ก่อน</b>ทำงาน</td><td>มาตรฐานบำรุงรักษาเบื้องต้น</td><td>ตรวจสอบความพร้อมของอุปกรณ์/เครื่องจักร เช่น Checklist</td></tr>
    <tr><td><b>ระหว่าง</b>ทำงาน</td><td>มาตรฐานใช้งาน</td><td>คำอธิบายหรือวิธีการใช้งานเครื่องมือ/อุปกรณ์ เช่น คู่มือการใช้งาน</td></tr>
    <tr><td><b>หลัง</b>ทำงาน</td><td>มาตรฐานจัดเก็บ</td><td>แสดงสภาพเดิมก่อนการทำงาน เพื่อจัดเก็บให้คืนสภาพเดิม เช่น โต๊ะทำงาน</td></tr>
  </tbody>
</table>

<h3>ตัวอย่างมาตรฐานส่วนกลางของ Sansuisha</h3>
<figure><img class="page-img" src="${IMG["5s-std-walkway"]}" alt="มาตรฐานทางเดิน Walk Way พร้อมภาพที่ถูกต้องและไม่ถูกต้อง"><figcaption><b>ทางเดิน (Walk Way):</b> พื้นทาสีเขียว ขอบสีเหลือง สะอาด ไม่มีสิ่งของกีดขวาง เส้นไม่ลอก/ชำรุด เส้นสีเขียวกว้าง 800–1300 มม. เส้นสีเหลืองกว้าง 100 มม. และบริเวณทางร่วม ทางแยก มีสัญลักษณ์ “นิ้วชี้”</figcaption></figure>
<figure><img class="page-img" src="${IMG["5s-std-workarea"]}" alt="มาตรฐานการกำหนดขอบเขตการทำงานและวางชิ้นงาน"><figcaption><b>ขอบเขตการทำงานและวางชิ้นงาน:</b> กำหนดพื้นที่ด้วยเส้นสีขาว วางชิ้นงานหรือรถใส่ชิ้นงานให้อยู่ในขอบเขต พื้นที่สะอาด เป็นระเบียบ และสีเส้นต้องไม่มีสีทับกัน 2 สี</figcaption></figure>
<figure><img class="page-img" src="${IMG["5s-std-desk"]}" alt="มาตรฐานโต๊ะทำงานส่วนสำนักงานชั้น 2"><figcaption><b>โต๊ะทำงาน:</b> ติดป้ายชี้บ่งลิ้นชัก ลิ้นชักที่ 1 อุปกรณ์เครื่องเขียน ที่ 2 เอกสารการทำงาน/อุปกรณ์ ที่ 3 ของใช้ส่วนตัว และใต้โต๊ะไม่มีสิ่งของวางกีดขวาง</figcaption></figure>

<h3>ตัวอย่างมาตรฐานพื้นที่ของแต่ละแผนก</h3>
<figure><img class="page-img" src="${IMG["5s-std-facility"]}" alt="มาตรฐานแผนก Facility STC พื้นที่ Pre-Treatment"><figcaption><b>Facility:</b> พื้นที่ Pre-Treatment</figcaption></figure>
<figure><img class="page-img" src="${IMG["5s-std-delivery"]}" alt="มาตรฐานแผนก Delivery จุดจัดงาน BOX"><figcaption><b>Delivery:</b> จุดจัดงาน (BOX) แยกงานตามป้าย ทำ FIFO กำหนด MIN/MAX และทำบอร์ดแสดงยอดงานคงเหลือ</figcaption></figure>
<figure><img class="page-img" src="${IMG["5s-std-repair"]}" alt="มาตรฐานแผนก Repair ตู้เก็บอุปกรณ์ซ่อมสีและสีสเปรย์"><figcaption><b>Repair:</b> ตู้เก็บอุปกรณ์ซ่อมสีและสีสเปรย์</figcaption></figure>

<h3>ประโยชน์จากการ “สร้างมาตรฐาน”</h3>
<ol>
  <li>รักษาและปรับปรุงสภาพการทำ 3ส ให้เกิดความต่อเนื่อง</li>
  <li>มีแนวทางการปฏิบัติไปในทิศทางเดียวกัน</li>
  <li>สามารถปฏิบัติหน้าที่ทดแทนกันได้</li>

  <li>การปฏิบัติงานมีประสิทธิผลและมีประสิทธิภาพ</li>
</ol>

        body: `
<p class="lead">SHITSUKE (ชิทซึเคะ) · Discipline — สร้างแรงจูงใจและสร้างความเข้าใจที่ถูกต้อง</p>

      { q: "ข้อใดเรียงลำดับ 5ส ได้ถูกต้อง?", options: ["สะดวก สะสาง สะอาด สร้างวินัย สร้างมาตรฐาน", "สะสาง สะอาด สะดวก สร้างมาตรฐาน สร้างวินัย", "สะสาง สะดวก สะอาด สร้างมาตรฐาน สร้างวินัย", "สะอาด สะสาง สะดวก สร้างวินัย สร้างมาตรฐาน"], answer: 2 },

        body: `
<p class="lead">หลักการควบคุมอันตราย: <b>แหล่งต้นเหตุ (Source) → ทางผ่าน (Pathway) → ผู้ปฏิบัติงาน (Receiver)</b> — PPE คือด่านสุดท้ายที่ตัวผู้ปฏิบัติงาน</p>
<div class="grid3">
  <div class="card"><h4>ที่แหล่งต้นเหตุ</h4><p>เปลี่ยนสาร/วัสดุ ปรับปรุง Process แยก/ป้องกัน ระบายอากาศเฉพาะจุด บำรุงรักษาดี</p></div>
  <div class="card"><h4>ที่ทางผ่าน</h4><p>รักษาความสะอาด ระบายอากาศทั่วไป เพิ่มระยะห่าง ตรวจวัดสารเคมีในอากาศ</p></div>
  <div class="card"><h4>ที่ผู้ปฏิบัติงาน</h4><p>อบรม หมุนเวียนงาน ตรวจสุขภาพตามปัจจัยเสี่ยง และ<b>สวม PPE</b></p></div>
</div>

<h3>ประเภทของ PPE</h3>
<div class="grid2">
  <div class="card">😷 <b>ระบบหายใจ</b> — หน้ากากกรองอากาศ (ฝุ่น ละออง ฟูม แก๊ส ไอระเหย) หรือชุดส่งผ่านอากาศ (SCBA)</div>
  <div class="card">🥽 <b>ดวงตา/ใบหน้า</b> — แว่นนิรภัย ครอบตา (Goggles) กระบังหน้า (Face shield)</div>
  <div class="card">🧤 <b>มือ</b> — ถุงมือให้เหมาะกับสารเคมี ตรวจรอยชำรุดก่อนและหลังใช้</div>
  <div class="card">🥼 <b>ร่างกาย</b> — ชุดป้องกันสารเคมี Level A–D, ผ้ากันเปื้อน</div>
  <div class="card">🥾 <b>เท้า</b> — รองเท้านิรภัย รองเท้าบูททนสารเคมี</div>
</div>

<h3>การใช้และดูแล PPE</h3>
<ul class="check">
  <li>ตรวจสภาพก่อนใช้งานทุกครั้ง ไม่ใช้อุปกรณ์ที่เสียหาย</li>

  <li>ทำความสะอาดเสมอ เก็บในที่ร่ม อากาศถ่ายเท เป็นระเบียบ</li>
  <li>มีมาตรฐานรับรอง เช่น มอก. CE ANSI NIOSH</li>
  <li><b>หัวหน้างานต้องเป็นตัวอย่างที่ดีในการใช้ PPE</b></li>
</ul>`,

<p>รถยก (Forklift) มีความสำคัญมากในภาคอุตสาหกรรม แต่ยังมีผู้ใช้งานไม่ถูกวิธีจำนวนมาก จึงเกิดอุบัติเหตุ สินค้าเสียหาย เฉี่ยวชนอาคาร หรือร้ายแรงถึงบาดเจ็บ/เสียชีวิต <b>ผู้ขับจึงต้องผ่านการฝึกอบรม</b> ตามกฎกระทรวง (ราชกิจจานุเบกษา 6 ส.ค. 2564)</p>

<h3>ประเภทรถยก</h3>
<div class="grid2">
  <div class="card"><h4>Counterbalanced Trucks</h4><p>ชนิดน้ำหนักถ่วงสมดุล — เครื่องยนต์ (8FD/8FG), ไฟฟ้านั่งขับ 4 ล้อ (8FBN/8FB), 3 ล้อ (8FBE)</p></div>
  <div class="card"><h4>Reach Trucks</h4><p>เสาเลื่อนเข้า-ออกได้ — ยืนขับ หรือนั่งขับหันข้าง</p></div>
  <div class="card"><h4>Order Picker Trucks</h4><p>คนขับขึ้นไปจัดเรียงสินค้าบนที่สูง</p></div>
  <div class="card"><h4>Electric Motor Hand Trucks</h4><p>ชนิดมีแขนลากจูง เช่น Stacker, Power Pallet</p></div>
</div>

<h3>โครงสร้างหลัก</h3>
<p>เสา (Mast) · โซ่ยก (Lift Chains) · กระบอกยกเสา · แผงกั้นของ (Backrest) · งา (Fork) · หลังคา (Head Guard) · กระจกมองหลัง · น้ำหนักถ่วง (Counter Weight) · กระบอกคว่ำหงาย (Tilt Cylinder) · ล้อหน้า/ล้อหลัง</p>

<h3>กฎหมายกำหนดให้นายจ้าง (ส่วนที่ 4 รถยก)</h3>
<ul>
  <li>มีโครงหลังคาแข็งแรง ป้องกันวัสดุตกหล่น และป้ายบอกพิกัดน้ำหนักยก</li>
  <li><b>ตรวจสอบรถยกให้ใช้งานได้ดีและปลอดภัยก่อนใช้งานทุกครั้ง</b> และเก็บเอกสารการตรวจไว้</li>
  <li>มีสัญญาณเสียงหรือแสงไฟเตือนภัย และอุปกรณ์ช่วยการมองเห็น</li>
  <li>ผู้ขับรถยกนั่งขับ<b>ต้องสวมเข็มขัดนิรภัยตลอดเวลา</b></li>

<script>
(function () {
  "use strict";

  var PASS_PERCENT = 80;
  var KEY_STORE = "kp:hrkey";
  var app = KP.app, esc = KP.esc, icon = KP.icon, api = KP.api;
  var courses = window.COURSES || [];
  var state = {
    rows: [], employees: [], schedule: [], settings: {}, loadedAt: null,
    dept: "", group: "", status: "", search: "", tableLimit: 30,
    adminQ: "", adminLimit: 30,
  };
  var hrKey = null;

  function readSession() { try { return sessionStorage.getItem(KEY_STORE); } catch (e) { return null; } }
  function writeSession(v) {
    try { if (v) sessionStorage.setItem(KEY_STORE, v); else sessionStorage.removeItem(KEY_STORE); } catch (e) { /* ignore */ }
  }
  function fmtDate(iso) {
    if (!iso) return "";
    var d = new Date(iso);
    if (isNaN(d)) return "";
    return d.toLocaleDateString("th-TH", { day: "numeric", month: "short", year: "2-digit" }) +
      " " + d.toLocaleTimeString("th-TH", { hour: "2-digit", minute: "2-digit" });
  }
  function fmtDay(iso) { return KP.fmtDay(iso, true); }
  function getCourse(id) {
    for (var i = 0; i < courses.length; i++) if (courses[i].id === id) return courses[i];
    return null;
  }
  function average(nums) {
    return nums.length ? Math.round(nums.reduce(function (a, b) { return a + b; }, 0) / nums.length) : null;
  }
  function percent(n, total) { return total ? Math.round((n / total) * 100) : 0; }

  /* ---------- data ---------- */
  // one entry per employee: roster from the Employees tab plus anyone found only in Progress
  function buildPeople() {
    var people = {};
    var order = [];
    function person(id, name, dept) {
      var k = String(id || "").trim().toUpperCase();
      if (!people[k]) {
        people[k] = { id: k, name: name || "", dept: dept || "", inRoster: false, courses: {}, last: null };
        order.push(k);
      }
      return people[k];
    }
    state.employees.forEach(function (e) {
      var p = person(e.id, e.name, e.dept);
      p.inRoster = true;
      p.team = e.team;
    });
    state.rows.forEach(function (r) {
      var p = person(r.employeeId, r.name, r.dept);
      var course = getCourse(r.courseId);
      var total = course ? course.lessons.length : r.lessonsTotal;
      var doneCount = (r.done || []).filter(function (i) { return i < total; }).length;
      var passed = r.bestScore !== null && r.bestScore >= PASS_PERCENT;
      var pre = r.preScore === undefined ? null : r.preScore;
      p.courses[r.courseId] = {
        doneCount: doneCount, total: total, best: r.bestScore, pre: pre, passed: passed, round: r.round || 1,
        completedAt: r.completedAt || "", retakeAt: r.retakeAt || "", canRetake: !!r.canRetake,
        pct: r.completedAt ? 100 : Math.round((((pre !== null ? 1 : 0) + doneCount + (passed ? 1 : 0)) / (total + 2)) * 100),
      };
      if (r.updatedAt && (!p.last || r.updatedAt > p.last)) p.last = r.updatedAt;
    });
    return order.map(function (k) {
      var p = people[k];
      p.completed = courses.filter(function (c) { return p.courses[c.id] && p.courses[c.id].pct === 100; }).length;
      p.started = Object.keys(p.courses).length > 0;
      p.retakeDue = courses.some(function (c) { return p.courses[c.id] && p.courses[c.id].canRetake; });
      return p;
    });
  }

  function filtered(people) {
    var q = state.search.trim().toLowerCase();
    return people.filter(function (p) {
      if (state.dept && p.dept !== state.dept) return false;
      if (state.status === "retake" && !p.retakeDue) return false;
      if (state.status === "all-done" && p.completed !== courses.length) return false;
      if (state.status === "in-progress" && (!p.started || p.completed === courses.length)) return false;
      if (state.status === "not-started" && p.started) return false;
      if (q && (p.id + " " + p.name + " " + (p.team || "")).toLowerCase().indexOf(q) === -1) return false;
      return true;
    });
  }
  function applyData(res) {
    if (res.rows) state.rows = res.rows;
    state.employees = res.employees || state.employees;
    state.schedule = res.schedule || state.schedule;
    state.settings = res.courseSettings || state.settings;
  }
  function load(key) {
    return api("apiReport", key).then(function (res) {
      if (!res || !res.ok) throw new Error((res && res.error) || "error");
      applyData(res);
      state.loadedAt = new Date();
      hrKey = key;
    });
  }

  /* ---------- login ---------- */
  function renderLogin(message) {
    app.innerHTML =
      '<div class="login-wrap"><section class="login-side"><h2>รายงานและการจัดการระบบ</h2>' +
      "<p>ดูภาพรวมการเรียนรู้ของทั้งบริษัท จัดการพนักงาน หลักสูตร และตารางอบรม</p></section>" +
      '<section class="login-main"><form class="login-card" id="login" autocomplete="off">' +
      '<div class="login-brand">' + KP.brandLogo(false) + "</div><h1>สำหรับฝ่ายบุคคล</h1>" +
      '<p class="sub">กรุณาใส่รหัสผ่าน HR</p>' +
      '<div class="field"><label for="hrkey">รหัสผ่าน HR</label>' +
      '<input id="hrkey" type="password" required autofocus></div>' +
      '<div class="error" id="err" role="alert">' + esc(message || "") + "</div>" +
      '<button class="btn block" type="submit" id="go">เข้าสู่ระบบ</button>' +
      '<div class="login-foot"><a href="' + esc(KP.homeUrl) + '" target="_top">กลับหน้าเรียนรู้</a></div>' +
      "</form></section></div>";
    document.getElementById("login").addEventListener("submit", function (e) {
      e.preventDefault();
      var key = document.getElementById("hrkey").value;
      var btn = document.getElementById("go");
      btn.disabled = true; btn.textContent = "กำลังโหลด…";
      load(key).then(function () {
        writeSession(key);
        route();
      }, function (err) {
        btn.disabled = false; btn.textContent = "เข้าสู่ระบบ";
        document.getElementById("err").textContent = err.message === "unauthorized"
          ? "รหัสผ่านไม่ถูกต้อง" : "เชื่อมต่อระบบไม่สำเร็จ กรุณาตรวจสอบอินเทอร์เน็ต";
      });
    });
  }

  function mount(active, content) {
    app.innerHTML = KP.shell({
      page: "report", active: active, content: content,
      topLeft: '<span class="muted">ข้อมูลล่าสุด ' + esc(fmtDate(state.loadedAt && state.loadedAt.toISOString())) + "</span>",
      topActions: '<button class="btn ghost small" id="refresh">' + icon("refresh", 16) + " โหลดใหม่</button>",
      user: { name: "ฝ่ายบุคคล", sub: "ผู้ดูแลระบบ", mark: "user" },
    });
    document.getElementById("logout").addEventListener("click", function () {
      writeSession(null); hrKey = null; state.rows = []; state.employees = [];
      location.hash = "";
      renderLogin();
    });
    document.getElementById("refresh").addEventListener("click", function (e) {
      var b = e.currentTarget;
      b.disabled = true; b.textContent = "กำลังโหลด…";
      load(hrKey).then(route, function () {
        b.disabled = false; b.textContent = "โหลดใหม่ไม่สำเร็จ";
      });
    });
    window.scrollTo(0, 0);
  }

  /* ---------- 6. Reports ---------- */
  function cell(c) {
    if (!c) return '<td class="c-none">–</td>';
    var round = c.round > 1 ? " · รอบ " + c.round : "";
    var pre = "ก่อน " + (c.pre !== null ? c.pre + "%" : "–");
    if (c.pct === 100) {
      return '<td class="c-done"><b>จบแล้ว</b><small>' + pre + " → หลัง " + (c.best !== null ? c.best + "%" : "–") + round + "</small>" +
        "<small>จบ " + esc(fmtDay(c.completedAt)) + "</small>" +
        "<small>" + (c.canRetake ? "ครบกำหนดเรียนใหม่แล้ว" : "เรียนใหม่ได้ " + esc(fmtDay(c.retakeAt))) + "</small></td>";
    }
    return '<td class="c-doing"><b>' + c.pct + "%</b><small>" + pre + (c.best !== null ? " · หลัง " + c.best + "%" : "") + round + "</small>" +
      "<small>อ่าน " + c.doneCount + "/" + c.total + " บท</small></td>";
  }
  function monthlyCompletions(list) {
    var now = new Date(), months = [];
    for (var i = 5; i >= 0; i--) {
      var d = new Date(now.getFullYear(), now.getMonth() - i, 1);
      months.push({ key: KP.ymd(d).slice(0, 7), label: d.toLocaleDateString("th-TH", { month: "short" }), n: 0 });
    }
    list.forEach(function (p) {
      Object.keys(p.courses).forEach(function (id) {
        var at = p.courses[id].completedAt;
        if (!at) return;
        var key = KP.ymd(new Date(at)).slice(0, 7);
        months.forEach(function (m) { if (m.key === key) m.n++; });
      });
    });
    return months;
  }

  function renderReport() {
    var people = buildPeople();
    var list = filtered(people);
    var depts = [];
    people.forEach(function (p) { if (p.dept && depts.indexOf(p.dept) === -1) depts.push(p.dept); });
    depts.sort();
    var shown = courses.filter(function (c) { return !state.group || c.scope + "/" + c.group === state.group; });
    var GROUP_NAMES = {};
    courses.forEach(function (c) { GROUP_NAMES[c.scope + "/" + c.group] = KP.scopeLabel(c) + " · " + KP.groupLabel(c); });

    // ตัวเลขสรุป: คิดจากพนักงานและหมวดที่กรองอยู่
    var enrolled = 0, finished = 0, gains = [];
    list.forEach(function (p) {
      shown.forEach(function (c) {
        var x = p.courses[c.id];
        if (!x) return;
        enrolled++;
        if (x.pct === 100) finished++;
        if (x.pct === 100 && x.pre !== null && x.best !== null) gains.push(x.best - x.pre);
      });
    });
    var participants = list.filter(function (p) { return shown.some(function (c) { return p.courses[c.id]; }); }).length;
    var dueCount = list.filter(function (p) { return p.retakeDue; }).length;
    var gain = average(gains);

    var deptBars = depts.filter(function (d) { return !state.dept || d === state.dept; }).map(function (d) {
      var inDept = list.filter(function (p) { return p.dept === d; });
      var started = inDept.filter(function (p) { return p.started; }).length;
      return { d: d, started: started, total: inDept.length, pct: percent(started, inDept.length) };
    }).filter(function (x) { return x.total; }).sort(function (a, b) { return b.pct - a.pct; }).map(function (x) {
      return KP.hbar(x.d, x.pct, x.pct + "%", x.d + ": เริ่มเรียนแล้ว " + x.started + " จาก " + x.total + " คน");
    }).join("");

    var courseStats = shown.map(function (c) {
      var done = 0, doing = 0, pres = [], posts = [];
      list.forEach(function (p) {
        var x = p.courses[c.id];
        if (!x) return;
        if (x.pct === 100) done++; else doing++;
        if (x.pre !== null) pres.push(x.pre);
        if (x.best !== null) posts.push(x.best);
      });
      return { c: c, done: done, doing: doing, pre: average(pres), post: average(posts) };
    });
    var courseBars = courseStats.slice().sort(function (a, b) { return b.done - a.done; }).map(function (x) {
      return KP.hbar(x.c.title, percent(x.done, list.length), x.done + " คน",
        x.c.title + ": จบ " + x.done + " · กำลังเรียน " + x.doing + " · ยังไม่เริ่ม " + (list.length - x.done - x.doing) + " คน");
    }).join("");
    var scoreRows = courseStats.filter(function (x) { return x.pre !== null || x.post !== null; }).map(function (x) {
      return '<div class="pair" title="' + esc(x.c.title + ": ก่อนเรียน " + (x.pre === null ? "–" : x.pre + "%") + " · หลังเรียน " + (x.post === null ? "–" : x.post + "%")) + '">' +
        '<div class="pair-name">' + esc(x.c.title) + '</div><div class="pair-bars"><i class="key-pre" style="width:' + (x.pre || 0) + '%"></i><i class="key-post" style="width:' + (x.post || 0) + '%"></i></div>' +
        '<div class="pair-val">' + (x.pre === null ? "–" : x.pre) + " → " + (x.post === null ? "–" : x.post) + "</div></div>";
    }).join("");
    var months = monthlyCompletions(list);
    var maxMonth = Math.max.apply(null, months.map(function (m) { return m.n; }).concat([1]));
    var monthChart = '<div class="months">' + months.map(function (m) {
      return '<div class="month" title="' + esc(m.label + ": จบ " + m.n + " หลักสูตร") + '"><b>' + m.n + '</b><i style="height:' + Math.round((m.n / maxMonth) * 100) + '%"></i><span>' + esc(m.label) + "</span></div>";
    }).join("") + "</div>";

    var head = "<tr><th>รหัส</th><th>ชื่อ</th><th>ฝ่าย</th>" +
      shown.map(function (c) { return '<th title="' + esc(c.title) + '">' + esc(c.title) + "</th>"; }).join("") +

  function downloadCsv(list) {
    var header = ["รหัสพนักงาน", "ชื่อ", "ฝ่าย", "ส่วนงาน"];
    courses.forEach(function (c) {
      header.push(c.title + " - สถานะ", c.title + " - ความคืบหน้า%", c.title + " - คะแนนก่อนเรียน%", c.title + " - คะแนนหลังเรียน%",
        c.title + " - วันที่จบ", c.title + " - เรียนใหม่ได้ตั้งแต่", c.title + " - รอบที่");
    });
    header.push("จำนวนหลักสูตรที่จบ", "ใช้งานล่าสุด");
    var lines = [header];
    list.forEach(function (p) {
      var row = [p.id, p.name, p.dept, p.team || ""];
      courses.forEach(function (c) {
        var x = p.courses[c.id];
        row.push(!x ? "ยังไม่เริ่ม" : x.pct === 100 ? "จบแล้ว" : "กำลังเรียน", x ? x.pct : 0,
          x && x.pre !== null ? x.pre : "", x && x.best !== null ? x.best : "",
          x ? fmtDay(x.completedAt) : "", x ? fmtDay(x.retakeAt) : "", x ? x.round : "");
      });
      row.push(p.completed, fmtDate(p.last));
      lines.push(row);
    });
    var csv = lines.map(function (r) {
      return r.map(function (v) { return '"' + String(v).replace(/"/g, '""') + '"'; }).join(",");
    }).join("\r\n");
    // BOM so Excel opens Thai text correctly
    var a = document.createElement("a");
    a.href = "data:text/csv;charset=utf-8," + encodeURIComponent("﻿" + csv);
    a.download = "knowledge-progress-" + new Date().toISOString().slice(0, 10) + ".csv";
    document.body.appendChild(a); a.click(); a.remove();
  }

  function openForm(title, fieldsHtml, onSave) {
    var dlg = document.createElement("dialog");
    dlg.innerHTML = '<form id="dlg-form"><div class="dlg-head"><h2>' + esc(title) + '</h2></div><div class="dlg-body">' + fieldsHtml +

      '<button type="submit" class="btn" id="dlg-save">บันทึก</button></div></form>';
    document.body.appendChild(dlg);
    dlg.addEventListener("close", function () { dlg.remove(); });
    dlg.querySelector("#dlg-cancel").addEventListener("click", function () { dlg.close(); dlg.remove(); });
    dlg.querySelector("form").addEventListener("submit", function (e) {
      e.preventDefault();
      var values = {};
      dlg.querySelectorAll("[name]").forEach(function (el) { values[el.name] = el.type === "checkbox" ? el.checked : el.value.trim(); });
      var btn = dlg.querySelector("#dlg-save");

      onSave(values).then(function () {
        dlg.close();

      var e = ev || { date: today, start: "09:00", end: "12:00" };
      openForm(ev ? "แก้ไขตารางอบรม" : "เพิ่มตารางอบรม",
        '<div class="field"><label for="f-courseId">หลักสูตรที่เกี่ยวข้อง</label><select id="f-courseId" name="courseId"><option value="">ไม่ผูกกับหลักสูตร</option>' +
        courses.map(function (c) { return '<option value="' + c.id + '"' + (c.id === e.courseId ? " selected" : "") + ">" + esc(c.title) + "</option>"; }).join("") + "</select></div>" +
        input("title", "ชื่อการอบรม *", e.title, ' required maxlength="200"') +
        input("date", "วันที่ *", e.date, ' type="date" required') +
        '<div class="field-row">' + input("start", "เวลาเริ่ม *", e.start, ' type="time" required') + input("end", "เวลาเลิก *", e.end, ' type="time" required') + "</div>" +
        input("location", "สถานที่", e.location, ' maxlength="200"') +
        '<div class="field-row">' + input("trainer", "วิทยากร", e.trainer, ' maxlength="120"') + input("capacity", "จำนวนที่รับ (คน)", e.capacity || "", ' type="number" min="0"') + "</div>" +
        input("note", "หมายเหตุ", e.note, ' maxlength="500"'),
        function (v) { v.id = ev ? ev.id : ""; return adminCall("saveSchedule", v); });
    }
    function find(id) {
      for (var i = 0; i < state.schedule.length; i++) if (state.schedule[i].id === id) return state.schedule[i];
      return null;
    }
    document.getElementById("add").addEventListener("click", function () { form(); });
    document.getElementById("sched").addEventListener("click", function (e) {
      var edit = e.target.closest("[data-edit]"), del = e.target.closest("[data-del]");
      if (edit) { form(find(edit.getAttribute("data-edit"))); return; }
      if (!del) return;
      var ev = find(del.getAttribute("data-del"));
      if (!ev || !confirm("ลบตารางอบรม \"" + ev.title + "\" ?")) return;
      del.disabled = true;
      adminCall("deleteSchedule", { id: ev.id }).then(function () { toast("ลบแล้ว"); route(); }, function (err) { del.disabled = false; alert(err.message); });
    });
  }

  /* ---------- router ---------- */
  function route() {
    if (!hrKey) { renderLogin(); return; }
    var parts = location.hash.replace(/^#\/?/, "").split("/");
    if (parts[0] === "admin") {
      if (parts[1] === "courses") renderAdminCourses();
      else if (parts[1] === "schedule") renderAdminSchedule();
      else renderAdminEmployees();
      return;
    }
    renderReport();
  }
  window.addEventListener("hashchange", route);

  /* ---------- start ---------- */
  var savedKey = readSession();
  if (savedKey) {
    app.innerHTML = '<div class="loading">กำลังโหลดรายงาน…</div>';
    load(savedKey).then(route, function () { writeSession(null); renderLogin(); });
  } else {
    renderLogin();
  }
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>รายงานความคืบหน้า (HR)</title>
<script>window.KP_API_URL = "https://script.google.com/macros/s/AKfycbzPjdPRRxNKaTWaR8CP2qFyGToMMiTFM_XJctdxfYMqpFY_04P7L89nMIS3qX5ku8CgWQ/exec";</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600&family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f4f7f6;
  --surface: #ffffff;
  --ink: #1b2a27;
  --ink-2: #51625e;
  --line: #dfe7e4;
  --brand: #0f8a6c;
  --brand-ink: #0b6650;
  --brand-soft: #e3f4ef;
  --warn-soft: #fff4e5;
  --warn: #b45309;
  --danger: #b91c1c;
  --radius: 14px;
  --shadow: 0 1px 2px rgba(16, 40, 34, .06), 0 4px 16px rgba(16, 40, 34, .06);
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  font-family: "Sarabun", "Leelawadee UI", "Tahoma", sans-serif;
  font-size: 17px; line-height: 1.7;
  color: var(--ink); background: var(--bg);
}
img { max-width: 100%; height: auto; }
button { font: inherit; cursor: pointer; }
a { color: var(--brand-ink); }

/* ---------- Login ---------- */
.login-wrap {
  min-height: 100vh; display: grid; place-items: center; padding: 24px 16px;
  background: radial-gradient(1200px 600px at 10% -10%, #cdeee4 0%, transparent 60%),
              radial-gradient(900px 500px at 110% 110%, #dbe7ff 0%, transparent 60%), var(--bg);
}
.login-card {
  width: 100%; max-width: 420px; background: var(--surface); border-radius: 20px;
  box-shadow: var(--shadow); padding: 36px 28px;
}
.login-card .logo { font-size: 40px; line-height: 1; }
.login-card h1 { font-size: 26px; margin: 12px 0 4px; }
.login-card p.sub { color: var(--ink-2); margin: 0 0 24px; }
.field label { display: block; font-weight: 600; margin-bottom: 6px; }
.field input {
  width: 100%; font: inherit; font-size: 18px; padding: 12px 14px; letter-spacing: .5px;
  border: 1.5px solid var(--line); border-radius: 10px; outline: none; background: #fbfdfc;
}
.field input:focus { border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-soft); }
.error { color: var(--danger); font-size: 15px; min-height: 24px; margin: 6px 0 4px; }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  border: 0; border-radius: 10px; padding: 11px 20px; font-weight: 600;
  background: var(--brand); color: #fff; text-decoration: none;
}
.btn:hover { background: var(--brand-ink); }
.btn.block { width: 100%; padding: 13px; font-size: 18px; }
.btn.ghost { background: transparent; color: var(--brand-ink); border: 1.5px solid var(--line); }
.btn.ghost:hover { background: var(--brand-soft); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.login-foot { color: var(--ink-2); font-size: 14px; margin-top: 18px; text-align: center; }

/* ---------- Company logo + department ---------- */
.brand-logo { display: inline-flex; flex-direction: column; align-items: center; gap: 6px; text-decoration: none; }
.brand-logo img { display: block; width: 230px; height: auto; }
.brand-logo .dept {
  display: flex; align-items: center; gap: 10px;
  font-family: "Orbitron", "Segoe UI", sans-serif; font-weight: 600; font-size: 12.5px;
  letter-spacing: .38em; margin-right: -.38em; /* letter-spacing adds trailing space; pull it back to stay centered */
  color: #1f7a5c; text-transform: uppercase; white-space: nowrap;
}
.brand-logo .dept::before, .brand-logo .dept::after {
  content: ""; width: 16px; height: 1.5px; background: linear-gradient(90deg, transparent, #5fb053);
}
.brand-logo .dept::after { background: linear-gradient(90deg, #5fb053, transparent); margin-right: .38em; }
.brand-logo.small { gap: 3px; }
.brand-logo.small img { width: 128px; }
.brand-logo.small .dept { font-size: 7.5px; gap: 6px; letter-spacing: .34em; margin-right: -.34em; }
.brand-logo.small .dept::before, .brand-logo.small .dept::after { width: 8px; height: 1px; }
.topbar .brand { flex-shrink: 0; }
.topbar .btn { white-space: nowrap; }
.login-brand { display: flex; justify-content: center; padding-bottom: 20px; margin-bottom: 20px; border-bottom: 1px solid var(--line); }
.site-name { font-weight: 700; font-size: 16px; color: var(--ink); padding-left: 14px; margin-left: 4px; border-left: 1px solid var(--line); line-height: 1.3; }

/* ---------- Top bar ---------- */
.topbar {
  position: sticky; top: 0; z-index: 10; background: var(--surface);
  border-bottom: 1px solid var(--line);
}
.topbar-inner {
  max-width: 1100px; margin: 0 auto; padding: 10px 16px;
  display: flex; align-items: center; gap: 12px;
}
.brand { font-weight: 700; font-size: 18px; color: var(--ink); text-decoration: none; display: flex; gap: 8px; align-items: center; }
.spacer { flex: 1; }
.sync { font-size: 13px; color: var(--ink-2); white-space: nowrap; }
.sync.error { color: var(--danger); font-weight: 600; }
.user-chip { color: var(--ink-2); font-size: 15px; text-align: right; line-height: 1.3; }
.user-chip b { color: var(--ink); display: block; }

/* ---------- Dashboard ---------- */
.container { max-width: 1100px; margin: 0 auto; padding: 24px 16px 64px; }
.hero h2 { font-size: 28px; margin: 4px 0 2px; }
.hero p { color: var(--ink-2); margin: 0; }
.overall {
  margin: 20px 0 28px; background: var(--surface); border-radius: var(--radius);
  box-shadow: var(--shadow); padding: 18px 20px; display: flex; gap: 24px; flex-wrap: wrap;
}
.overall .stat b { font-size: 26px; display: block; line-height: 1.2; }
.overall .stat span { color: var(--ink-2); font-size: 14px; }
.course-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 18px; }
.course-card {
  background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow);
  overflow: hidden; display: flex; flex-direction: column; text-decoration: none; color: inherit;
  border-top: 5px solid var(--c, var(--brand)); transition: transform .12s ease;
}
.course-card:hover { transform: translateY(-2px); }
.course-card .body { padding: 18px 20px; flex: 1; }
.course-card .icon { font-size: 30px; }
.course-card h3 { margin: 6px 0 4px; font-size: 20px; line-height: 1.4; }
.course-card p { margin: 0; color: var(--ink-2); font-size: 15px; }
.course-card .meta { color: var(--ink-2); font-size: 14px; margin-top: 10px; }
.course-card .foot { padding: 12px 20px 16px; border-top: 1px solid var(--line); }
.bar { height: 8px; background: #e8eeec; border-radius: 99px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--c, var(--brand)); border-radius: 99px; }
.foot-row { display: flex; justify-content: space-between; font-size: 14px; color: var(--ink-2); margin-top: 6px; }
.badge { display: inline-block; font-size: 13px; font-weight: 600; padding: 2px 10px; border-radius: 99px; background: var(--brand-soft); color: var(--brand-ink); }
.badge.todo { background: #eef2f1; color: var(--ink-2); }
.badge.doing { background: var(--warn-soft); color: var(--warn); }

/* ---------- Course layout ---------- */
.course-layout { display: grid; grid-template-columns: 280px 1fr; gap: 24px; align-items: start; }
.side {
  position: sticky; top: 72px; background: var(--surface); border-radius: var(--radius);
  box-shadow: var(--shadow); padding: 14px;
}
.side h4 { margin: 4px 8px 10px; font-size: 15px; color: var(--ink-2); font-weight: 600; }
.side a {
  display: flex; gap: 10px; align-items: flex-start; padding: 9px 10px; border-radius: 10px;
  color: var(--ink); text-decoration: none; font-size: 15px; line-height: 1.45;
}
.side a:hover { background: #f1f5f4; }
.side a.active { background: var(--brand-soft); font-weight: 600; }
.side .dot {
  flex: 0 0 22px; height: 22px; border-radius: 50%; border: 2px solid var(--line);
  display: grid; place-items: center; font-size: 12px; color: #fff; margin-top: 1px;
}
.side .dot.done { background: var(--c, var(--brand)); border-color: var(--c, var(--brand)); }
.back { display: inline-block; margin-bottom: 12px; text-decoration: none; font-size: 15px; }

.lesson {
  background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow);
  padding: 28px 32px; min-width: 0;
}
.lesson .kicker { color: var(--c, var(--brand)); font-weight: 600; font-size: 15px; }
.lesson h2 { margin: 2px 0 6px; font-size: 26px; line-height: 1.35; }
.lesson .src { color: var(--ink-2); font-size: 14px; margin-bottom: 18px; }
.lesson h3 { font-size: 20px; margin: 28px 0 10px; color: var(--ink); }
.lesson h4 { margin: 0 0 6px; font-size: 17px; }
.lesson .lead { font-size: 18px; color: var(--ink-2); }
.lesson figure { margin: 16px 0; text-align: center; }
.lesson figure img { border: 1px solid var(--line); border-radius: 10px; background: #fff; max-height: 460px; }
.lesson figcaption { color: var(--ink-2); font-size: 15px; margin-top: 6px; }
.lesson ul, .lesson ol { padding-left: 1.4em; }
.lesson-nav { display: flex; justify-content: space-between; gap: 12px; margin-top: 32px; padding-top: 20px; border-top: 1px solid var(--line); flex-wrap: wrap; }

.callout { background: var(--brand-soft); border-left: 4px solid var(--brand); padding: 14px 16px; border-radius: 10px; margin: 16px 0; }
.callout.strong { background: #fdf2f2; border-color: #dc2626; }
.callout.warn { background: var(--warn-soft); border-color: var(--warn); }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin: 14px 0; }
.grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin: 14px 0; }
.card { border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; background: #fbfdfc; }
.card p { margin: 6px 0; }
.card ul { margin: 6px 0; }
.card.muted { background: #f7f7f7; }
.card.tip { background: #fffbea; border-color: #f4e3a1; margin-top: 20px; }
.tag { font-size: 15px; color: var(--ink-2); }
.example { font-style: italic; }
.muted-text { color: var(--ink-2); font-style: italic; }
.refs { color: var(--ink-2); font-size: 14px; margin-top: 24px; }
table.compare { width: 100%; border-collapse: collapse; margin: 10px 0; font-size: 16px; }
table.compare th { background: var(--brand); color: #fff; padding: 10px; }
table.compare td { border: 1px solid var(--line); padding: 10px; text-align: center; }
table.compare tr:nth-child(even) td { background: #f6faf9; }
.triad { text-align: center; margin: 12px 0; }
.triad-top { display: inline-block; background: #fffbd6; border: 1px solid #e6dd8a; border-radius: 99px; padding: 8px 22px; font-weight: 600; }
.triad-row { display: flex; justify-content: center; align-items: center; gap: 14px; margin-top: 12px; flex-wrap: wrap; }
.triad-row span { background: #fffbd6; border: 1px solid #e6dd8a; border-radius: 50%; width: 96px; height: 96px; display: grid; place-items: center; font-weight: 600; }
.triad-row b { color: var(--brand-ink); }
.steps { list-style: none; padding: 0 !important; display: grid; gap: 10px; }
.steps li { background: #eefcfb; border: 1px solid #bfe9e4; border-radius: 12px; padding: 12px 16px; }
.steps em { color: var(--danger); font-style: normal; font-weight: 600; }
.step-no { display: inline-block; background: var(--brand); color: #fff; border-radius: 6px; padding: 0 10px; margin-right: 8px; font-weight: 700; font-size: 14px; }
.frame4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin: 12px 0; }
.frame4 div { background: #fbfdfc; border: 1px solid var(--line); border-radius: 12px; padding: 12px; text-align: center; }
.frame4 b { display: block; background: var(--brand); color: #fff; border-radius: 99px; padding: 2px 0; margin-bottom: 6px; }
.frame4 span { font-size: 15px; }
.quote-list { list-style: none; padding: 0 !important; font-weight: 600; }
.cols2 { columns: 2; column-gap: 32px; }
.diamond { list-style: "♦  "; }
.check { list-style: "✓  "; }
.check.big li { margin: 6px 0; font-size: 18px; }
.numbered-cards li { margin: 8px 0; }
.smcr { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin: 14px 0; }
.smcr div { text-align: center; background: #eef4ff; border: 1px solid #c9d8fb; border-radius: 12px; padding: 12px 6px; }
.smcr b { display: block; font-size: 30px; color: #2563eb; line-height: 1.2; }
.smcr span { font-size: 15px; }
.pdca-wheel { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; max-width: 320px; margin: 4px auto 20px; }
.pdca-wheel .q { padding: 18px 10px; text-align: center; color: #fff; font-weight: 600; line-height: 1.3; }
.pdca-wheel .q b { display: block; font-size: 30px; }
.pdca-wheel .p { background: #4f97b3; border-radius: 120px 12px 12px 12px; }
.pdca-wheel .d { background: #8b7bb5; border-radius: 12px 120px 12px 12px; }
.pdca-wheel .a { background: #4b9e73; border-radius: 12px 12px 12px 120px; }
.pdca-wheel .c { background: #c4677d; border-radius: 12px 12px 120px 12px; }
.phase { border-left: 5px solid; padding: 2px 0 2px 18px; margin: 18px 0; }
.phase h3 { margin-top: 6px; }
.phase.p { border-color: #4f97b3; } .phase.d { border-color: #8b7bb5; }
.phase.c { border-color: #c4677d; } .phase.a { border-color: #4b9e73; }

.grid5s { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin: 14px 0; }
.grid5s div { text-align: center; background: #f3edff; border: 1px solid #d8c8fb; border-radius: 12px; padding: 10px 4px; font-weight: 600; font-size: 15px; line-height: 1.35; }
.grid5s b { display: block; font-size: 24px; color: #7c3aed; }
.grid5s small { display: block; color: var(--ink-2); font-weight: 400; }
.ghs-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 12px 0; }
.ghs-grid div { text-align: center; font-size: 30px; border: 2px solid #dc2626; border-radius: 10px; padding: 8px 4px; background: #fff; }
.ghs-grid span { display: block; font-size: 14px; color: var(--ink); }
.why-chain { display: grid; gap: 8px; margin: 14px 0; }
.why-chain div { border-left: 4px solid #0891b2; background: #ecfeff; border-radius: 8px; padding: 8px 14px; }
.why-chain div.root { border-color: #dc2626; background: #fdf2f2; font-weight: 600; }
.why-chain b { display: inline-block; min-width: 90px; color: #0e7490; }
.why-chain .root b { color: var(--danger); }

/* ---------- Quiz ---------- */
.q-item { border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; margin: 14px 0; }
.q-item .q-title { font-weight: 600; margin-bottom: 8px; }
.q-item label {
  display: flex; gap: 10px; align-items: flex-start; padding: 8px 10px; border-radius: 8px;
  cursor: pointer; border: 1px solid transparent;
}
.q-item label:hover { background: #f4f8f7; }
.q-item input { margin-top: 7px; accent-color: var(--brand); }
.q-item label.right { background: #e7f7ef; border-color: #9ad8b8; }
.q-item label.wrong { background: #fdecec; border-color: #f2b1b1; }
.result {
  border-radius: 14px; padding: 20px; text-align: center; margin: 20px 0;
  background: var(--brand-soft);
}
.result.fail { background: var(--warn-soft); }
.result .score { font-size: 40px; font-weight: 700; line-height: 1.2; }

/* ---------- HR report ---------- */
.container.wide { max-width: 1400px; }
.report-head h2 { margin: 0; font-size: 26px; }
.sum-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; margin: 18px 0; }
.sum-card { background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); padding: 16px 18px; border-top: 4px solid var(--c, var(--brand)); }
.sum-title { font-weight: 600; font-size: 15px; line-height: 1.4; }
.sum-big { font-size: 30px; font-weight: 700; margin: 4px 0 8px; }
.sum-big span { font-size: 15px; font-weight: 400; color: var(--ink-2); }
.filters { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin: 8px 0 12px; }
.filters input, .filters select { font: inherit; font-size: 15px; padding: 8px 12px; border: 1.5px solid var(--line); border-radius: 10px; background: var(--surface); }
.filters input { min-width: 220px; }
.table-wrap { overflow-x: auto; background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); }
table.report { width: 100%; border-collapse: collapse; font-size: 15px; }
table.report th { text-align: left; background: #f1f5f4; padding: 10px 12px; font-weight: 600; white-space: nowrap; max-width: 220px; overflow: hidden; text-overflow: ellipsis; position: sticky; top: 0; }
table.report td { padding: 9px 12px; border-top: 1px solid var(--line); vertical-align: top; white-space: nowrap; }
table.report td small { display: block; color: var(--ink-2); font-size: 13px; }
td.c-done b { color: var(--brand-ink); }
td.c-doing b { color: var(--warn); }
td.c-none { color: #9aa8a5; text-align: center; }
td.c-count { font-weight: 700; text-align: center; }
td.c-date { color: var(--ink-2); font-size: 14px; }

/* ---------- Responsive ---------- */
@media (max-width: 860px) {
  .course-layout { grid-template-columns: 1fr; }
  .side { position: static; }
  .lesson { padding: 20px 18px; }
  .grid2, .grid3 { grid-template-columns: 1fr; }
  .frame4, .smcr { grid-template-columns: 1fr 1fr; }
  .grid5s { grid-template-columns: repeat(3, 1fr); }
  .ghs-grid { grid-template-columns: 1fr 1fr; }
  .cols2 { columns: 1; }
  .user-chip span { display: none; }
  .site-name { display: none; }
}
@media (max-width: 520px) {
  .topbar .user-chip { display: none; }
  .topbar .btn { padding: 8px 12px; font-size: 15px; }
  .topbar .sync { font-size: 12px; white-space: normal; text-align: right; }
}

</style>

</head>
<body>
<div id="app" data-url="index.html" data-home="index.html" data-report="report.html"></div>

<p>แบบจำลอง <b>S-M-C-R</b> ตามแนวคิดของเบอร์โล (Berlo)</p>
<div class="smcr">
  <div><b>S</b><span>ผู้ส่งสาร<br>Sender</span></div>
  <div><b>M</b><span>สาร<br>Message</span></div>
  <div><b>C</b><span>ช่องทาง<br>Channel</span></div>
  <div><b>R</b><span>ผู้รับสาร<br>Receiver</span></div>
</div>

<h3>ผู้ส่งสาร (Sender)</h3>
<p>ผู้ที่ต้องการสื่อสารต้องทำความเข้าใจเรื่องที่จะสื่อสารให้ชัดเจนก่อน อาจใช้การพูดคุย ออกคำสั่ง บันทึกข้อความ ข่าวสาร หรือรายงาน ปัจจัยของผู้ส่งสาร ได้แก่ ทักษะการสื่อสาร ทัศนคติ ความรู้ ระบบสังคม และวัฒนธรรม</p>

<h3>สาร (Message)</h3>
<p>ประกอบด้วย เนื้อหา ส่วนประกอบ โครงสร้าง การจัดสาร และรหัส</p>

<h3>ช่องทาง / สื่อ (Channel / Media)</h3>
<p>ตัวกลางที่ทำให้ข่าวสารเดินทางจากแหล่งกำเนิดไปถึงผู้รับ เช่น เครื่องขยายเสียง วิทยุ โทรทัศน์ อินเทอร์เน็ต เว็บไซต์ e-mail — รับรู้ผ่านการเห็น การได้ยิน การสัมผัส การได้กลิ่น และการลิ้มรส</p>

<h3>ผู้รับสาร (Receiver)</h3>
<p>ต้องมีความรู้ความเข้าใจ ประสบการณ์ และทักษะในการ<b>ถอดรหัส (Decoding)</b> เพื่อเข้าใจข่าวสารที่ผู้ส่งเข้ารหัส <b>(Encoding)</b> มา ปัจจัยของผู้รับเช่นเดียวกับผู้ส่ง: ทักษะการสื่อสาร ทัศนคติ ความรู้ ระบบสังคม และวัฒนธรรม</p>`,

  <div class="card"><h4>⬇️ 2. จากบนลงล่าง (Downward)</h4><p>จากผู้บังคับบัญชาไปยังผู้ใต้บังคับบัญชา เช่น สั่งงาน บอกเป้าหมาย มอบหมายงาน ให้ข้อมูลย้อนกลับ (Performance Feedback) และการประชุม ช่วยให้บุคลากรเห็นว่างานของตนสำคัญและมีผลต่อแผนงานขององค์กรอย่างไร</p></div>

<h3>9 เทคนิคการสื่อสารอย่างมีประสิทธิภาพ</h3>
<ol class="numbered-cards">
  <li><b>เป็นผู้ฟังที่ดี (Active Listening)</b> — ใส่ใจคู่สนทนา สังเกตทั้งคำพูด ท่าทาง สีหน้า น้ำเสียง ฟังเพื่อเข้าใจ ไม่ใช่ฟังเพื่อโต้แย้ง</li>
  <li><b>สื่อสารตรงประเด็นและกระชับ</b> — บอกสิ่งสำคัญให้ชัด ไม่วกวน</li>
  <li><b>ทักษะการเล่าเรื่อง (Storytelling)</b> — หาจุดร่วมกับผู้ฟัง เปิดด้วยประโยคที่ดึงความสนใจ เช่น เริ่มจาก pain point ของผู้ฟัง</li>
  <li><b>ศิลปะในการพูด (วาทศิลป์)</b> — รู้ว่าเวลาและสถานการณ์นี้ควรพูดอะไร รักษาบรรยากาศเชิงบวก สำคัญมากเมื่อต้องเจรจา ปฏิเสธ หรือให้ feedback เชิงลบ</li>
  <li><b>ภาษากาย</b> — การสบตา การยิ้ม บุคลิกภาพ ช่วยถ่ายทอดความมั่นใจและความรู้สึกร่วม</li>
  <li><b>ความกล้าแสดงออก</b> — สร้างความมั่นใจและความเชื่อมั่นให้ผู้รับสาร</li>
  <li><b>ความโปร่งใสและเป็นกลาง</b> — สื่อสารตามข้อเท็จจริง ไม่ลำเอียง</li>
  <li><b>การรักษาเวลา</b> — เคารพเวลาของผู้ฟังและผู้ร่วมประชุม</li>
  <li><b>การรับฟังข้อเสนอของผู้อื่น</b> — เปิดใจรับความคิดเห็นที่แตกต่าง</li>
</ol>

<h3>การสื่อสารที่มีประสิทธิภาพช่วยชีวิตส่วนบุคคล</h3>
<ul>
  <li>สร้างและบริหารความสัมพันธ์ได้ดียิ่งขึ้น</li>
  <li>รับมือกับความขัดแย้ง และหาทางออกร่วมกันอย่างสร้างสรรค์</li>
  <li>สุขภาพจิตดีขึ้น จิตใจมั่นคง เพราะรู้จักสื่อสารอารมณ์ของตนเอง</li>
</ul>

<h3>ข้อดีต่อทีมและองค์กร</h3>
<ul class="check">
  <li>ทีมร่วมมือกันมากขึ้น แรงจูงใจในองค์กรเพิ่มขึ้น</li>
  <li>ลดความสับสนและความเข้าใจผิด</li>
  <li>ส่งเสริมภาวะผู้นำ — ทักษะสำคัญในการก้าวเป็นหัวหน้าทีม</li>
  <li>ผู้นำสร้างทีมเวิร์คและการประสานงานที่ดีขึ้น</li>
  <li>คนในทีมรู้ความคาดหวังขององค์กรและหัวหน้าอย่างชัดเจน</li>
  <li>โปร่งใสในการรายงานความคืบหน้า บทบาทหน้าที่ และความรับผิดชอบ</li>
  <li>ความสัมพันธ์ดีขึ้น คนในทีมสนับสนุนกัน</li>
</ul>

  <li>หงายงาให้เหมาะกับสินค้า ความสูงงาขณะเคลื่อนที่<b>ไม่เกิน 20 ซม.</b></li>
  <li>ตรวจเส้นทางและ<b>ด้านหลังก่อนถอยทุกครั้ง</b> หยุดสำรวจที่ทางร่วม-ทางแยก</li>
  <li>ใช้ความเร็วตามที่บริษัทกำหนด ระวังพื้นเปียก ไม่เรียบ และพื้นที่จำกัดความสูง</li>
  <li>ขึ้นทางลาดชันขณะบรรทุก: <b>ขับเดินหน้าขึ้น</b> · ลงทางลาดชันขณะบรรทุก: <b>ถอยหลังลง</b></li>
  <li>สินค้าบังสายตา ให้<b>ขับถอยหลัง</b> แทนการขับเดินหน้า</li>
  <li>ตรวจหมอนรองล้อรถบรรทุกก่อนโหลดสินค้าขึ้นรถ</li>
</ul>
<h3>❌ ห้ามทำ</h3>
<ul>
  <li><b>ห้ามใช้รถยกเพื่อยกคนขึ้น และห้ามโดยสาร</b></li>
  <li>ห้ามเพิ่มน้ำหนักที่ท้ายรถเพื่อเพิ่มน้ำหนักยก</li>
  <li>ห้ามยื่นอวัยวะออกนอกตัวรถขณะเคลื่อนที่ หรือยื่นออกไปจัดสินค้า</li>
  <li>ห้ามใช้รถยก ดึง ดัน ลาก</li>
  <li>ไม่เบรกกะทันหันโดยไม่จำเป็น และระวังงาที่ถูกยกสูง</li>
  <li>ผู้อื่นควรห่างจากรถยกที่กำลังทำงาน<b>ไม่น้อยกว่า 3 เมตร</b></li>
</ul>

<h3>เมื่อรถยกเกิดการพลิกคว่ำ</h3>
<div class="callout warn">
<ol><li><b>ห้ามกระโดดออกจากตัวรถเด็ดขาด</b></li><li>ใช้มือทั้งสองข้างจับยึดพวงมาลัยให้แน่น</li><li>กางขาทั้งสองข้างออกและยันไว้กับพื้นรถให้แน่น</li><li>โน้มตัวไปในทิศทางตรงข้ามกับการพลิกคว่ำ</li></ol>
</div>`,
      },
    ],
    quiz: [
      { q: "ผู้ขับรถยกนั่งขับต้องทำสิ่งใดตลอดเวลาตามกฎหมาย?", options: ["เปิดเพลง", "สวมเข็มขัดนิรภัย", "เปิดไฟหน้า", "บีบแตรตลอด"], answer: 1 },
      { q: "ความสูงของงาขณะรถยกเคลื่อนที่ ไม่ควรเกินเท่าใด?", options: ["5 ซม.", "20 ซม.", "50 ซม.", "1 เมตร"], answer: 1 },
      { q: "ถ้า Load Center ของสินค้ามากขึ้น ความสามารถในการบรรทุกจะเป็นอย่างไร?", options: ["มากขึ้น", "ลดลง", "เท่าเดิม", "ไม่เกี่ยวข้องกัน"], answer: 1 },
      { q: "ตามมาตรฐาน ISO Load Center มาตรฐานคือเท่าใด?", options: ["300 mm", "500 mm", "800 mm", "1,200 mm"], answer: 1 },
      { q: "ขณะบรรทุกสินค้าและต้องลงทางลาดชัน ควรขับอย่างไร?", options: ["ขับเดินหน้าลงเร็วๆ", "ถอยหลังลง", "ยกงาสูงๆ แล้วลง", "ปล่อยไหลลงเอง"], answer: 1 },
      { q: "ถ้าสินค้าที่บรรทุกบังสายตา ควรทำอย่างไร?", options: ["ขับเดินหน้าช้าๆ", "ยื่นหัวออกไปดูด้านข้าง", "ขับถอยหลังแทน", "ให้เพื่อนยืนบนงานำทาง"], answer: 2 },
      { q: "เมื่อรถยกเกิดการพลิกคว่ำ ข้อใดถูกต้อง?", options: ["กระโดดออกจากรถทันที", "จับพวงมาลัยให้แน่น ยันขา และโน้มตัวไปทางตรงข้ามกับการพลิกคว่ำ", "ปล่อยมือจากพวงมาลัย", "เหยียบคันเร่ง"], answer: 1 },
      { q: "ข้อใดเป็นสิ่งที่ “ห้ามทำ” กับรถยก?", options: ["ตรวจสอบรถก่อนใช้งาน", "ใช้รถยกยกคนขึ้นที่สูง", "บีบแตรที่ทางแยก", "จอดในพื้นที่ที่กำหนด"], answer: 1 },
      { q: "การชาร์จแบตเตอรี่ตะกั่วกรดแบบ Equal ควรทำบ่อยแค่ไหน?", options: ["ทุกวัน", "เดือนละ 1 ครั้ง", "ปีละครั้ง", "ไม่ต้องทำเลย"], answer: 1 },
      { q: "เมื่อจอดรถยก ควรวางงาอย่างไร?", options: ["ยกงาค้างไว้สูง", "วางปลายงาแนบพื้น", "หงายงาสุด", "วางงาบนพาเลท"], answer: 1 },
    ],
  },
];

</script>

<script>
(function () {
  "use strict";

  var PASS_PERCENT = 80;
  var KEY_STORE = "kp:hrkey";
  var app = document.getElementById("app");
  var APP_URL = app.getAttribute("data-url");
  var courses = window.COURSES || [];
  var LOGO = (window.IMG || {})["logo-sansuisha"] || "assets/logo-sansuisha.png";
  function brandLogo(small) {
    return '<span class="brand-logo' + (small ? " small" : "") + '"><img src="' + LOGO + '" alt="Sansuisha">' +
      '<span class="dept">Human Resource</span></span>';
  }
  var state = { rows: [], employees: [], loadedAt: null, dept: "", status: "", search: "" };
  var hrKey = null;

  function readSession() { try { return sessionStorage.getItem(KEY_STORE); } catch (e) { return null; } }
  function writeSession(v) {
    try { if (v) sessionStorage.setItem(KEY_STORE, v); else sessionStorage.removeItem(KEY_STORE); } catch (e) { /* ignore */ }
  }
  // same dual mode as App.html: google.script.run inside Apps Script, fetch when standalone
  function api(name) {
    var args = Array.prototype.slice.call(arguments, 1);
    if (!window.google || !google.script) {
      return fetch(window.KP_API_URL, {
        method: "POST", credentials: "omit",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify({ fn: name, args: args }),
      }).then(function (r) { return r.json(); });
    }
    return new Promise(function (resolve, reject) {
      var runner = google.script.run.withSuccessHandler(resolve).withFailureHandler(reject);
      runner[name].apply(runner, args);
    });
  }
  function esc(s) {
    return String(s === null || s === undefined ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function fmtDate(iso) {
    if (!iso) return "";
    var d = new Date(iso);
    if (isNaN(d)) return "";
    return d.toLocaleDateString("th-TH", { day: "numeric", month: "short", year: "2-digit" }) +
      " " + d.toLocaleTimeString("th-TH", { hour: "2-digit", minute: "2-digit" });
  }
  function getCourse(id) {
    for (var i = 0; i < courses.length; i++) if (courses[i].id === id) return courses[i];
    return null;
  }

  /* ---------- data ---------- */
  // one entry per employee: roster from the Employees tab plus anyone found only in Progress
  function buildPeople() {
    var people = {};
    var order = [];
    function person(id, name, dept) {
      var k = String(id || "").trim().toUpperCase();
      if (!people[k]) {
        people[k] = { id: k, name: name || "", dept: dept || "", inRoster: false, courses: {}, last: null };
        order.push(k);
      }
      return people[k];
    }
    state.employees.forEach(function (e) {
      var p = person(e.id, e.name, e.dept);
      p.inRoster = true;
      p.team = e.team;
    });
    state.rows.forEach(function (r) {
      var p = person(r.employeeId, r.name, r.dept);
      var course = getCourse(r.courseId);
      var total = course ? course.lessons.length : r.lessonsTotal;
      var doneCount = (r.done || []).filter(function (i) { return i < total; }).length;
      var passed = r.bestScore !== null && r.bestScore >= PASS_PERCENT;
      p.courses[r.courseId] = {
        doneCount: doneCount, total: total, best: r.bestScore, passed: passed,
        pct: Math.round(((doneCount + (passed ? 1 : 0)) / (total + 1)) * 100),
      };
      if (r.updatedAt && (!p.last || r.updatedAt > p.last)) p.last = r.updatedAt;
    });
    return order.map(function (k) {
      var p = people[k];
      p.completed = courses.filter(function (c) { return p.courses[c.id] && p.courses[c.id].pct === 100; }).length;
      p.started = Object.keys(p.courses).length > 0;
      return p;
    });
  }

  function filtered(people) {
    var q = state.search.trim().toLowerCase();
    return people.filter(function (p) {
      if (state.dept && p.dept !== state.dept) return false;
      if (state.status === "all-done" && p.completed !== courses.length) return false;
      if (state.status === "in-progress" && (!p.started || p.completed === courses.length)) return false;
      if (state.status === "not-started" && p.started) return false;
      if (q && (p.id + " " + p.name + " " + (p.team || "")).toLowerCase().indexOf(q) === -1) return false;
      return true;
    });
  }

  function load(key) {
    return api("apiReport", key).then(function (res) {
      if (!res || !res.ok) throw new Error((res && res.error) || "error");
      state.rows = res.rows || [];
      state.employees = res.employees || [];
      state.loadedAt = new Date();
      hrKey = key;
    });
  }

  /* ---------- views ---------- */
  function renderLogin(message) {
    app.innerHTML =
      '<div class="login-wrap"><form class="login-card" id="login" autocomplete="off">' +
      '<div class="login-brand">' + brandLogo(false) + '</div><h1>รายงานความคืบหน้า</h1>' +
      '<p class="sub">สำหรับฝ่ายบุคคล (HR) — ดูว่าพนักงานคนใดเรียนจบหลักสูตรใด และได้คะแนนเท่าไร</p>' +
      '<div class="field"><label for="hrkey">รหัสผ่าน HR</label>' +
      '<input id="hrkey" type="password" required autofocus></div>' +
      '<div class="error" id="err">' + esc(message || "") + "</div>" +
      '<button class="btn block" type="submit" id="go">เปิดรายงาน</button>' +
      '<div class="login-foot"><a href="' + esc(app.getAttribute("data-home") || APP_URL) + '" target="_top">← กลับหน้าเรียนรู้</a></div>' +
      "</form></div>";
    document.getElementById("login").addEventListener("submit", function (e) {
      e.preventDefault();
      var key = document.getElementById("hrkey").value;
      var btn = document.getElementById("go");
      btn.disabled = true; btn.textContent = "กำลังโหลด…";
      load(key).then(function () {
        writeSession(key);
        renderReport();
      }, function (err) {
        btn.disabled = false; btn.textContent = "เปิดรายงาน";
        document.getElementById("err").textContent = err.message === "unauthorized"
          ? "รหัสผ่านไม่ถูกต้อง" : "เชื่อมต่อระบบไม่สำเร็จ กรุณาตรวจสอบอินเทอร์เน็ต";
      });
    });
  }

  function cell(c) {
    if (!c) return '<td class="c-none">–</td>';
    if (c.pct === 100) {
      return '<td class="c-done"><b>✓ จบแล้ว</b><small>คะแนน ' + c.best + "%</small></td>";
    }
    return '<td class="c-doing"><b>' + c.pct + "%</b><small>อ่าน " + c.doneCount + "/" + c.total +
      " บท" + (c.best !== null ? " · คะแนน " + c.best + "%" : "") + "</small></td>";
  }

  function renderReport() {
    var people = buildPeople();
    var list = filtered(people);
    var depts = [];
    people.forEach(function (p) { if (p.dept && depts.indexOf(p.dept) === -1) depts.push(p.dept); });
    depts.sort();

    var summary = courses.map(function (c) {
      var done = 0, doing = 0, scores = [];
      list.forEach(function (p) {
        var x = p.courses[c.id];
        if (!x) return;
        if (x.pct === 100) done++; else doing++;
        if (x.best !== null) scores.push(x.best);
      });
      var avg = scores.length ? Math.round(scores.reduce(function (a, b) { return a + b; }, 0) / scores.length) : null;
      var pct = list.length ? Math.round((done / list.length) * 100) : 0;
      return (
        '<div class="sum-card" style="--c:' + c.color + '"><div class="sum-title">' + c.icon + " " + esc(c.title) + "</div>" +
        '<div class="sum-big">' + done + ' <span>/ ' + list.length + " คนจบแล้ว</span></div>" +
        '<div class="bar"><i style="width:' + pct + '%"></i></div>' +
        '<div class="foot-row"><span>กำลังเรียน ' + doing + " · ยังไม่เริ่ม " + (list.length - done - doing) +
        "</span><span>" + (avg !== null ? "คะแนนเฉลี่ย " + avg + "%" : "") + "</span></div></div>"
      );
    }).join("");

    var head = "<tr><th>รหัส</th><th>ชื่อ</th><th>ฝ่าย</th>" +
      courses.map(function (c) { return '<th title="' + esc(c.title) + '">' + c.icon + " " + esc(c.title) + "</th>"; }).join("") +
      "<th>จบ</th><th>ใช้งานล่าสุด</th></tr>";
    var body = list.map(function (p) {
      return "<tr><td>" + esc(p.id) + (p.inRoster ? "" : ' <span class="badge doing" title="ไม่อยู่ในแท็บ Employees">นอกรายชื่อ</span>') +
        "</td><td>" + esc(p.name) + "</td><td>" + esc(p.dept) + "</td>" +
        courses.map(function (c) { return cell(p.courses[c.id]); }).join("") +
        '<td class="c-count">' + p.completed + "/" + courses.length + "</td>" +
        '<td class="c-date">' + esc(fmtDate(p.last)) + "</td></tr>";
    }).join("") || '<tr><td colspan="' + (courses.length + 5) + '" class="c-none">ไม่พบพนักงานตามเงื่อนไข</td></tr>';

    app.innerHTML =
      '<header class="topbar"><div class="topbar-inner">' +
      '<span class="brand">' + brandLogo(true) + '<span class="site-name">รายงานความคืบหน้า</span></span><div class="spacer"></div>' +
      '<button class="btn ghost" id="refresh">↻ โหลดใหม่</button>' +
      '<button class="btn ghost" id="logout">ออก</button></div></header>' +
      '<main class="container wide">' +
      '<div class="report-head"><div><h2>ภาพรวมการเรียนรู้</h2>' +
      '<p class="muted-text">ข้อมูลจาก Google Sheets · โหลดเมื่อ ' + esc(fmtDate(state.loadedAt && state.loadedAt.toISOString())) +
      " · จบหลักสูตร = อ่านครบทุกบท และสอบผ่าน " + PASS_PERCENT + "%</p></div></div>" +
      '<section class="sum-grid">' + summary + "</section>" +
      '<section class="filters">' +
      '<input id="search" type="search" placeholder="ค้นหารหัส ชื่อ หรือส่วนงาน" value="' + esc(state.search) + '">' +
      '<select id="dept"><option value="">ทุกฝ่าย</option>' +
      depts.map(function (d) { return "<option" + (d === state.dept ? " selected" : "") + ">" + esc(d) + "</option>"; }).join("") +
      "</select>" +
      '<select id="status">' +
      [["", "ทุกสถานะ"], ["all-done", "จบครบทุกหลักสูตร"], ["in-progress", "กำลังเรียน"], ["not-started", "ยังไม่เริ่มเลย"]]
        .map(function (o) { return '<option value="' + o[0] + '"' + (o[0] === state.status ? " selected" : "") + ">" + o[1] + "</option>"; }).join("") +
      "</select>" +
      '<span class="spacer"></span><span class="muted-text">' + list.length + " คน</span>" +
      '<button class="btn" id="csv">⬇ ดาวน์โหลด Excel (CSV)</button></section>' +
      '<div class="table-wrap"><table class="report"><thead>' + head + "</thead><tbody>" + body + "</tbody></table></div>" +
      "</main>";

    document.getElementById("search").addEventListener("input", function (e) {
      state.search = e.target.value;
      var pos = e.target.selectionStart;
      renderReport();
      var s = document.getElementById("search");
      s.focus(); s.setSelectionRange(pos, pos);
    });
    document.getElementById("dept").addEventListener("change", function (e) { state.dept = e.target.value; renderReport(); });
    document.getElementById("status").addEventListener("change", function (e) { state.status = e.target.value; renderReport(); });
    document.getElementById("csv").addEventListener("click", function () { downloadCsv(list); });
    document.getElementById("logout").addEventListener("click", function () {
      writeSession(null); hrKey = null; state.rows = []; state.employees = []; renderLogin();
    });
    document.getElementById("refresh").addEventListener("click", function (e) {
      e.target.disabled = true; e.target.textContent = "กำลังโหลด…";
      load(hrKey).then(renderReport, function () {
        e.target.disabled = false; e.target.textContent = "↻ โหลดใหม่ (ไม่สำเร็จ)";
      });
    });
  }

  function downloadCsv(list) {
    var header = ["รหัสพนักงาน", "ชื่อ", "ฝ่าย", "ส่วนงาน"];
    courses.forEach(function (c) {
      header.push(c.title + " - สถานะ", c.title + " - ความคืบหน้า%", c.title + " - คะแนนสูงสุด%");
    });
    header.push("จำนวนหลักสูตรที่จบ", "ใช้งานล่าสุด");
    var lines = [header];
    list.forEach(function (p) {
      var row = [p.id, p.name, p.dept, p.team || ""];
      courses.forEach(function (c) {
        var x = p.courses[c.id];
        row.push(!x ? "ยังไม่เริ่ม" : x.pct === 100 ? "จบแล้ว" : "กำลังเรียน", x ? x.pct : 0, x && x.best !== null ? x.best : "");
      });
      row.push(p.completed, fmtDate(p.last));
      lines.push(row);
    });
    var csv = lines.map(function (r) {
      return r.map(function (v) { return '"' + String(v).replace(/"/g, '""') + '"'; }).join(",");
    }).join("\r\n");
    // BOM so Excel opens Thai text correctly
    var a = document.createElement("a");
    a.href = "data:text/csv;charset=utf-8," + encodeURIComponent("﻿" + csv);
    a.download = "knowledge-progress-" + new Date().toISOString().slice(0, 10) + ".csv";
    document.body.appendChild(a); a.click(); a.remove();
  }

  /* ---------- start ---------- */
  var savedKey = readSession();
  if (savedKey) {
    app.innerHTML = '<div class="login-wrap"><p>กำลังโหลดรายงาน…</p></div>';
    load(savedKey).then(renderReport, function () { writeSession(null); renderLogin(); });
  } else {
    renderLogin();
  }
})();
</script>

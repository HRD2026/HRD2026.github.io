<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>รายงานความคืบหน้า (HR)</title>
<script>window.KP_API_URL = "https://script.google.com/macros/s/AKfycbzPjdPRRxNKaTWaR8CP2qFyGToMMiTFM_XJctdxfYMqpFY_04P7L89nMIS3qX5ku8CgWQ/exec";</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=Orbitron:wght@600&display=swap" rel="stylesheet">
<style>
:root {
  --navy: #0f2a4a;
  --navy-2: #1a3d68;
  --blue: #2563a8;
  --blue-soft: #e9f1fa;
  --blue-softer: #f4f8fc;
  --bg: #eef3fb;
  --surface: #ffffff;
  --ink: #14233a;
  --ink-2: #55657a;
  --ink-3: #8a97a8;
  --line: #e3e9f0;
  --brand: #2563a8;
  --brand-ink: #0f2a4a;
  --brand-soft: #e9f1fa;
  --good: #14734f;
  --good-soft: #e5f4ed;
  --warn: #9a5a07;
  --warn-soft: #fcf2e1;
  --danger: #b42318;
  --danger-soft: #fdecea;
  --radius: 16px;
  --radius-s: 10px;
  --shadow: 0 1px 2px rgba(15, 42, 74, .05), 0 6px 20px rgba(15, 42, 74, .05);
  --shadow-lift: 0 2px 4px rgba(15, 42, 74, .06), 0 14px 32px rgba(15, 42, 74, .1);
  --nav-w: 76px;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  font-family: "IBM Plex Sans Thai", "Leelawadee UI", "Tahoma", sans-serif;
  font-size: 15.5px; line-height: 1.6;
  color: var(--ink); background: var(--bg);
  -webkit-font-smoothing: antialiased;
}
img { max-width: 100%; height: auto; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--blue); }
h1, h2, h3, h4 { color: var(--navy); line-height: 1.3; font-weight: 600; }
.ico { flex: none; display: block; }
:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
.spacer { flex: 1; }

/* ---------- Buttons, inputs, badges ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 42px;
  border: 1px solid var(--navy); border-radius: var(--radius-s); padding: 8px 18px; font-weight: 500;
  background: var(--navy); color: #fff; text-decoration: none; white-space: nowrap;
  transition: background .15s ease, border-color .15s ease, box-shadow .15s ease;
}
.btn:hover { background: var(--navy-2); border-color: var(--navy-2); }
.btn.block { width: 100%; min-height: 48px; }
.btn.ghost { background: var(--surface); color: var(--navy); border-color: var(--line); }
.btn.ghost:hover { background: var(--blue-soft); border-color: #c9dbef; }
.btn.light { background: #fff; color: var(--navy); border-color: #fff; }
.btn.light:hover { background: var(--blue-soft); border-color: var(--blue-soft); }
.btn.danger { background: var(--surface); color: var(--danger); border-color: #f0c9c5; }
.btn.danger:hover { background: var(--danger-soft); }
.btn.small { min-height: 34px; padding: 4px 12px; font-size: 14px; }
.btn.icon-only { padding: 0; width: 38px; min-height: 38px; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.field { margin-bottom: 14px; }
.field label { display: block; font-weight: 500; font-size: 14px; margin-bottom: 5px; color: var(--navy); }
.field small { display: block; color: var(--ink-2); font-size: 13px; margin-top: 4px; }
.field input, .field select, .field textarea, .control {
  width: 100%; padding: 9px 12px; min-height: 42px; border: 1px solid #cfd8e3; border-radius: var(--radius-s);
  background: var(--surface); outline: none; transition: border-color .15s ease, box-shadow .15s ease;
}
.field input:focus, .field select:focus, .field textarea:focus, .control:focus { border-color: var(--blue); box-shadow: 0 0 0 3px var(--blue-soft); }
.error { color: var(--danger); font-size: 14px; min-height: 22px; margin: 4px 0; }
.badge { display: inline-flex; align-items: center; gap: 4px; font-size: 13px; font-weight: 500; padding: 2px 10px; border-radius: 99px; background: var(--good-soft); color: var(--good); white-space: nowrap; }
.badge .ico { width: 14px; height: 14px; }
.badge.todo { background: #eef1f5; color: var(--ink-2); }
.badge.doing { background: var(--blue-soft); color: var(--blue); }
.badge.due { background: var(--warn-soft); color: var(--warn); }
.bar { height: 6px; background: #e8edf3; border-radius: 99px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--blue); border-radius: 99px; transition: width .5s ease; }
.foot-row { display: flex; justify-content: space-between; gap: 10px; font-size: 13px; color: var(--ink-2); margin-top: 6px; }

/* ---------- Login ---------- */
.login-wrap { min-height: 100vh; display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); background: var(--surface); }
.login-side { background: var(--navy); color: #fff; padding: 56px; display: flex; flex-direction: column; justify-content: flex-end; }
.login-side h2 { color: #fff; font-size: 34px; margin: 0 0 12px; max-width: 460px; }
.login-side p { color: #c3d3e6; max-width: 460px; margin: 0; }
.login-side ul { list-style: none; padding: 0; margin: 28px 0 0; display: grid; gap: 12px; color: #dce7f3; }
.login-side li { display: flex; gap: 10px; align-items: center; }
.login-main { display: grid; place-items: center; padding: 32px 20px; }
.login-card { width: 100%; max-width: 380px; }
.login-card h1 { font-size: 24px; margin: 0 0 4px; }
.login-card p.sub { color: var(--ink-2); margin: 0 0 24px; }
.login-brand { padding-bottom: 28px; }
.login-foot { color: var(--ink-2); font-size: 14px; margin-top: 18px; }
.loading { min-height: 100vh; display: grid; place-items: center; color: var(--ink-2); }

/* ---------- Company logo + department ---------- */
.brand-logo { display: inline-flex; flex-direction: column; align-items: center; gap: 6px; text-decoration: none; }
.brand-logo img { display: block; width: 210px; height: auto; }
.brand-logo .dept {
  display: flex; align-items: center; gap: 10px;
  font-family: "Orbitron", "Segoe UI", sans-serif; font-weight: 600; font-size: 11.5px;
  letter-spacing: .38em; margin-right: -.38em; /* letter-spacing adds trailing space; pull it back to stay centered */
  color: var(--navy); text-transform: uppercase; white-space: nowrap;
}
.brand-logo .dept::before, .brand-logo .dept::after { content: ""; width: 16px; height: 1.5px; background: linear-gradient(90deg, transparent, var(--blue)); }
.brand-logo .dept::after { background: linear-gradient(90deg, var(--blue), transparent); margin-right: .38em; }
.brand-logo.small { gap: 3px; }
.brand-logo.small img { width: 132px; }
.brand-logo.small .dept { font-size: 7.5px; gap: 6px; letter-spacing: .34em; margin-right: -.34em; }
.brand-logo.small .dept::before, .brand-logo.small .dept::after { width: 8px; height: 1px; }

/* ---------- App shell ---------- */
.shell { min-height: 100vh; }
.nav {
  position: fixed; inset: 0 auto 0 0; width: var(--nav-w); background: var(--surface); box-shadow: 1px 0 0 var(--line), 4px 0 18px rgba(15, 42, 74, .04);
  display: flex; flex-direction: column; padding: 16px 14px; z-index: 20; transition: width .2s ease;
}
.nav nav { display: grid; gap: 4px; }
.nav-item {
  position: relative; display: flex; align-items: center; justify-content: center; gap: 12px; padding: 11px 0; min-height: 46px; border-radius: 12px; border: 0; background: transparent; width: 100%;
  color: var(--ink-2); text-decoration: none; font-weight: 500; transition: background .15s ease, color .15s ease;
}
.nav-item > span { display: none; white-space: nowrap; }
.nav-item:hover { background: var(--blue-softer); color: var(--navy); }
.nav-item.active { background: var(--blue-soft); color: var(--navy); }
.nav-group { height: 1px; margin: 10px 8px; background: var(--line); }
.nav-group span { display: none; }
.nav-help { margin-top: auto; background: var(--blue-softer); }
/* ป้ายชื่อเมื่อเมนูย่ออยู่ */
.nav-item[data-tip]::after {
  content: attr(data-tip); position: absolute; left: calc(100% + 12px); top: 50%; transform: translate(-4px, -50%); padding: 5px 10px; border-radius: 8px;
  background: var(--navy); color: #fff; font-size: 13px; font-weight: 400; white-space: nowrap; opacity: 0; pointer-events: none; transition: opacity .12s ease, transform .12s ease; z-index: 30;
}
.nav-item[data-tip]:hover::after, .nav-item[data-tip]:focus-visible::after { opacity: 1; transform: translate(0, -50%); }
.rail-open { --nav-w: 236px; }
.rail-open .nav-item { justify-content: flex-start; padding: 11px 12px; }
.rail-open .nav-item > span { display: inline; }
.rail-open .nav-item::after { display: none; }
.rail-open .nav-group { height: auto; background: none; margin: 0; padding: 14px 12px 4px; font-size: 12px; color: var(--ink-3); }
.rail-open .nav-group span { display: inline; }
.rail-open .nav-mark { align-self: flex-start; margin-left: 2px; }
.workspace { margin-left: var(--nav-w); min-width: 0; transition: margin-left .2s ease; }
.top {
  position: sticky; top: 0; z-index: 10; height: 68px; display: flex; align-items: center; gap: 10px; padding: 0 28px;
  background: rgba(238, 243, 251, .9); backdrop-filter: blur(8px);
}
.top-left { display: flex; justify-content: flex-end; align-items: center; }
.top-search { position: relative; width: min(280px, 100%); }
.top-search .ico { position: absolute; left: 12px; top: 11px; color: var(--ink-3); }
.top-search input { width: 100%; height: 42px; padding: 0 12px 0 40px; border: 0; border-radius: 12px; background: #fff; box-shadow: var(--shadow); outline: none; }
.top-search input:focus { background: #fff; border-color: var(--blue); box-shadow: 0 0 0 3px var(--blue-soft); }
.top-left { flex: 1; min-width: 0; }
.top .spacer { display: none; }
.sync { font-size: 13px; color: var(--ink-2); white-space: nowrap; }
.sync.error { color: var(--danger); font-weight: 500; }
.avatar { width: 38px; height: 38px; border-radius: 50%; background: var(--blue-soft); color: var(--navy); display: grid; place-items: center; }
.page { max-width: 1320px; margin: 0 auto; padding: 12px 28px 64px; animation: rise .28s ease both; }
@keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
.page-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap; margin-bottom: 22px; }
.page-head h1 { font-size: 26px; margin: 0; }
.page-head p { margin: 4px 0 0; color: var(--ink-2); }
.page-head-right { display: flex; gap: 8px; flex-wrap: wrap; }
.tabbar { display: none; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 20px 22px; }
.panel-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
.panel-head h2 { font-size: 17px; margin: 0; }
.panel-head a { font-size: 14px; text-decoration: none; white-space: nowrap; }
.muted { color: var(--ink-2); }
.empty { display: grid; justify-items: center; gap: 6px; text-align: center; color: var(--ink-2); padding: 28px 16px; }
.empty .ico { color: var(--ink-3); }
.empty b { color: var(--navy); font-weight: 500; }
.empty p { margin: 0; font-size: 14px; max-width: 380px; }
.notice { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; background: var(--warn-soft); color: #6d4005; border-radius: var(--radius-s); padding: 12px 16px; margin-bottom: 18px; }
.notice > span { flex: 1; min-width: 200px; }

/* ---------- Dashboard ---------- */
.ring { position: relative; width: 128px; flex: none; }
.ring svg { display: block; }
.ring circle { fill: none; stroke-width: 11; }
.ring-track { stroke: #e8edf3; }
.ring-on { stroke: var(--blue); stroke-linecap: round; }
.ring-text { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; line-height: 1.2; }
.ring-text b { font-size: 24px; font-weight: 600; color: var(--navy); font-variant-numeric: tabular-nums; }
.ring-text span { font-size: 12px; color: var(--ink-2); }
.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; margin-bottom: 18px; }
.stat-tile { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px 18px; display: flex; gap: 14px; align-items: flex-start; min-width: 0; }
.stat-ico { width: 40px; height: 40px; border-radius: 12px; background: var(--blue-soft); color: var(--navy); display: grid; place-items: center; flex: none; }
.stat-tile b { display: block; font-size: 24px; font-weight: 600; color: var(--navy); line-height: 1.2; font-variant-numeric: tabular-nums; }
.stat-tile span { display: block; font-size: 14px; color: var(--ink-2); }
.stat-tile small { display: block; font-size: 12.5px; color: var(--ink-3); }
.event { display: flex; gap: 14px; padding: 12px 0; border-top: 1px solid var(--line); }
.event:first-child { border-top: 0; padding-top: 0; }
.event:last-child { padding-bottom: 0; }
.date-chip { width: 54px; flex: none; border-radius: 12px; background: var(--blue-soft); color: var(--navy); text-align: center; padding: 6px 0; line-height: 1.15; align-self: flex-start; }
.date-chip b { display: block; font-size: 20px; font-weight: 600; }
.date-chip span { font-size: 12px; }
.event-body { min-width: 0; }
.event-body h3 { margin: 0 0 2px; font-size: 15.5px; font-weight: 500; }
.event-body h3 a { color: inherit; text-decoration: none; }
.event-body h3 a:hover { color: var(--blue); }
.event-meta { display: flex; flex-wrap: wrap; gap: 2px 14px; font-size: 13.5px; color: var(--ink-2); }
.event-meta span { display: inline-flex; gap: 5px; align-items: center; }
.event-meta .ico { width: 15px; height: 15px; }
.hbar { display: grid; grid-template-columns: minmax(0, 190px) minmax(40px, 1fr) 62px; gap: 12px; align-items: center; padding: 6px 0; font-size: 14px; }
.hbar-name { line-height: 1.3; overflow-wrap: anywhere; }
.hbar-track { height: 8px; background: #e8edf3; border-radius: 4px; }
.hbar-track i { display: block; height: 100%; min-width: 2px; background: var(--blue); border-radius: 0 4px 4px 0; transition: width .5s ease; }
.hbar-val { text-align: right; color: var(--ink-2); font-variant-numeric: tabular-nums; white-space: nowrap; }

/* ---------- Catalog ---------- */
.course-ico { width: 42px; height: 42px; flex: none; border-radius: 12px; background: var(--blue-soft); color: var(--navy); display: grid; place-items: center; }
.toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 14px; }
.toolbar .control { width: auto; min-width: 150px; }
.toolbar .search { flex: 1; min-width: 220px; position: relative; }
.toolbar .search .ico { position: absolute; left: 12px; top: 11px; color: var(--ink-3); }
.toolbar .search input { width: 100%; padding-left: 40px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 20px; }
.chip { border: 1px solid var(--line); background: var(--surface); color: var(--ink-2); border-radius: 99px; padding: 6px 14px; font-size: 14px; min-height: 36px; transition: all .15s ease; }
.chip:hover { border-color: #c9dbef; color: var(--navy); }
.chip.active { background: var(--navy); border-color: var(--navy); color: #fff; }
.chip em { font-style: normal; opacity: .65; margin-left: 4px; font-variant-numeric: tabular-nums; }
.course-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 16px; }
.course-card {
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px 20px;
  display: flex; flex-direction: column; gap: 10px; text-decoration: none; color: inherit;
  transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease;
}
.course-card:hover { transform: translateY(-3px); box-shadow: var(--shadow-lift); border-color: #d3e0ee; }
.card-top { display: flex; align-items: center; gap: 12px; }
.card-cat { font-size: 13px; color: var(--ink-2); line-height: 1.35; }
.course-card h3 { margin: 0; font-size: 16.5px; font-weight: 600; }
.course-card p { margin: 0; color: var(--ink-2); font-size: 14px; }
.card-meta { display: flex; flex-wrap: wrap; gap: 2px 12px; font-size: 13px; color: var(--ink-2); margin-top: auto; }
.card-meta span { display: inline-flex; gap: 4px; align-items: center; }
.card-meta .ico { width: 14px; height: 14px; }
.card-foot { border-top: 1px solid var(--line); padding-top: 12px; }
.card-foot-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 8px; font-size: 13px; color: var(--ink-2); }

/* ---------- Training room ---------- */
.crumbs { font-size: 14px; color: var(--ink-2); margin-bottom: 10px; }
.crumbs a { text-decoration: none; }
.room-head { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 20px 24px; margin-bottom: 18px; }
.room-title { display: flex; gap: 14px; align-items: center; }
.room-title h1 { font-size: 22px; margin: 0; }
.room-title p { margin: 0; font-size: 14px; color: var(--ink-2); }
.stepper { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; margin: 18px 0 0; padding: 0; list-style: none; }
.stepper li { position: relative; font-size: 13px; color: var(--ink-2); padding-top: 12px; border-top: 3px solid #e3e9f0; line-height: 1.35; }
.stepper li b { display: block; font-weight: 500; color: inherit; font-size: 14px; }
.stepper li.done { border-color: var(--blue); }
.stepper li.now { border-color: var(--navy); color: var(--navy); }
.room-grid { display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 18px; align-items: start; }
.side { position: sticky; top: 82px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 10px; max-height: calc(100vh - 100px); overflow-y: auto; }
.side summary { list-style: none; display: none; }
.side summary::-webkit-details-marker { display: none; }
.side-item {
  display: flex; gap: 10px; align-items: flex-start; padding: 9px 10px; border-radius: var(--radius-s);
  color: var(--ink); text-decoration: none; font-size: 14px; line-height: 1.4; transition: background .15s ease;
}
a.side-item:hover { background: var(--blue-softer); }
.side-item.active { background: var(--blue-soft); font-weight: 500; color: var(--navy); }
.side-item.locked { color: var(--ink-3); }
.side-label { font-size: 12px; color: var(--ink-3); padding: 10px 10px 4px; }
.dot { flex: 0 0 22px; height: 22px; border-radius: 50%; border: 1.5px solid #cfd8e3; display: grid; place-items: center; color: #fff; margin-top: -1px; }
.dot .ico { width: 13px; height: 13px; }
.dot.done { background: var(--blue); border-color: var(--blue); }
.dot.lock { border: 0; color: var(--ink-3); }
.dot.lock .ico { width: 16px; height: 16px; }
.lesson { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 28px 32px; min-width: 0; font-size: 16px; line-height: 1.75; }
.lesson .kicker { color: var(--blue); font-weight: 500; font-size: 14px; }
.lesson h2 { margin: 2px 0 6px; font-size: 24px; }
.lesson .src { color: var(--ink-2); font-size: 14px; margin-bottom: 18px; }
.lesson h3 { font-size: 19px; margin: 28px 0 10px; }
.lesson h4 { margin: 0 0 6px; font-size: 16.5px; }
.lesson .lead { font-size: 17px; color: var(--ink-2); }
.lesson figure { margin: 16px 0; text-align: center; }
.lesson figure img { border: 1px solid var(--line); border-radius: 10px; background: #fff; max-height: 460px; }
.lesson figcaption { color: var(--ink-2); font-size: 14px; margin-top: 6px; }
.lesson ul, .lesson ol { padding-left: 1.4em; }
.lesson-nav { display: flex; justify-content: space-between; gap: 12px; margin-top: 32px; padding-top: 20px; border-top: 1px solid var(--line); flex-wrap: wrap; }
.video-box { position: relative; aspect-ratio: 16 / 9; border-radius: 12px; overflow: hidden; background: var(--navy); margin: 12px 0 8px; }
.video-box iframe, .video-box video { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
.res-row { display: flex; gap: 12px; align-items: center; padding: 12px 14px; border: 1px solid var(--line); border-radius: 12px; text-decoration: none; color: inherit; margin: 8px 0; }
a.res-row:hover { border-color: #c9dbef; background: var(--blue-softer); }
.res-row > div { flex: 1; min-width: 0; }
.res-row b { display: block; font-weight: 500; color: var(--navy); }
.res-row small { color: var(--ink-2); font-size: 13px; }
.res-ico { width: 38px; height: 38px; flex: none; border-radius: 10px; background: var(--blue-soft); color: var(--navy); display: grid; place-items: center; }
.locked-box { display: flex; gap: 12px; align-items: center; padding: 14px 16px; border: 1px dashed #cfd8e3; border-radius: 12px; color: var(--ink-2); margin: 10px 0; font-size: 14.5px; }

/* ---------- Lesson content blocks ---------- */
.callout { background: var(--brand-soft); border-left: 4px solid var(--brand); padding: 14px 16px; border-radius: 10px; margin: 16px 0; }
.callout.strong { background: #fdf2f2; border-color: #dc2626; }
.callout.warn { background: var(--warn-soft); border-color: var(--warn); }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin: 14px 0; }
.grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin: 14px 0; }
.card { border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; background: #fbfdfc; }
.card p { margin: 6px 0; }
.card ul { margin: 6px 0; }
.card.muted { background: #f7f7f7; }
.card.tip { background: #fffbea; border-color: #f4e3a1; margin-top: 20px; }
.tag { font-size: 15px; color: var(--ink-2); }
.example { font-style: italic; }
.muted-text { color: var(--ink-2); font-style: italic; }
.refs { color: var(--ink-2); font-size: 14px; margin-top: 24px; }
table.compare { width: 100%; border-collapse: collapse; margin: 10px 0; font-size: 16px; }
table.compare th { background: var(--brand); color: #fff; padding: 10px; }
table.compare td { border: 1px solid var(--line); padding: 10px; text-align: center; }
table.compare tr:nth-child(even) td { background: #f6faf9; }
.triad { text-align: center; margin: 12px 0; }
.triad-top { display: inline-block; background: #fffbd6; border: 1px solid #e6dd8a; border-radius: 99px; padding: 8px 22px; font-weight: 600; }
.triad-row { display: flex; justify-content: center; align-items: center; gap: 14px; margin-top: 12px; flex-wrap: wrap; }
.triad-row span { background: #fffbd6; border: 1px solid #e6dd8a; border-radius: 50%; width: 96px; height: 96px; display: grid; place-items: center; font-weight: 600; }
.triad-row b { color: var(--brand-ink); }
.steps { list-style: none; padding: 0 !important; display: grid; gap: 10px; }
.steps li { background: #eefcfb; border: 1px solid #bfe9e4; border-radius: 12px; padding: 12px 16px; }
.steps em { color: var(--danger); font-style: normal; font-weight: 600; }
.step-no { display: inline-block; background: var(--brand); color: #fff; border-radius: 6px; padding: 0 10px; margin-right: 8px; font-weight: 700; font-size: 14px; }
.frame4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin: 12px 0; }
.frame4 div { background: #fbfdfc; border: 1px solid var(--line); border-radius: 12px; padding: 12px; text-align: center; }
.frame4 b { display: block; background: var(--brand); color: #fff; border-radius: 99px; padding: 2px 0; margin-bottom: 6px; }
.frame4 span { font-size: 15px; }
.quote-list { list-style: none; padding: 0 !important; font-weight: 600; }
.cols2 { columns: 2; column-gap: 32px; }
.diamond { list-style: "♦  "; }
.check { list-style: "✓  "; }
.check.big li { margin: 6px 0; font-size: 18px; }
.numbered-cards li { margin: 8px 0; }
.smcr { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin: 14px 0; }
.smcr div { text-align: center; background: #eef4ff; border: 1px solid #c9d8fb; border-radius: 12px; padding: 12px 6px; }
.smcr b { display: block; font-size: 30px; color: #2563eb; line-height: 1.2; }
.smcr span { font-size: 15px; }
.pdca-wheel { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; max-width: 320px; margin: 4px auto 20px; }
.pdca-wheel .q { padding: 18px 10px; text-align: center; color: #fff; font-weight: 600; line-height: 1.3; }
.pdca-wheel .q b { display: block; font-size: 30px; }
.pdca-wheel .p { background: #4f97b3; border-radius: 120px 12px 12px 12px; }
.pdca-wheel .d { background: #8b7bb5; border-radius: 12px 120px 12px 12px; }
.pdca-wheel .a { background: #4b9e73; border-radius: 12px 12px 12px 120px; }
.pdca-wheel .c { background: #c4677d; border-radius: 12px 12px 120px 12px; }
.phase { border-left: 5px solid; padding: 2px 0 2px 18px; margin: 18px 0; }
.phase h3 { margin-top: 6px; }
.phase.p { border-color: #4f97b3; } .phase.d { border-color: #8b7bb5; }
.phase.c { border-color: #c4677d; } .phase.a { border-color: #4b9e73; }

.grid5s { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin: 14px 0; }
.grid5s div { text-align: center; background: #f3edff; border: 1px solid #d8c8fb; border-radius: 12px; padding: 10px 4px; font-weight: 600; font-size: 15px; line-height: 1.35; }
.grid5s b { display: block; font-size: 24px; color: #7c3aed; }
.grid5s small { display: block; color: var(--ink-2); font-weight: 400; }
.ghs-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 12px 0; }
.ghs-grid div { text-align: center; font-size: 30px; border: 2px solid #dc2626; border-radius: 10px; padding: 8px 4px; background: #fff; }
.ghs-grid span { display: block; font-size: 14px; color: var(--ink); }
.why-chain { display: grid; gap: 8px; margin: 14px 0; }
.why-chain div { border-left: 4px solid #0891b2; background: #ecfeff; border-radius: 8px; padding: 8px 14px; }
.why-chain div.root { border-color: #dc2626; background: #fdf2f2; font-weight: 600; }
.why-chain b { display: inline-block; min-width: 90px; color: #0e7490; }
.why-chain .root b { color: var(--danger); }


.lesson figure img.page-img { max-height: none; width: 100%; max-width: 820px; }

/* ---------- Quiz ---------- */
.q-item { border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; margin: 14px 0; }
.q-item .q-title { font-weight: 500; margin-bottom: 8px; color: var(--navy); }
.q-item label {
  display: flex; gap: 10px; align-items: flex-start; padding: 9px 12px; border-radius: 10px; margin-top: 4px;
  cursor: pointer; border: 1px solid transparent; transition: background .12s ease, border-color .12s ease;
}
.q-item label:hover { background: var(--blue-softer); }
.q-item label:has(input:checked) { background: var(--blue-soft); border-color: #c9dbef; }
.q-item input { margin-top: 6px; accent-color: var(--navy); }
.q-item label.right, .q-item label.right:has(input:checked) { background: var(--good-soft); border-color: #a5d9c1; }
.q-item label.wrong, .q-item label.wrong:has(input:checked) { background: var(--danger-soft); border-color: #f2b8b2; }
.q-item.is-wrong { border-color: #f2b8b2; }
.q-review { display: flex; gap: 8px; align-items: flex-start; margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--line); font-size: 14.5px; line-height: 1.45; }
.q-review .ico { margin-top: 3px; }
.q-review.ok { color: var(--good); }
.q-review.no { color: var(--danger); }
.review-sum { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 6px; margin-top: 12px; font-size: 14.5px; }
.q-count { position: sticky; bottom: 0; background: rgba(255, 255, 255, .95); padding: 8px 0; font-size: 14px; color: var(--ink-2); }
.result { border-radius: 14px; padding: 20px; text-align: center; margin: 20px 0; background: var(--blue-soft); }
.result.pass { background: var(--good-soft); }
.result.fail { background: var(--warn-soft); }
.result .score { font-size: 34px; font-weight: 600; line-height: 1.2; color: var(--navy); font-variant-numeric: tabular-nums; }

/* ---------- Tables ---------- */
.table-wrap { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); }
table.data { width: 100%; border-collapse: collapse; font-size: 14.5px; }
table.data th { text-align: left; background: var(--blue-softer); color: var(--ink-2); padding: 10px 14px; font-weight: 500; font-size: 13.5px; white-space: nowrap; }
table.data td { padding: 11px 14px; border-top: 1px solid var(--line); vertical-align: middle; }
table.data tbody tr:hover td { background: var(--blue-softer); }
table.data a { text-decoration: none; font-weight: 500; }
table.data .num { font-variant-numeric: tabular-nums; white-space: nowrap; }
table.data .actions { white-space: nowrap; text-align: right; }
table.data .actions .btn + .btn { margin-left: 6px; }
.up { color: var(--good); font-weight: 500; }
.title-cell { display: flex; align-items: center; gap: 10px; min-width: 200px; }
.title-cell .course-ico { width: 34px; height: 34px; border-radius: 10px; }

/* ---------- Calendar ---------- */
.cal-grid-wrap { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 18px; align-items: start; }
.cal-head { display: flex; align-items: center; gap: 8px; margin-bottom: 14px; }
.cal-head h2 { font-size: 18px; margin: 0; flex: 1; }
.cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); border-top: 1px solid var(--line); border-left: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.cal-dow { font-size: 13px; color: var(--ink-2); text-align: center; padding: 6px 0; background: var(--blue-softer); border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.cal-day { min-height: 96px; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); padding: 5px; min-width: 0; font-size: 13px; }
.cal-day.off { background: #fafbfd; color: var(--ink-3); }
.cal-num { display: inline-grid; place-items: center; width: 24px; height: 24px; border-radius: 50%; font-variant-numeric: tabular-nums; }
.cal-day.today .cal-num { background: var(--navy); color: #fff; }
.cal-ev { display: block; width: 100%; text-align: left; border: 0; border-radius: 6px; background: var(--blue-soft); color: var(--navy); font-size: 12.5px; padding: 2px 6px; margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-decoration: none; }
.cal-ev:hover { background: #d8e6f5; }
.event.flash { animation: flash 1.2s ease; border-radius: 8px; }
@keyframes flash { 0%, 40% { background: var(--blue-soft); } 100% { background: transparent; } }

/* ---------- HR report ---------- */
.seg { display: inline-flex; background: #eef1f5; border-radius: 12px; padding: 3px; gap: 2px; margin-bottom: 18px; max-width: 100%; overflow-x: auto; scrollbar-width: none; }
.seg a, .seg button { border: 0; background: transparent; color: var(--ink-2); border-radius: 9px; padding: 7px 16px; font-size: 14px; text-decoration: none; white-space: nowrap; min-height: 36px; display: inline-flex; align-items: center; }
.seg .active { background: #fff; color: var(--navy); font-weight: 500; box-shadow: 0 1px 2px rgba(15, 42, 74, .12); }
.report-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 18px; margin-bottom: 18px; }
.legend { display: flex; gap: 14px; font-size: 13px; color: var(--ink-2); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; }
.key-pre { background: #9dbbdc; }
.key-post { background: var(--navy); }
.pair { display: grid; grid-template-columns: minmax(0, 190px) minmax(40px, 1fr) 82px; gap: 12px; align-items: center; padding: 6px 0; font-size: 14px; }
.pair-name { line-height: 1.3; overflow-wrap: anywhere; }
.pair-bars { display: grid; gap: 2px; }
.pair-bars i { display: block; height: 7px; min-width: 2px; border-radius: 0 4px 4px 0; transition: width .5s ease; }
.pair-val { text-align: right; color: var(--ink-2); font-variant-numeric: tabular-nums; white-space: nowrap; }
.months { display: flex; gap: 8px; align-items: flex-end; height: 170px; padding-top: 18px; }
.month { flex: 1; min-width: 0; height: 100%; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; gap: 4px; font-size: 12.5px; color: var(--ink-2); }
.month i { display: block; width: min(32px, 70%); min-height: 2px; background: var(--blue); border-radius: 4px 4px 0 0; transition: height .5s ease; }
.month b { font-weight: 500; color: var(--navy); font-variant-numeric: tabular-nums; }
.filters { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin: 4px 0 12px; }
.filters .control { width: auto; }
.filters input.control { min-width: 220px; }
table.report { width: 100%; border-collapse: collapse; font-size: 14px; }
table.report th { text-align: left; background: var(--blue-softer); color: var(--ink-2); padding: 10px 12px; font-weight: 500; white-space: nowrap; max-width: 200px; overflow: hidden; text-overflow: ellipsis; }
table.report td { padding: 9px 12px; border-top: 1px solid var(--line); vertical-align: top; white-space: nowrap; }
table.report td small { display: block; color: var(--ink-2); font-size: 12.5px; }
table.report th:nth-child(2), table.report td:nth-child(2) { position: sticky; left: 0; background: var(--surface); z-index: 1; }
table.report th:nth-child(2) { background: var(--blue-softer); }
td.c-done b { color: var(--good); font-weight: 500; }
td.c-doing b { color: var(--blue); font-weight: 500; }
td.c-none { color: var(--ink-3); text-align: center; }
td.c-count { font-weight: 500; text-align: center; }
td.c-date { color: var(--ink-2); font-size: 13px; }
.more-row { text-align: center; padding: 14px; }

/* ---------- Dialog ---------- */
dialog { border: 0; border-radius: var(--radius); padding: 0; width: min(520px, calc(100vw - 32px)); box-shadow: var(--shadow-lift); color: var(--ink); }
dialog::backdrop { background: rgba(15, 42, 74, .4); }
.dlg-head { padding: 18px 22px 0; }
.dlg-head h2 { margin: 0; font-size: 18px; }
.dlg-body { padding: 16px 22px 4px; max-height: 70vh; overflow-y: auto; }
.dlg-foot { display: flex; justify-content: flex-end; gap: 8px; padding: 12px 22px 18px; }
.field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.check-row { display: flex; gap: 10px; align-items: center; margin-bottom: 14px; }
.check-row input { width: 18px; height: 18px; accent-color: var(--navy); }
.toast { position: fixed; left: 50%; bottom: 84px; transform: translateX(-50%); background: var(--navy); color: #fff; padding: 9px 18px; border-radius: 99px; font-size: 14px; z-index: 50; animation: rise .2s ease both; }

/* ---------- Floating cards on soft blue (reference look) ---------- */
.panel, .stat-tile, .course-card, .room-head, .side, .lesson, .table-wrap { border-color: transparent; box-shadow: var(--shadow); }
.panel-head h2 { font-size: 18px; }
.panel-more { display: block; text-align: center; font-size: 14px; text-decoration: none; padding: 12px 0 0; margin-top: 10px; border-top: 1px solid var(--line); }
.panel-more:hover { text-decoration: underline; }
.num { font-variant-numeric: tabular-nums; }
.pills { display: flex; flex-wrap: wrap; gap: 6px; }
.pill { display: inline-block; max-width: 210px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13px; padding: 3px 10px; border-radius: 7px; background: var(--blue-soft); color: var(--navy-2); }
.pill b { font-weight: 600; margin-right: 2px; }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.good { background: var(--good-soft); color: var(--good); }
.art { display: block; width: 100%; height: 100%; }
.thumb { flex: none; display: block; width: 62px; height: 44px; border-radius: 9px; overflow: hidden; }

/* Rail + top bar */
.nav-mark { display: grid; place-items: center; align-self: center; width: 44px; height: 44px; margin-bottom: 18px; flex: none; border-radius: 12px; background: var(--navy); color: #fff; text-decoration: none; font-family: "Orbitron", "Segoe UI", sans-serif; font-weight: 600; font-size: 15px; letter-spacing: .04em; }
.icon-btn { position: relative; flex: none; display: grid; place-items: center; width: 42px; height: 42px; border: 0; border-radius: 12px; background: transparent; color: var(--ink-2); transition: background .15s ease, color .15s ease; }
.icon-btn:hover { background: #dfe8f5; color: var(--navy); }
.bell-dot { position: absolute; top: 9px; right: 10px; width: 9px; height: 9px; border-radius: 50%; background: #e5484d; border: 2px solid var(--bg); }
button.avatar { flex: none; width: 42px; height: 42px; border: 2px solid #fff; padding: 0; font-weight: 600; font-size: 17px; box-shadow: var(--shadow); }
.pop-wrap { position: relative; }
.pop { position: absolute; right: 0; top: calc(100% + 8px); z-index: 40; width: 300px; max-width: calc(100vw - 32px); background: var(--surface); border-radius: 14px; box-shadow: var(--shadow-lift); padding: 12px; animation: rise .16s ease both; }
.pop[hidden] { display: none; }
.pop h3 { margin: 2px 6px 8px; font-size: 15px; }
.pop p { margin: 6px; font-size: 14px; }
.pop .who { padding: 4px 8px 10px; margin-bottom: 4px; border-bottom: 1px solid var(--line); }
.pop .who b { display: block; font-weight: 500; color: var(--navy); }
.pop .who span { font-size: 13px; color: var(--ink-2); }
.pop-user { width: 240px; }
.notice-item { display: flex; gap: 10px; align-items: center; padding: 8px 6px; border-radius: 10px; font-size: 14px; line-height: 1.4; color: var(--ink); text-decoration: none; }
.notice-item:hover, .menu-row:hover { background: var(--blue-softer); }
.menu-row { display: flex; gap: 10px; align-items: center; width: 100%; padding: 9px 8px; border: 0; border-radius: 10px; background: transparent; text-align: left; font-size: 14.5px; }
.help-list { margin: 0 0 12px; padding-left: 1.3em; display: grid; gap: 6px; }

/* Dashboard */
.dash { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 22px; align-items: start; }
.dash-main, .dash-side { display: grid; gap: 22px; min-width: 0; }
.hero { position: relative; display: grid; grid-template-columns: minmax(0, 1fr) 260px; gap: 22px; margin: 26px 0; background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); padding: 24px 26px; }
.hero h1 { margin: 0 0 2px; font-size: 25px; }
.hero p { margin: 0; color: var(--ink-2); }
.hero-text { display: flex; flex-direction: column; min-width: 0; }
.hero small { display: block; font-size: 13.5px; color: var(--ink-2); margin-bottom: 6px; }
.hero-skills { margin-top: 18px; }
.hero-prog { margin-top: auto; padding-top: 20px; }
.hero-prog .bar { height: 7px; }
.hero-card { margin: -50px -6px -50px 0; background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow-lift); overflow: hidden; align-self: center; transition: transform .2s ease, box-shadow .2s ease; animation: rise .4s ease both; }
.hero-card:hover { transform: translateY(-3px); }
.hero-art { height: 112px; }
.hero-card-body { padding: 14px 16px 16px; }
.hero-card h2 { font-size: 18px; margin: 8px 0 14px; }
.hero-card .pill { max-width: 100%; }
.dash .stats { margin: 0; }
.stat-tile { align-items: center; }
.stat-ico { border-radius: 50%; width: 46px; height: 46px; }
.stats .stat-tile:nth-child(1) .stat-ico { background: #e5f4ed; color: #14734f; }
.stats .stat-tile:nth-child(2) .stat-ico { background: #e4eefb; color: #2563a8; }
.stats .stat-tile:nth-child(3) .stat-ico { background: #fcf0e3; color: #b8651b; }
.stats .stat-tile:nth-child(4) .stat-ico { background: #fbf5d9; color: #8a6d0b; }
.stat-tile b small { display: inline; font-size: 14px; font-weight: 400; color: var(--ink-3); }
.prog-head, .prog-row { display: grid; grid-template-columns: minmax(0, 1fr) 110px 150px 20px; gap: 14px; align-items: center; }
.prog-head { font-size: 13.5px; color: var(--ink-2); padding: 0 8px 8px; border-bottom: 1px solid var(--line); }
.prog-head span:first-child { grid-column: 1; }
.prog-row { grid-template-columns: 62px minmax(0, 1fr) 110px 150px 20px; padding: 10px 8px; border-bottom: 1px solid var(--line); text-decoration: none; color: inherit; border-radius: 10px; transition: background .15s ease; }
.prog-row:hover { background: var(--blue-softer); }
.prog-row > .ico { color: var(--ink-3); }
.prog-title { font-weight: 500; color: var(--navy); line-height: 1.35; font-size: 14.5px; }
.prog-pct { display: inline-flex; align-items: center; gap: 8px; font-size: 14px; }
.prog-next { font-size: 13.5px; color: var(--ink-2); line-height: 1.35; }
.prog-next.due { color: var(--warn); font-weight: 500; }
.mini-ring { flex: none; }
.mini-ring circle { fill: none; stroke: #e4ebf5; stroke-width: 5; }
.mini-ring .on { stroke: var(--blue); }
.mini-ring.full .on { stroke: #2f9e6e; }
.wk-head { display: flex; align-items: center; gap: 2px; margin-bottom: 8px; }
.wk-head h2 { flex: 1; margin: 0; font-size: 21px; }
.wk-days { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 2px; }
.wk-day { display: grid; justify-items: center; gap: 2px; padding: 6px 0 5px; border: 0; border-radius: 10px; background: transparent; font-variant-numeric: tabular-nums; transition: background .15s ease; }
.wk-day:hover { background: var(--blue-softer); }
.wk-day small { font-size: 12.5px; color: var(--ink-2); }
.wk-day b { font-weight: 500; font-size: 15px; }
.wk-day.today b { color: var(--blue); font-weight: 700; }
.wk-day.sel { background: var(--blue-soft); }
.wk-dots { display: flex; gap: 3px; height: 5px; }
.wk-dots i { width: 5px; height: 5px; border-radius: 50%; background: var(--blue); }
.wk-title { font-size: 17px; margin: 18px 0 0; }
.wk-date { font-size: 14px; margin-bottom: 12px; }
.wk-none { font-size: 14px; margin: 0 0 10px; }
.tl { display: grid; grid-template-columns: 42px minmax(0, 1fr); gap: 10px; padding-bottom: 14px; }
.tl time { font-size: 13.5px; color: var(--ink-2); font-variant-numeric: tabular-nums; padding-top: 2px; }
.tl-body { border-left: 3px solid #f0b37e; padding-left: 12px; min-width: 0; }
.tl-body .pill { background: var(--warn-soft); color: var(--warn); font-size: 12.5px; }
.tl-body.online { border-color: var(--blue); }
.tl-body.online .pill { background: var(--blue-soft); color: var(--navy-2); }
.tl-body h3 { margin: 5px 0 1px; font-size: 15px; font-weight: 500; line-height: 1.35; }
.tl-body h3 a { color: inherit; text-decoration: none; }
.tl-body h3 a:hover { color: var(--blue); }
.tl-body p { margin: 0 0 4px; font-size: 13.5px; line-height: 1.4; }
.donut { display: flex; align-items: center; gap: 18px; }
.donut .ring { width: 124px; }
.donut .ring circle { fill: none; stroke-width: 15; }
.donut-key { list-style: none; margin: 0; padding: 0; flex: 1; min-width: 0; display: grid; gap: 5px; font-size: 13.5px; }
.donut-key li { display: flex; align-items: center; gap: 8px; }
.donut-key i { flex: none; width: 10px; height: 10px; border-radius: 3px; }
.donut-key span { flex: 1; color: var(--ink-2); line-height: 1.3; }
.donut-key b { font-weight: 600; color: var(--navy); font-variant-numeric: tabular-nums; }
circle.k-done { stroke: var(--navy); } i.k-done { background: var(--navy); }
circle.k-doing { stroke: #4d8fe0; } i.k-doing { background: #4d8fe0; }
circle.k-due { stroke: #efa24c; } i.k-due { background: #efa24c; }
circle.k-todo { stroke: #d3e0f0; } i.k-todo { background: #d3e0f0; }

/* Catalog cards with a picture on top */
.course-card { padding: 0 0 16px; overflow: hidden; }
.course-card > :not(.card-art) { margin-left: 18px; margin-right: 18px; }
.card-art { height: 112px; }
.card-cat { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-size: 13px; }
.title-cell .thumb { width: 50px; height: 36px; }

/* ---------- Responsive ---------- */
@media (max-width: 1240px) {
  .dash { grid-template-columns: minmax(0, 1fr); }
  .dash-side { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); align-items: start; }
}
@media (max-width: 980px) {
  .report-grid, .cal-grid-wrap { grid-template-columns: minmax(0, 1fr); }
  .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .prog-head, .prog-row { grid-template-columns: 62px minmax(0, 1fr) 96px 20px; }
  .prog-head { grid-template-columns: minmax(0, 1fr) 96px 20px; }
  .prog-head span:last-child, .prog-next { display: none; }
  .room-grid { grid-template-columns: minmax(0, 1fr); }
  .side { position: static; max-height: none; }
  .side summary { display: flex; align-items: center; justify-content: space-between; padding: 8px 10px; font-weight: 500; color: var(--navy); cursor: pointer; }
  .side summary small { color: var(--ink-2); font-weight: 400; }
  .login-wrap { grid-template-columns: minmax(0, 1fr); }
  .login-side { display: none; }
  .grid2, .grid3 { grid-template-columns: 1fr; }
  .frame4, .smcr { grid-template-columns: 1fr 1fr; }
  .grid5s { grid-template-columns: repeat(3, 1fr); }
  .ghs-grid { grid-template-columns: 1fr 1fr; }
  .cols2 { columns: 1; }
}
@media (max-width: 720px) {
  body { font-size: 15px; }
  .nav { display: none; }
  .workspace { margin-left: 0; padding-bottom: 68px; }
  .top { padding: 0 16px; height: 58px; }
  .top-left, .rail-btn { display: none; }
  .top .spacer { display: block; }
  .hero { grid-template-columns: minmax(0, 1fr); margin: 0; padding: 18px; }
  .hero h1 { font-size: 22px; }
  .hero-prog { padding-top: 16px; }
  .hero-card { margin: 0; align-self: stretch; }
  .dash-side { grid-template-columns: minmax(0, 1fr); }
  .prog-head, .prog-row { gap: 10px; padding-left: 0; padding-right: 0; }
  .prog-head { grid-template-columns: minmax(0, 1fr) 66px; }
  .prog-row { grid-template-columns: 50px minmax(0, 1fr) 66px; }
  .prog-row .thumb { width: 50px; height: 36px; }
  .prog-row > .ico, .prog-head span:nth-child(3) { display: none; }
  .prog-pct { gap: 5px; font-size: 13px; }
  .donut { flex-wrap: wrap; justify-content: center; }
  .filters .control, .filters input.control { width: 100%; min-width: 0; }
  .sync { font-size: 12px; white-space: normal; text-align: right; }
  .page { padding: 18px 16px 40px; }
  .page-head h1 { font-size: 22px; }
  .panel { padding: 16px; }
  .lesson { padding: 18px 16px; }
  .room-head { padding: 16px; }
  .room-title h1 { font-size: 19px; }
  .stats { gap: 10px; }
  .stat-tile { padding: 12px; gap: 10px; }
  .stat-ico { width: 40px; height: 40px; }
  .hbar, .pair { grid-template-columns: minmax(0, 104px) minmax(30px, 1fr) 58px; gap: 8px; }
  .pair { grid-template-columns: minmax(0, 104px) minmax(30px, 1fr) 76px; }
  .tabbar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; display: flex; background: var(--surface);
    border-top: 1px solid var(--line); padding: 4px 4px calc(4px + env(safe-area-inset-bottom));
  }
  .tabbar .nav-item { flex: 1 1 0; min-width: 0; flex-direction: column; gap: 1px; padding: 6px 0; font-size: 11px; justify-content: center; }
  .tabbar .nav-item span { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
  .tabbar .nav-item.active { background: transparent; color: var(--navy); font-weight: 600; }
  .tabbar .nav-item.active .ico { color: var(--blue); }
  .cal-day { min-height: 58px; padding: 3px; }
  .cal-ev { font-size: 0; height: 6px; padding: 0; width: 6px; border-radius: 50%; background: var(--blue); display: inline-block; margin: 2px 2px 0 0; }
  .stepper li { font-size: 12px; }
  .stepper li b { font-size: 12.5px; }
  .stepper li small { display: none; }
  .btn.block-sm { width: 100%; }
  /* ตารางกลายเป็นการ์ดเรียงลงมาบนมือถือ */
  table.stack thead { display: none; }
  table.stack, table.stack tbody, table.stack tr, table.stack td { display: block; width: 100%; }
  table.stack tr { padding: 10px 14px; border-top: 1px solid var(--line); }
  table.stack tr:first-child { border-top: 0; }
  table.stack td { border: 0; padding: 3px 0; display: flex; justify-content: space-between; gap: 12px; text-align: right; }
  table.stack td::before { content: attr(data-label); color: var(--ink-2); font-size: 13px; text-align: left; flex: none; }
  table.stack td.title { display: block; text-align: left; padding-bottom: 6px; }
  table.stack td.title::before { display: none; }
  table.stack td.actions { justify-content: flex-end; padding-top: 8px; }
  table.stack td.actions::before { display: none; }
  table.stack tbody tr:hover td { background: transparent; }
  .field-row { grid-template-columns: 1fr; gap: 0; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}

</style>

  function api(name) {
    var args = Array.prototype.slice.call(arguments, 1);
    if (!window.google || !google.script) {

        method: "POST", credentials: "omit",

        body: JSON.stringify({ fn: name, args: args }),
      }).then(function (r) { return r.json(); });
    }
    return new Promise(function (resolve, reject) {
      var runner = google.script.run.withSuccessHandler(resolve).withFailureHandler(reject);
      runner[name].apply(runner, args);
    });

  document.addEventListener("click", function (e) {

  // ชื่อย่อในวงกลมผู้ใช้: ข้ามคำนำหน้าและสระหน้า
  function initial(name) {

  function ring(pct, big, small) {

  // วงแหวนเล็กในแถวตาราง: เขียว = จบแล้ว น้ำเงิน = กำลังเรียน
  function miniRing(pct) {
    var r = 9, c = 2 * Math.PI * r, on = c * Math.max(0, Math.min(100, pct)) / 100;
    return '<svg class="mini-ring' + (pct >= 100 ? " full" : "") + '" width="26" height="26" viewBox="0 0 26 26" aria-hidden="true"><circle cx="13" cy="13" r="' + r + '"/>' +

  }
  // โดนัทสัดส่วน: parts = [{label, value, cls}] มีช่องว่างระหว่างส่วน และคำอธิบายพร้อมตัวเลขเสมอ ไม่ต้องดูจากสีอย่างเดียว
  function donut(parts, big, small) {
    var r = 48, c = 2 * Math.PI * r, total = parts.reduce(function (s, p) { return s + p.value; }, 0), at = 0, gap = 3;
    var arcs = parts.filter(function (p) { return p.value > 0; }).map(function (p, i, shown) {
      var len = c * p.value / total, g = shown.length > 1 ? gap : 0;

      '<ul class="donut-key">' + parts.map(function (p) {
        return '<li><i class="' + p.cls + '"></i><span>' + esc(p.label) + "</span><b>" + p.value + "</b></li>";
      }).join("") + "</ul></div>";

  };
})();
</script>

<h3>การสื่อสารภายในองค์กร คืออะไร</h3>
<p>กระบวนการแลกเปลี่ยน<b>ข้อมูลข่าวสาร ความคิด ความรู้สึก</b>ระหว่างบุคคลภายในองค์กร เพื่อให้เกิด<b>ความเข้าใจร่วมกัน</b> และมุ่งสู่<b>เป้าหมายเดียวกัน</b> โดยใช้ช่องทางที่หลากหลายทั้งแบบทางการและไม่เป็นทางการ</p>
<div class="callout">การสื่อสารภายในองค์กรเป็นเครื่องมือสำคัญในการขับเคลื่อนความสำเร็จขององค์กร ช่วยให้พนักงานเข้าใจ <b>เป้าหมาย กลยุทธ์ นโยบาย</b> และทำงานร่วมกันได้อย่างมีประสิทธิภาพ</div>`,

        body: `
<p>แบบจำลอง <b>S-M-C-R</b> ตามแนวคิดของเบอร์โล (Berlo)</p>
<div class="smcr">
  <div><b>S</b><span>ผู้ส่งสาร<br>Sender</span></div>
  <div><b>M</b><span>สาร<br>Message</span></div>
  <div><b>C</b><span>ช่องทาง<br>Channel</span></div>
  <div><b>R</b><span>ผู้รับสาร<br>Receiver</span></div>
</div>

<h3>ผู้ส่งสาร (Sender)</h3>
<p>ผู้ที่ต้องการสื่อสารต้องทำความเข้าใจเรื่องที่จะสื่อสารให้ชัดเจนก่อน อาจใช้การพูดคุย ออกคำสั่ง บันทึกข้อความ ข่าวสาร หรือรายงาน ปัจจัยของผู้ส่งสาร ได้แก่ ทักษะการสื่อสาร ทัศนคติ ความรู้ ระบบสังคม และวัฒนธรรม</p>

<h3>สาร (Message)</h3>
<p>ประกอบด้วย เนื้อหา ส่วนประกอบ โครงสร้าง การจัดสาร และรหัส</p>

<h3>ช่องทาง / สื่อ (Channel / Media)</h3>
<p>ตัวกลางที่ทำให้ข่าวสารเดินทางจากแหล่งกำเนิดไปถึงผู้รับ เช่น เครื่องขยายเสียง วิทยุ โทรทัศน์ อินเทอร์เน็ต เว็บไซต์ e-mail — รับรู้ผ่านการเห็น การได้ยิน การสัมผัส การได้กลิ่น และการลิ้มรส</p>

<h3>ผู้รับสาร (Receiver)</h3>
<p>ต้องมีความรู้ความเข้าใจ ประสบการณ์ และทักษะในการ<b>ถอดรหัส (Decoding)</b> เพื่อเข้าใจข่าวสารที่ผู้ส่งเข้ารหัส <b>(Encoding)</b> มา ปัจจัยของผู้รับเช่นเดียวกับผู้ส่ง: ทักษะการสื่อสาร ทัศนคติ ความรู้ ระบบสังคม และวัฒนธรรม</p>`,
      },
      {

        minutes: 6,
        body: `
<div class="grid2">
  <div class="card"><h4>⬆️ 1. จากล่างขึ้นบน (Upward)</h4><p>จากพนักงานไปยังผู้บริหาร (Bottom-Up) ใช้สื่อสารปัญหา อุปสรรค ข้อเสนอแนะ ความคิดเห็น เป็นการสื่อสารสองทางที่เปิดโอกาสให้พนักงานมีส่วนร่วม และสร้าง <b>Employee Engagement</b> หรือความผูกพันกับองค์กร</p></div>
  <div class="card"><h4>⬇️ 2. จากบนลงล่าง (Downward)</h4><p>จากผู้บังคับบัญชาไปยังผู้ใต้บังคับบัญชา เช่น สั่งงาน บอกเป้าหมาย มอบหมายงาน ให้ข้อมูลย้อนกลับ (Performance Feedback) และการประชุม ช่วยให้บุคลากรเห็นว่างานของตนสำคัญและมีผลต่อแผนงานขององค์กรอย่างไร</p></div>
  <div class="card"><h4>↗️ 3. แนวทแยง (Diagonal)</h4><p>สื่อสาร<b>ข้ามแผนกและข้ามระดับ</b> มักเป็นระหว่างฝ่ายให้คำแนะนำ (Staff) กับฝ่ายปฏิบัติการ (Line) เช่น ผู้จัดการฝ่ายบุคคลแจ้งกฎระเบียบใหม่ให้พนักงานฝ่ายผลิต</p></div>
  <div class="card"><h4>↔️ 4. แนวนอน (Horizontal)</h4><p>สื่อสารในกลุ่มงานหรือระดับเดียวกัน เช่น เพื่อนร่วมงาน (ไม่จำเป็นต้องแผนกเดียวกัน) มักเป็นมิตรและเป็นกันเอง ช่วยให้สนิทสนมและสร้างความสัมพันธ์ที่ดีในองค์กร</p></div>
</div>`,

        title: "ทางเดียว / สองทาง และวิธีการสื่อสาร",
        minutes: 5,
        body: `
<h3>ทิศทางของการสื่อสาร</h3>
<div class="grid2">
  <div class="card"><h4>One-Way Communication</h4><p>ส่งข่าวสารไปยังผู้รับเพียงฝ่ายเดียว ไม่มีการตอบกลับ หรือตอบกลับไม่ได้ในทันที</p><p class="tag">เช่น ประกาศข่าวสารองค์กร ประกาศสวัสดิการ ประกาศข้อบังคับการทำงาน</p></div>
  <div class="card"><h4>Two-Way Communication</h4><p>ผู้ส่งและผู้รับแลกเปลี่ยนความคิด โต้ตอบได้ทั้ง 2 ฝ่าย ไม่จำเป็นต้องตอบกลับทันที</p><p class="tag">เช่น การประชุม การพูดคุย หรือ HR ทำแบบสำรวจผ่าน Google Forms แล้วรอพนักงานตอบ</p></div>
</div>

<h3>วิธีการสื่อสารในองค์กร</h3>
<div class="grid3">
  <div class="card"><h4>🗣️ ด้วยวาจา (ภาษาพูด)</h4><p>พูดเป็นประโยค มีจังหวะ น้ำเสียงเบา-ดัง ความเร็ว-ช้าของการพูด</p></div>
  <div class="card"><h4>🙌 ด้วยกิริยาท่าทาง (ภาษากาย)</h4><p>การสบตา การพยักหน้า การโค้ง สีหน้า การสัมผัส และการใช้มือ</p></div>
  <div class="card"><h4>✍️ ด้วยลายลักษณ์อักษร (ภาษาเขียน)</h4><p>ตัวอักษร สัญลักษณ์ และรูปภาพต่าง ๆ</p></div>
</div>`,

      {
        title: "9 เทคนิคการสื่อสาร และข้อดีของการสื่อสารที่ดี",
        minutes: 7,
        body: `
<h3>9 เทคนิคการสื่อสารอย่างมีประสิทธิภาพ</h3>
<ol class="numbered-cards">
  <li><b>เป็นผู้ฟังที่ดี (Active Listening)</b> — ใส่ใจคู่สนทนา สังเกตทั้งคำพูด ท่าทาง สีหน้า น้ำเสียง ฟังเพื่อเข้าใจ ไม่ใช่ฟังเพื่อโต้แย้ง</li>
  <li><b>สื่อสารตรงประเด็นและกระชับ</b> — บอกสิ่งสำคัญให้ชัด ไม่วกวน</li>
  <li><b>ทักษะการเล่าเรื่อง (Storytelling)</b> — หาจุดร่วมกับผู้ฟัง เปิดด้วยประโยคที่ดึงความสนใจ เช่น เริ่มจาก pain point ของผู้ฟัง</li>
  <li><b>ศิลปะในการพูด (วาทศิลป์)</b> — รู้ว่าเวลาและสถานการณ์นี้ควรพูดอะไร รักษาบรรยากาศเชิงบวก สำคัญมากเมื่อต้องเจรจา ปฏิเสธ หรือให้ feedback เชิงลบ</li>
  <li><b>ภาษากาย</b> — การสบตา การยิ้ม บุคลิกภาพ ช่วยถ่ายทอดความมั่นใจและความรู้สึกร่วม</li>
  <li><b>ความกล้าแสดงออก</b> — สร้างความมั่นใจและความเชื่อมั่นให้ผู้รับสาร</li>
  <li><b>ความโปร่งใสและเป็นกลาง</b> — สื่อสารตามข้อเท็จจริง ไม่ลำเอียง</li>
  <li><b>การรักษาเวลา</b> — เคารพเวลาของผู้ฟังและผู้ร่วมประชุม</li>
  <li><b>การรับฟังข้อเสนอของผู้อื่น</b> — เปิดใจรับความคิดเห็นที่แตกต่าง</li>
</ol>

<h3>การสื่อสารที่มีประสิทธิภาพช่วยชีวิตส่วนบุคคล</h3>
<ul>
  <li>สร้างและบริหารความสัมพันธ์ได้ดียิ่งขึ้น</li>
  <li>รับมือกับความขัดแย้ง และหาทางออกร่วมกันอย่างสร้างสรรค์</li>
  <li>สุขภาพจิตดีขึ้น จิตใจมั่นคง เพราะรู้จักสื่อสารอารมณ์ของตนเอง</li>
</ul>

<h3>ข้อดีต่อทีมและองค์กร</h3>
<ul class="check">
  <li>ทีมร่วมมือกันมากขึ้น แรงจูงใจในองค์กรเพิ่มขึ้น</li>
  <li>ลดความสับสนและความเข้าใจผิด</li>
  <li>ส่งเสริมภาวะผู้นำ — ทักษะสำคัญในการก้าวเป็นหัวหน้าทีม</li>
  <li>ผู้นำสร้างทีมเวิร์คและการประสานงานที่ดีขึ้น</li>
  <li>คนในทีมรู้ความคาดหวังขององค์กรและหัวหน้าอย่างชัดเจน</li>
  <li>โปร่งใสในการรายงานความคืบหน้า บทบาทหน้าที่ และความรับผิดชอบ</li>
  <li>ความสัมพันธ์ดีขึ้น คนในทีมสนับสนุนกัน</li>
</ul>

<p class="refs">แหล่งอ้างอิงจากเอกสารต้นฉบับ: disruptignite.com/blog/communication · humansoft.co.th · thaiprint.org · flash-hr.com</p>`,

      { q: "ในแบบจำลอง S-M-C-R ตัว “C” หมายถึงอะไร?", options: ["Customer", "Culture", "Channel (ช่องทาง)", "Control"], answer: 2 },
      { q: "ผู้รับสารต้องมีทักษะใดเพื่อเข้าใจข่าวสารที่ผู้ส่งเข้ารหัสมา?", options: ["Encoding", "Decoding (ถอดรหัส)", "Feedback", "Storytelling"], answer: 1 },

      { q: "ผู้จัดการฝ่ายบุคคลแจ้งกฎระเบียบใหม่ให้พนักงานฝ่ายผลิต เป็นการสื่อสารแบบใด?", options: ["แนวทแยง (Diagonal)", "แนวนอน (Horizontal)", "จากล่างขึ้นบน (Upward)", "ทางเดียวแบบส่วนตัว"], answer: 0 },

    ],

<p>ปัญหาเป็นสิ่งที่หลีกเลี่ยงไม่ได้ แต่เราเรียนรู้ที่จะแก้ปัญหาได้ ปัจจุบันมีเครื่องมือมากมาย เช่น POCCC, POSDC, POLC — PDCA คือกระบวนการที่ให้ความสำคัญมากกว่าแค่การวางแผน แต่รวมถึง<b>การลงมือทำ ตรวจสอบ และปรับปรุงพัฒนาอย่างเป็นระบบ</b></p>
<div class="callout"><b>PDCA</b> คือ <b>วงจรบริหารงานคุณภาพ</b> ประกอบด้วย 4 ขั้นตอน Plan-Do-Check-Act เป็นกระบวนการปรับปรุงการทำงานขององค์กรอย่างเป็นระบบ เพื่อแก้ปัญหาและเกิด<b>การพัฒนาอย่างต่อเนื่อง (Continuous Improvement)</b> — ทำซ้ำได้เรื่อย ๆ จนกลายเป็นวงจร (Cycle)</div>

<h3>ที่มา</h3>
<p>เกิดขึ้นช่วงทศวรรษ 1950 โดยบิดาแห่งการควบคุมคุณภาพสมัยใหม่ <b>ดร.วิลเลียม เอ็ดเวิร์ดส์ เดมมิ่ง (Dr. William Edwards Deming)</b> ซึ่งพัฒนาต่อจากปรมาจารย์ของเขา <b>วอลเตอร์ เอ ชิวฮาร์ท (Walter Andrew Shewhart)</b> จึงมีชื่อเรียกอีกว่า <b>Deming Cycle</b> หรือ <b>Shewhart Cycle</b></p>

</ol>`,
      },
      {
        title: "ส2 สะดวก (Seiton)",
        minutes: 8,
        body: `
<p class="lead">SEITON (เซตง) · Neatness — ระเบียบเรียบร้อย</p>
<div class="card"><h4>ส2 สะดวก คือ</h4><ul><li>จัดเก็บให้เป็นหมวดหมู่</li><li>กำหนดที่อยู่ให้ชัดเจน</li><li>ทำคู่ไปกับ Visual Display / Control / Management ให้เป็น</li><li>กำหนดหลักเกณฑ์ สร้างแผนผัง และ Update ให้สมบูรณ์</li></ul></div>
<div class="grid2">
  <div class="card"><h4>วัตถุประสงค์</h4><p>เพิ่มประสิทธิภาพในการทำงาน และปรับปรุงการทำงานให้ดีขึ้นอยู่เสมอ</p></div>
  <div class="card"><h4>ผลลัพธ์ที่ได้</h4><p><b>ค้นหาสิ่งของได้ภายใน 30 วินาที</b> และ Productivity เพิ่มขึ้น</p></div>
</div>

<h3>วิธีการทำ “สะดวก”</h3>
<ol class="steps">
  <li><span class="step-no">1</span>จัดหมวดหมู่สิ่งของ/ขั้นตอนการทำงาน และกำหนดปริมาณการจัดเก็บ (Max-Min)</li>
  <li><span class="step-no">2</span>จัดหาพื้นที่การจัดเก็บที่เหมาะสม และทำการชี้บ่งเพื่อป้องกันการสับสน เช่น ป้าย ทาสี รูปภาพ</li>
  <li><span class="step-no">3</span>ประยุกต์ใช้ Visual Display / Visual Control / Visual Management</li>
  <li><span class="step-no">4</span>จัดทำแผนผังการจัดเก็บให้ชัดเจน และทำการปรับปรุงแก้ไขอย่างต่อเนื่อง</li>
</ol>

<h3>หลักการจัดวาง</h3>
<div class="callout">ใช้บ่อย <b>ไว้ใกล้มือ</b> · เรียง<b>ซ้ายไปขวา</b> จาก<b>บนลงล่าง</b> · <b>หนักอยู่ล่าง เบาอยู่บน</b> · <b>เล็กสั้นอยู่หน้า ใหญ่ยาวอยู่หลัง</b></div>
<figure><img class="page-img" src="${IMG["5s-placement"]}" alt="ตัวอย่างการจัดวาง: ตู้กุญแจติดป้ายสี อุปกรณ์สำนักงานบนแผ่นรองมีป้ายบอกตำแหน่ง แผนผังสำนักงาน และชั้นวางมีป้ายและแถบสี"><figcaption>ตัวอย่างการจัดวาง การชี้บ่ง และแผนผังการจัดเก็บ</figcaption></figure>

<h3>Visual Display — การแสดงด้วยการมองเห็น</h3>
<p>เป็นการแสดง สื่อสารด้วยการมองเห็น เพื่อให้ทราบ รับรู้ข้อมูล เช่น กราฟ แผนภูมิ รูปภาพ ป้ายความปลอดภัย</p>
<figure><img class="page-img" src="${IMG["5s-visual-display"]}" alt="ตัวอย่าง Visual Display: ป้ายห้องน้ำ ลูกศรบอกทางขึ้นลงบันได ป้ายทางออก และป้ายอุปกรณ์ดับเพลิง"></figure>

<h3>Visual Control — การควบคุมด้วยการมองเห็น</h3>
<p>เพื่อแสดงให้เห็นการจัดการว่ายังเป็นปกติ หรือมีความผิดปกติเกิดขึ้น เพื่อให้คนรีบดำเนินการแก้ไขได้อย่างถูกต้องเหมาะสม เช่น เกจวัดต่าง ๆ</p>
<figure><img class="page-img" src="${IMG["5s-visual-control"]}" alt="ตัวอย่าง Visual Control: ถังมีแถบบอกระดับ เกจวัดมีแถบสีเขียว เหลือง แดง และแผงเกจวัดเรียงเป็นแถว"></figure>

<h3>Visual Management — การบริหารจัดการด้วยการมองเห็น</h3>
<p>เปลี่ยนข้อมูล ข่าวสาร สถานะ หรือเป้าหมายในการทำงานให้กลายเป็นป้าย สัญลักษณ์ สี รูปภาพ หรือบอร์ด เพื่อให้ทุกคนที่เกี่ยวข้องมองเห็น เข้าใจ และรับรู้สภาพความเป็นจริงของหน้างานได้ทันที โดยไม่จำเป็นต้องเอ่ยปากถาม หรือเปิดอ่านเอกสารรายงานยาว ๆ</p>
<figure><img class="page-img" src="${IMG["5s-visual-mgmt"]}" alt="ตัวอย่าง Visual Management: บอร์ดติดตามผล บอร์ดกิจกรรม 5ส และกราฟแสดงผลการดำเนินงาน"></figure>

<h3>ประโยชน์จากการทำ “สะดวก”</h3>
<ol>
  <li>ลดเวลาในการค้นหาอุปกรณ์หรือเอกสาร</li>
  <li>ลดการสูญหายของอุปกรณ์หรือเอกสาร ทำงานได้เสร็จทันตามแผน</li>
  <li>ลดเวลาการทำงาน หากเป็นงานเกี่ยวกับการให้บริการ จะได้รับบริการที่รวดเร็วขึ้น</li>
  <li>ช่วยเพิ่มประสิทธิภาพในการทำงานให้ดีขึ้น</li>
  <li>ช่วยสร้างบรรยากาศในที่ทำงานให้น่าอยู่ ซึ่งมีผลต่อสุขภาพกายและใจของผู้ปฏิบัติงาน</li>
</ol>
<figure><img src="${IMG["5s-seiton-ask"]}" alt="ทำสะดวกต้องตอบได้ เก็บอะไร เก็บที่ไหน จำนวนเท่าไหร่"></figure>`,
      },
      {
        title: "ส3 สะอาด (Seiso)",
        minutes: 5,
        body: `
<p class="lead">SEISO (เซโซ) · Cleaning — ลงมือทำความสะอาด</p>
<div class="card"><h4>ส3 สะอาด คือ</h4><ul><li>มีขั้นตอนการทำความสะอาด</li><li>อย่าให้ขาดผู้รับผิดชอบ</li><li>หมั่นตรวจสอบสิ่งผิดปกติ</li><li>กำหนดแผนงาน ตามความถี่</li></ul></div>
<div class="grid2">
  <div class="card"><h4>วัตถุประสงค์</h4><p>ตรวจสอบสิ่งผิดปกติ และแก้ไข</p></div>
  <div class="card"><h4>ผลลัพธ์ที่ได้</h4><p>อุปกรณ์ เครื่องจักร มีความพร้อมใช้ สภาพแวดล้อมน่าทำงานและ<b>ปลอดภัย</b></p></div>
</div>

<h3>ขั้นตอนการทำ “สะอาด”</h3>
<ol class="steps">
  <li><span class="step-no">1</span>กำหนดผู้รับผิดชอบตามพื้นที่รับผิดชอบให้ชัดเจน</li>
  <li><span class="step-no">2</span>จัดทำขั้นตอนการทำความสะอาด โดยระบุวิธีการตรวจสอบ การบำรุงรักษาที่ชัดเจน</li>
  <li><span class="step-no">3</span>จัดทำแผนการทำความสะอาดพื้นที่ และกำหนดความถี่ที่เหมาะสม</li>
  <li><span class="step-no">4</span>ลงมือทำความสะอาดตามความถี่ที่กำหนด โดยให้ตรวจสอบอุปกรณ์หรือเครื่องมือ หากผิดปกติให้รีบทำการแก้ไขทันที</li>
</ol>

<h3>การตรวจสอบโดยใช้ประสาทสัมผัส</h3>
<figure><img class="page-img" src="${IMG["5s-senses"]}" alt="ตา ค้นหารอยรั่ว น้อตโบลต์ที่หลวม หู ค้นหาเสียงลมรั่ว เสียงสั่นคลอน จมูก ค้นหากลิ่นไหม้ น้ำมันรั่ว แก๊สรั่ว สารเคมีหก สัมผัส ค้นหาการทำงานที่ผิดปกติ เช่น อุณหภูมิมอเตอร์สูงกว่าปกติ การสั่นสะเทือน การโยกคลอน"></figure>

<h3>ประโยชน์จากการทำ “สะอาด”</h3>
<ol>
  <li>สภาพแวดล้อมในที่น่าทำงานมีความสะอาดและปลอดภัย</li>
  <li>บรรยากาศในที่ทำงานมีความสดชื่น น่าอยู่</li>
  <li>ช่วยเพิ่มประสิทธิภาพการทำงานของเครื่องมือ เครื่องจักร และวัสดุอุปกรณ์ต่าง ๆ</li>
  <li>ช่วยยืดอายุการใช้งานของเครื่องมือ เครื่องจักร วัสดุอุปกรณ์ ให้ยาวนานยิ่งขึ้น</li>
  <li>ลดของเสียของเครื่องจักร อันเนื่องมาจากความสกปรก ซึ่งเป็นสาเหตุทำให้เครื่องจักรเสียหายได้</li>
</ol>
<figure><img src="${IMG["5s-seiso-team"]}" alt="ภาพการ์ตูนทุกคนช่วยกันทำความสะอาด"></figure>`,
      },
      {
        title: "ส4 สร้างมาตรฐาน (Seiketsu)",
        minutes: 9,
        body: `
<p class="lead">SEIKETSU (เซเคทซึ) · Standardization — สร้างแนวทางปฏิบัติที่ดีร่วมกัน</p>
<div class="card"><h4>ส4 สร้างมาตรฐาน คือ</h4><ul><li>กำหนดเป็นลายลักษณ์อักษร</li><li>หมั่นติดตามและประเมินผล</li><li>ฝึกอบรม เพื่อเพิ่มทักษะคน</li><li>สร้างแรงจูงใจคน ให้ร่วมปรับปรุงงาน</li></ul></div>
<div class="grid2">
  <div class="card"><h4>วัตถุประสงค์</h4><p>เพื่อรักษา พัฒนา และยกระดับการทำ 3ส แรก และลดความเสี่ยงในการปฏิบัติงาน</p></div>
  <div class="card"><h4>ผลลัพธ์ที่ได้</h4><p>ทุกคนยอมรับ และปฏิบัติตามมาตรฐาน และ<b>สามารถทำงานแทนกันได้</b></p></div>
</div>

<h3>แนวทางกำหนดมาตรฐาน 5ส</h3>
<figure><img class="page-img" src="${IMG["5s-standard-guide"]}" alt="มาตรฐานที่ดี: สามารถปฏิบัติตามได้เหมือนกัน สิ่งที่ทุกคนร่วมกันกำหนดขึ้น ระบุรายละเอียดชัดเจนเข้าใจง่าย เปลี่ยนแปลงได้ตามความเหมาะสม สอดคล้องกันนโยบาย เกิดผลดีต่อทุกคนและบริษัท"><figcaption>ยอมรับแนวทางการปฏิบัติ และสามารถทำแทนกันได้ตามผลลัพธ์ที่ต้องการ</figcaption></figure>

<h3>ประเภทมาตรฐาน 5ส</h3>
<div class="callout"><b>มาตรฐาน 5ส = มาตรฐานกลาง + มาตรฐานพื้นที่</b><br>
มาตรฐาน<b>กลาง</b> คือสิ่งที่มีเหมือนกัน/พื้นที่ใช้ร่วมกัน<br>
มาตรฐาน<b>พื้นที่</b> คือมาตรฐานของแต่ละพื้นที่ ที่หัวหน้าพื้นที่และสมาชิกร่วมจัดทำขึ้น มี 3 ประเภท ได้แก่ จัดเก็บ ใช้งาน บำรุงรักษาเบื้องต้น<br>
<b>การจัดทำมาตรฐานพื้นที่จะต้องไม่ขัดแย้งกับมาตรฐานกลาง</b></div>
<table class="compare">
  <thead><tr><th>ช่วงเวลา</th><th>มาตรฐาน</th><th>ตัวอย่าง</th></tr></thead>
  <tbody>
    <tr><td><b>ก่อน</b>ทำงาน</td><td>มาตรฐานบำรุงรักษาเบื้องต้น</td><td>ตรวจสอบความพร้อมของอุปกรณ์/เครื่องจักร เช่น Checklist</td></tr>
    <tr><td><b>ระหว่าง</b>ทำงาน</td><td>มาตรฐานใช้งาน</td><td>คำอธิบายหรือวิธีการใช้งานเครื่องมือ/อุปกรณ์ เช่น คู่มือการใช้งาน</td></tr>
    <tr><td><b>หลัง</b>ทำงาน</td><td>มาตรฐานจัดเก็บ</td><td>แสดงสภาพเดิมก่อนการทำงาน เพื่อจัดเก็บให้คืนสภาพเดิม เช่น โต๊ะทำงาน</td></tr>
  </tbody>
</table>

<h3>ตัวอย่างมาตรฐานส่วนกลางของ Sansuisha</h3>
<figure><img class="page-img" src="${IMG["5s-std-walkway"]}" alt="มาตรฐานทางเดิน Walk Way พร้อมภาพที่ถูกต้องและไม่ถูกต้อง"><figcaption><b>ทางเดิน (Walk Way):</b> พื้นทาสีเขียว ขอบสีเหลือง สะอาด ไม่มีสิ่งของกีดขวาง เส้นไม่ลอก/ชำรุด เส้นสีเขียวกว้าง 800–1300 มม. เส้นสีเหลืองกว้าง 100 มม. และบริเวณทางร่วม ทางแยก มีสัญลักษณ์ “นิ้วชี้”</figcaption></figure>
<figure><img class="page-img" src="${IMG["5s-std-workarea"]}" alt="มาตรฐานการกำหนดขอบเขตการทำงานและวางชิ้นงาน"><figcaption><b>ขอบเขตการทำงานและวางชิ้นงาน:</b> กำหนดพื้นที่ด้วยเส้นสีขาว วางชิ้นงานหรือรถใส่ชิ้นงานให้อยู่ในขอบเขต พื้นที่สะอาด เป็นระเบียบ และสีเส้นต้องไม่มีสีทับกัน 2 สี</figcaption></figure>
<figure><img class="page-img" src="${IMG["5s-std-desk"]}" alt="มาตรฐานโต๊ะทำงานส่วนสำนักงานชั้น 2"><figcaption><b>โต๊ะทำงาน:</b> ติดป้ายชี้บ่งลิ้นชัก ลิ้นชักที่ 1 อุปกรณ์เครื่องเขียน ที่ 2 เอกสารการทำงาน/อุปกรณ์ ที่ 3 ของใช้ส่วนตัว และใต้โต๊ะไม่มีสิ่งของวางกีดขวาง</figcaption></figure>

<h3>ตัวอย่างมาตรฐานพื้นที่ของแต่ละแผนก</h3>
<figure><img class="page-img" src="${IMG["5s-std-facility"]}" alt="มาตรฐานแผนก Facility STC พื้นที่ Pre-Treatment"><figcaption><b>Facility:</b> พื้นที่ Pre-Treatment</figcaption></figure>
<figure><img class="page-img" src="${IMG["5s-std-delivery"]}" alt="มาตรฐานแผนก Delivery จุดจัดงาน BOX"><figcaption><b>Delivery:</b> จุดจัดงาน (BOX) แยกงานตามป้าย ทำ FIFO กำหนด MIN/MAX และทำบอร์ดแสดงยอดงานคงเหลือ</figcaption></figure>
<figure><img class="page-img" src="${IMG["5s-std-repair"]}" alt="มาตรฐานแผนก Repair ตู้เก็บอุปกรณ์ซ่อมสีและสีสเปรย์"><figcaption><b>Repair:</b> ตู้เก็บอุปกรณ์ซ่อมสีและสีสเปรย์</figcaption></figure>

<h3>ประโยชน์จากการ “สร้างมาตรฐาน”</h3>
<ol>
  <li>รักษาและปรับปรุงสภาพการทำ 3ส ให้เกิดความต่อเนื่อง</li>
  <li>มีแนวทางการปฏิบัติไปในทิศทางเดียวกัน</li>
  <li>สามารถปฏิบัติหน้าที่ทดแทนกันได้</li>
  <li>พัฒนาความสามารถของพนักงานให้มี Multi skill</li>
  <li>การปฏิบัติงานมีประสิทธิผลและมีประสิทธิภาพ</li>
</ol>
<figure><img src="${IMG["5s-seiketsu-team"]}" alt="ภาพการ์ตูนเพื่อนร่วมงานยืนกอดคอกัน"></figure>`,
      },
      {
        title: "ส5 สร้างวินัย (Shitsuke)",
        minutes: 3,

<ol><li>ความเป็นอันตรายของสารเคมี</li><li><b>ความเข้ากันได้</b>ของสารเคมี (สารบางชนิดห้ามเก็บด้วยกัน)</li><li>สถานะของสารเคมี</li></ol>
<div class="grid2">
  <div class="card"><h4>เก็บแยกบริเวณ (Separate)</h4><p>แยกด้วยผนังทนไฟได้อย่างน้อย 90 นาที หรือเว้นระยะห่างที่เหมาะสม เช่น 5–10 เมตร</p></div>
  <div class="card"><h4>เก็บแยกห่าง (Segregate)</h4><p>เก็บ 2 ประเภทขึ้นไปในบริเวณเดียวกันได้ ถ้ามีมาตรการป้องกันเพียงพอ ตามตารางการจัดเก็บ</p></div>
</div>

<h3>ข้อปฏิบัติในสถานที่เก็บสารเคมี</h3>
<ul>
  <li>เป็นสถานที่มิดชิด ผนังทนไฟ ปิดล็อกได้ มีป้าย <b>“สถานที่เก็บสารเคมี”</b> เฉพาะผู้เกี่ยวข้อง</li>
  <li>อากาศเย็นและแห้ง ระบายอากาศดี แดดส่องไม่ถึง</li>
  <li>ชั้นวางมั่นคง แข็งแรง ไม่สั่นสะเทือน ภาชนะใหญ่และหนัก<b>ไม่วางในที่สูง</b></li>
  <li>ภาชนะต้องมี<b>ป้ายชื่อที่ทนทาน</b>พร้อมบอกอันตรายและข้อควรระวัง</li>
  <li>ขวดไม่วางบนพื้นโดยตรง หรือซ้อนบนขวดอื่น</li>
  <li><b>มาก่อน ใช้ก่อน (FIFO)</b> หมดอายุต้องทำลายทันที</li>
  <li>มีที่กั้นป้องกันไม่ให้สารเคมีต่างชนิดไหลรวมกัน</li>
  <li>กองสินค้านอกอาคารสูงไม่เกิน 3 เมตร</li>
  <li>มีอุปกรณ์ดับเพลิง อุปกรณ์ป้องกันภัย และเครื่องปฐมพยาบาลพร้อม</li>
</ul>
<div class="callout warn"><b>ห้ามสูบบุหรี่ รับประทานอาหาร/เครื่องดื่ม หรือเก็บอาหาร</b> ในบริเวณที่ทำงานหรือเก็บสารเคมีอันตราย</div>
<p class="tag">สารประเภท 1, 2B, 4.1A, 4.2, 4.3, 5.1, 5.2 และ 6.1 ไม่อนุญาตให้เก็บนอกอาคาร · สารออกซิไดซ์ ห้ามใช้แผ่นรองไม้ ห้ามเก็บวัสดุติดไฟใกล้</p>`,

        title: "อุปกรณ์ป้องกันอันตรายส่วนบุคคล (PPE)",
        minutes: 6,
        body: `
<p class="lead">หลักการควบคุมอันตราย: <b>แหล่งต้นเหตุ (Source) → ทางผ่าน (Pathway) → ผู้ปฏิบัติงาน (Receiver)</b> — PPE คือด่านสุดท้ายที่ตัวผู้ปฏิบัติงาน</p>
<div class="grid3">
  <div class="card"><h4>ที่แหล่งต้นเหตุ</h4><p>เปลี่ยนสาร/วัสดุ ปรับปรุง Process แยก/ป้องกัน ระบายอากาศเฉพาะจุด บำรุงรักษาดี</p></div>
  <div class="card"><h4>ที่ทางผ่าน</h4><p>รักษาความสะอาด ระบายอากาศทั่วไป เพิ่มระยะห่าง ตรวจวัดสารเคมีในอากาศ</p></div>
  <div class="card"><h4>ที่ผู้ปฏิบัติงาน</h4><p>อบรม หมุนเวียนงาน ตรวจสุขภาพตามปัจจัยเสี่ยง และ<b>สวม PPE</b></p></div>
</div>

<h3>ประเภทของ PPE</h3>
<div class="grid2">
  <div class="card">😷 <b>ระบบหายใจ</b> — หน้ากากกรองอากาศ (ฝุ่น ละออง ฟูม แก๊ส ไอระเหย) หรือชุดส่งผ่านอากาศ (SCBA)</div>
  <div class="card">🥽 <b>ดวงตา/ใบหน้า</b> — แว่นนิรภัย ครอบตา (Goggles) กระบังหน้า (Face shield)</div>
  <div class="card">🧤 <b>มือ</b> — ถุงมือให้เหมาะกับสารเคมี ตรวจรอยชำรุดก่อนและหลังใช้</div>
  <div class="card">🥼 <b>ร่างกาย</b> — ชุดป้องกันสารเคมี Level A–D, ผ้ากันเปื้อน</div>
  <div class="card">🥾 <b>เท้า</b> — รองเท้านิรภัย รองเท้าบูททนสารเคมี</div>
</div>

<h3>การใช้และดูแล PPE</h3>
<ul class="check">
  <li>ตรวจสภาพก่อนใช้งานทุกครั้ง ไม่ใช้อุปกรณ์ที่เสียหาย</li>
  <li>ใช้ให้ถูกวิธีและถูกงาน เปลี่ยนเมื่อหมดอายุ</li>
  <li>ทำความสะอาดเสมอ เก็บในที่ร่ม อากาศถ่ายเท เป็นระเบียบ</li>
  <li>มีมาตรฐานรับรอง เช่น มอก. CE ANSI NIOSH</li>
  <li><b>หัวหน้างานต้องเป็นตัวอย่างที่ดีในการใช้ PPE</b></li>
</ul>`,

<h3>สารเคมีเข้าสู่ร่างกาย 3 ทาง</h3>
<div class="grid3">
  <div class="card">🫁 <b>หายใจ</b> (Inhalation)</div>
  <div class="card">✋ <b>ดูดซึมผ่านผิวหนัง</b> (Skin Contact)</div>
  <div class="card">🍽️ <b>กินหรือดื่ม</b> (Ingestion)</div>
</div>
<div class="grid2">
  <div class="card"><h4>แบบเฉียบพลัน (Acute)</h4><p>เกิดทันทีหรือเร็ว: ผื่นคัน ระคายเคือง ผิวหนังไหม้ ขาดอากาศ หน้ามืดวิงเวียน</p></div>
  <div class="card"><h4>แบบเรื้อรัง (Chronic)</h4><p>สัมผัสระดับต่ำเป็นเวลานาน: มะเร็ง ผลต่อทารกในครรภ์ อัมพาต จนถึงเสียชีวิต</p></div>
</div>

<h3>การปฐมพยาบาล</h3>
<table class="compare">
  <tbody>
    <tr><td><b>สูดดม/หายใจเอาไอพิษ</b></td><td>รีบนำผู้ป่วยออกไปที่โล่ง อากาศถ่ายเท คลายเสื้อผ้า หากหมดสติหรือหยุดหายใจให้ทำ CPR แล้วนำส่งแพทย์ <b>พร้อมฉลากหรือเอกสารสารเคมี</b> ผู้ช่วยเหลือต้องสวมหน้ากากป้องกันก่อนเข้าพื้นที่</td></tr>
    <tr><td><b>หกรดผิวหนัง</b></td><td>ล้างด้วยน้ำสะอาดจำนวนมาก หรือฝักบัวฉุกเฉิน <b>ประมาณ 15 นาที</b> ถอดเสื้อผ้าที่เปื้อนออก <b>อย่าใช้ยาแก้พิษทางเคมี</b> เพราะความร้อนจากปฏิกิริยาอาจทำให้อันตรายขึ้น</td></tr>
    <tr><td><b>เข้าตา</b></td><td>ล้างตาด้วยน้ำนาน <b>15 นาที</b> เปิดน้ำไหลรินค่อยๆ อย่าใช้ยาแก้พิษ ปิดตาแล้วนำส่งโรงพยาบาล</td></tr>
    <tr><td><b>กลืนกิน</b></td><td>ห้ามให้อาเจียนหรือดื่มสิ่งใดถ้าผู้ป่วยหมดสติ (หยุดหายใจต้อง CPR ก่อน) ทำให้สารเจือจางด้วยน้ำหรือนมในกรณีรู้สึกตัว</td></tr>
  </tbody>
</table>
<div class="callout warn"><b>ห้ามทำให้ผู้ป่วยอาเจียน</b> เมื่อ: หมดสติ · ได้รับสารกัดเนื้อ เช่น กรด ด่าง · ได้รับสารพวกน้ำมันปิโตรเลียม เช่น น้ำมันก๊าด เบนซิน · มีสุขภาพไม่ดี เช่น โรคหัวใจ</div>
<p class="tag">บริเวณทำงานกับสารเคมีต้องมีที่ล้างตาและฝักบัวชำระร่างกายฉุกเฉิน ที่ล้างมือ/หน้าอย่างน้อย 1 ห้องต่อลูกจ้าง 15 คน และเครื่องปฐมพยาบาล</p>`,

<h3>หลักสำคัญในการควบคุมสารเคมีรั่วไหล</h3>
<ol class="steps">
  <li><span class="step-no">1</span><b>หยุดการรั่วไหล</b> (Stop Leak)</li>
  <li><span class="step-no">2</span><b>จำกัดพื้นที่</b> (Confine)</li>
  <li><span class="step-no">3</span><b>ดูดซับสารด้วยวัสดุดูดซับ</b> (Absorb)</li>
  <li><span class="step-no">4</span><b>เก็บกวาดและนำไปกำจัด</b> (Clean up &amp; Disposal)</li>
</ol>
<div class="grid2">
  <div class="card"><h4>กรณีไม่รุนแรง (Minor)</h4><ul><li>แจ้งผู้อยู่ในบริเวณให้ทราบ</li><li>หลีกเลี่ยงการสูดดมไอ/แก๊ส</li><li>สวม PPE ที่เหมาะสม</li><li>จำกัดพื้นที่รั่วไหลให้แคบ</li><li>ใช้วัสดุทำลายฤทธิ์กรด-เบส และวัสดุดูดซับ (Spill Kit)</li><li>เก็บวัสดุที่ใช้แล้วใส่ภาชนะของเสีย และทำความสะอาดพื้นที่</li></ul></div>
  <div class="card"><h4>กรณีรุนแรง (Major)</h4><ul><li>ช่วยเหลือ/ปฐมพยาบาลผู้บาดเจ็บ และเคลื่อนย้ายออกนอกพื้นที่</li><li>แจ้งเตือนภัยให้ผู้อยู่ในพื้นที่<b>อพยพ</b></li><li>สารไวไฟ: ปิด/ทำลายแหล่งความร้อน/ประกายไฟ</li><li>โทรแจ้ง <b>สายด่วน 1669 และ 191</b></li></ul></div>
</div>
<p>ขยะปนเปื้อนสารเคมีต้องแยกเป็น<b>ขยะพิษ</b> พร้อมติดป้ายแจ้งที่ถุงขยะทุกถุง</p>

<h3>การแบ่งพื้นที่ควบคุม (Zoning)</h3>
<div class="grid3">
  <div class="card"><h4>🔴 Hot Zone</h4><p>พื้นที่อันตราย เฉพาะทีม Hazmat/ผู้ระงับเหตุ</p></div>
  <div class="card"><h4>🟡 Warm Zone</h4><p>พื้นที่ชำระล้าง (Decontamination) จำกัดการเข้าถึง</p></div>
  <div class="card"><h4>🟢 Cold Zone</h4><p>พื้นที่ปลอดภัย ผู้ช่วยเหลือ แพทย์ พยาบาล</p></div>
</div>
<p class="tag">ตั้งพื้นที่โดยคำนึงถึง<b>ทิศทางลม</b> — อยู่เหนือลมเสมอ</p>

<h3>องค์ประกอบแผนฉุกเฉิน</h3>
<p>ลักษณะเหตุฉุกเฉิน · สัญญาณเตือนภัย · การประกาศภาวะฉุกเฉิน · ผังองค์กรในภาวะฉุกเฉิน · หน้าที่รับผิดชอบ · การสื่อสาร · การยกเลิกภาวะฉุกเฉิน · การสอบสวนหลังเกิดเหตุ · <b>การซ้อมตามแผน (สำคัญที่สุด)</b></p>
<div class="callout"><b>อบรมและซ้อมแผนฉุกเฉินสารเคมีรั่วไหลอย่างน้อยปีละ 1 ครั้ง</b> · ตรวจวัดความเข้มข้นสารเคมีอันตรายอย่างน้อยปีละ 1 ครั้ง · แอปช่วยเหลือ: <b>ERG4Thai</b> และ <b>ERG 2020</b> ค้นหาวิธีรับมือด้วยเลข UN</div>`,

<div class="callout"><b>สี</b> คือ ของผสมที่อยู่ในสภาพเป็นเนื้อเดียวกัน เมื่อนำไปเคลือบบนวัสดุต่าง ๆ จะทำให้เกิดเป็นแผ่นฟิล์มยึดเกาะติดผิวของวัสดุนั้น</div>
<h3>วัตถุประสงค์หลักของการทำสี</h3>
<ol>
  <li><b>ให้ความสวยงาม</b> (Decorative paint)</li>
  <li><b>การป้องกัน</b> (Protective paint) — เคลือบสีเพื่อป้องกันการกัดกร่อนของสนิม และยืดอายุชิ้นงาน</li>

  <div class="card"><h4>สารยึด (Resin)</h4><p>ทำหน้าที่ยึดและประสานอนุภาคของสารประกอบในสีเข้าไว้ด้วยกัน ให้สีติดเป็นฟิล์ม และทำให้ฟิล์มสียึดแน่นกับพื้นผิวที่ถูกเคลือบ</p></div>
  <div class="card"><h4>ตัวทำละลาย (Solvent)</h4><p>ของเหลวที่ใช้ละลายสารยึด หรือเรียกว่า Thinner ช่วยปรับความหนืดของสีให้เหมาะกับการผลิต การใช้งาน และการแห้งตัว</p></div>
  <div class="card"><h4>สารปรับคุณสมบัติ (Additive)</h4><p>เติมในปริมาณเล็กน้อย โดยทั่วไปไม่เกิน 2% เพื่อปรับคุณสมบัติของสี เช่น การไหล ป้องกันสีเป็นหลุม</p></div>

<p>การแห้งตัวของสีโดยทั่วไปมี 2 แบบ คือ <b>Physical Drying</b> และ <b>Chemical Curing</b> ซึ่งแบ่งย่อยได้เป็น 3 วิธี</p>
<table class="compare">
  <thead><tr><th>วิธี</th><th>เกิดอย่างไร</th><th>จุดสังเกต</th></tr></thead>
  <tbody>
    <tr><td><b>1. การระเหยของตัวทำละลาย</b><br>(Physical Drying)</td><td>ตัวทำละลายในสีระเหยออก ไม่เกิดโพลีเมอไรเซชันระหว่างโมเลกุลเรซิน</td><td>เช็ดด้วยทินเนอร์แล้วละลายออก เช่น สีอะคริลิกแลคเกอร์</td></tr>
    <tr><td><b>2. โพลีเมอไรเซชันด้วยความร้อน</b><br>(Chemical Curing)</td><td>ให้ความร้อน โดยทั่วไปประมาณ <b>120°C</b> โมเลกุลเรซินเกิดโครงสร้างตาข่ายละเอียด ทำให้ฟิล์มมีคุณสมบัติดี</td><td>แห้งสมบูรณ์แล้วทินเนอร์ละลายไม่ได้ โดยทั่วไปใช้กับการพ่นรถใหม่</td></tr>

<h3>การเตรียมสี</h3>
<ol>

  <div class="card"><h4>ความกว้างละอองสี</h4><p>ควรกว้าง <b>25–30 ซม.</b> ที่ระยะห่าง 25–30 ซม.<br>• แคบเกินไป: พ่นยาก สีด่าง แต่เหมาะกับมุมแคบหรือชิ้นงานเล็ก<br>• กว้างเกินไป: เกิดละอองสีฟุ้ง (Over spray)</p></div>

        title: "ปัญหาฟิล์มสี ตอนที่ 1: ผิวส้ม สีไหล หลุม เดือด",
        minutes: 6,
        body: `
<h3>1. ผิวส้ม (Orange Peel)</h3>
<p>ฟิล์มสีที่พ่นแล้วไม่เรียบ คล้ายผิวส้ม</p>
<ul><li><b>สาเหตุ:</b> อุณหภูมิสูง กระแสลมแรง · รูพ่นใหญ่เกินไป ปืนสกปรก · พ่นบาง แรงลมต่ำ เดินปืนเร็ว ระยะห่างมาก · ทินเนอร์ระเหยเร็ว ความหนืดสูง</li>
<li><b>ป้องกัน:</b> ปรับความหนืดตามมาตรฐาน เพิ่มความหนาสี เปลี่ยนทินเนอร์ให้แห้งช้า</li>
<li><b>แก้ไข:</b> ขัดน้ำด้วยกระดาษทรายเบอร์ 600, 800, 1000 แล้วขัดด้วยยาขัดหยาบ→ปานกลาง→ละเอียด→ละเอียดมาก</li></ul>
<h3>2. สีไหล (Sagging, Running)</h3>
<p>สารเคลือบผิวไหลลงมาระหว่างทำการเคลือบ แล้วแข็งตัว</p>
<ul><li><b>สาเหตุ:</b> อุณหภูมิต่ำ กระแสลมอ่อน · รูพ่นใหญ่เกินไป ปืนสกปรก · พ่นหนา แรงลมต่ำ ปริมาณสีออกน้อย เดินปืนช้า ระยะใกล้ · ทินเนอร์ระเหยช้า ความหนืดต่ำ</li>
<li><b>ป้องกัน:</b> ปรับความหนืดตามมาตรฐาน ควบคุมความหนาสี เปลี่ยนทินเนอร์ให้แห้งเร็วขึ้น</li>
<li><b>แก้ไข:</b> ไหลทั้งพื้นที่ ให้ขัดออกหมดแล้วพ่นใหม่ · ไหลเล็กน้อย ขัดด้วยกระดาษทราย 600-800-1000 แล้วขัดด้วยยาขัด</li></ul>
<h3>3. สีเป็นหลุม (Crater, Fish eye)</h3>
<p>สิ่งแปลกปลอมที่ไม่ละลายเป็นเนื้อเดียวกับสี ไปเกาะบนผิวก่อนสีแห้ง</p>
<ul><li><b>สาเหตุ:</b> อยู่ใกล้ลานขัดยา หรือโรงงานที่ใช้ซิลิโคน · ภาชนะหรืออุปกรณ์สกปรก น้ำมันหรือน้ำปนในท่อลม · ล้างคราบไขมันไม่หมด ละอองสีชนิดอื่นปลิวมาเกาะ · สารเติมแต่งไม่เหมาะสม กาวเทปหลุดไปเกาะ</li>
<li><b>ป้องกัน:</b> เช็ดและทำความสะอาดอุปกรณ์ที่เกี่ยวข้องทั้งหมด</li>
<li><b>แก้ไข:</b> หลังสีแห้งให้ขัดออกหมดแล้วพ่นใหม่ ถ้าเป็นหลุมเล็กน้อย แก้โดยการพ่นโปรย ๆ</li></ul>
<h3>4. สีเดือด (Popping)</h3>
<p>มีรูเหมือนถูกเข็มแทงเกิดขึ้นที่ผิวพ่น</p>
<ul><li><b>สาเหตุ:</b> อุณหภูมิสูง กระแสลมแรง · ทินเนอร์ผิดหรือระเหยเร็วเกินไป · พ่นหนา ชิ้นงานร้อน แรงดันลมต่ำ สีออกมากไป · ระยะพักตัวก่อนอบสั้น ห้อง Setting ร้อน</li>
<li><b>ป้องกัน:</b> หลีกเลี่ยงการเกิดฟองและพ่นหนา ใช้ทินเนอร์แห้งช้า ค่อย ๆ เพิ่มอุณหภูมิขึ้นทีละน้อย</li>
<li><b>แก้ไข:</b> หลังสีแห้งให้ขัดบริเวณที่เกิดปัญหาออกแล้วพ่นสีใหม่</li></ul>`,

<h3>5. รอยพอง (Blistering)</h3>
<ul><li><b>สาเหตุ:</b> น้ำขังบนผิว · ขจัดไขมันไม่หมด (เศษผงขัด รอยนิ้วมือ เหงื่อ น้ำยาลอกสี) · น้ำล้างสกปรก · ฟิล์มสีแห้งไม่สนิท · ยึดเกาะระหว่างชั้นไม่ดี · สีชั้นล่างกันน้ำไม่ดี</li>
<li><b>ป้องกัน:</b> ระวังฝุ่นละอองติดระหว่างชั้นสี ทำแต่ละชั้นให้แห้งสนิทก่อนพ่นชั้นต่อไป</li>
<li><b>แก้ไข:</b> ใช้เข็มเจาะขนาดของรูเท่ารอยพอง ขัดออกแล้วจึงเคลือบสีใหม่</li></ul>
<h3>6. สีบาง (Thin)</h3>
<ul><li><b>สาเหตุ:</b> ความหนืดต่ำกว่ามาตรฐาน · พ่นบางเกินมาตรฐาน · ค่าการกลบมิดของสีสูง · ความสว่างในห้องพ่น</li>
<li><b>ป้องกัน:</b> ปรับความหนืดตามมาตรฐาน ควบคุมความหนาสี เพิ่มจำนวนรอบในการพ่น</li>
<li><b>แก้ไข:</b> ถูด้วยกระดาษทรายเบอร์ละเอียดแล้วพ่นใหม่</li></ul>
<h3>7. สีด่าง (Mottling)</h3>
<ul><li><b>สาเหตุ:</b> ความหนืดต่ำเกินไป · Solvent แห้งช้าเกินไป · Flow Rate มากเกินไป · ระยะปืนใกล้เกินไป</li>
<li><b>แก้ไข:</b> ปรับ Condition ตามข้อกำหนด เลือก Solvent ที่เหมาะสม ปรับ Flow Rate และเพิ่มระยะห่างปืน</li></ul>
<h3>8. สีแตกต่าง (Color Difference)</h3>

    <tr><td><b>การพ่น</b></td><td>ควบคุมความหนาไม่ได้ · เครื่องมือต่างกัน · เปลี่ยน Condition</td><td>ควบคุมความหนา · ปรับเครื่องมือ · กำหนด Condition ให้แน่นอน และเทียบเฉดมาตรฐานทุกครั้งที่เปลี่ยน</td></tr>
    <tr><td><b>อื่น ๆ</b></td><td>เครื่องวัดต่างกัน · อุณหภูมิอบไม่ถูกต้อง · ระยะพักสั้น · ปืนช้าเกินไป · อากาศในห้องพ่นถ่ายเทไม่ดี</td><td>ปรับเครื่องมือเข้าหากัน · คุมอุณหภูมิตาม Spec · ปรับ Conveyor Speed · ปรับสภาพห้องพ่น</td></tr>
  </tbody>
</table>
<h3>9. สีเป็นเม็ด (Dust)</h3>

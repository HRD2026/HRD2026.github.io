<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>รายงานความคืบหน้า (HR)</title>
<script>window.KP_API_URL = "https://script.google.com/macros/s/AKfycbzPjdPRRxNKaTWaR8CP2qFyGToMMiTFM_XJctdxfYMqpFY_04P7L89nMIS3qX5ku8CgWQ/exec";</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=Orbitron:wght@600&display=swap" rel="stylesheet">
<style>
:root {
  --navy: #0f2a4a;
  --navy-2: #1a3d68;
  --blue: #2f6fed;
  --blue-soft: #e4edfd;
  --blue-softer: #f1f6fe;
  --bg: #f5f8fc;
  --surface: #ffffff;
  --ink: #14233a;
  --ink-2: #55657a;
  --ink-3: #8a97a8;
  --line: var(--track);
  --brand: #2563a8;
  --brand-ink: #0f2a4a;
  --brand-soft: #e9f1fa;
  --good: #14734f;
  --good-soft: #e5f4ed;
  --warn: #9a5a07;
  --warn-soft: #fcf2e1;
  --danger: #b42318;
  --danger-soft: #fdecea;
  --radius: 10px;
  --radius-s: 8px;
  --shadow: 0 1px 3px rgba(40, 70, 120, .06);
  --shadow-lift: 0 2px 4px rgba(15, 42, 74, .06), 0 14px 32px rgba(15, 42, 74, .1);
  --nav-w: 76px;
  --fill: #2f6fed;
  --banner: #2a8577;
  --track: #e6ecf5;
  --top-bg: rgba(245, 248, 252, .92);
}
[data-theme="dark"] {
  --navy: #e8edf6;
  --navy-2: #cdd6e4;
  --blue: #6ea0f7;
  --blue-soft: #2a3650;
  --blue-softer: #252e40;
  --bg: #171c26;
  --surface: #212734;
  --ink: #e2e7f0;
  --ink-2: #a6b1c2;
  --ink-3: #7c889b;
  --line: #333b4b;
  --brand: #4f7fd8;
  --brand-ink: #e8edf6;
  --brand-soft: #2a3650;
  --good: #5fd0a0;
  --good-soft: #1d3a31;
  --warn: #f0b566;
  --warn-soft: #3b2f1e;
  --danger: #f28b82;
  --danger-soft: #3f2526;
  --banner: #22695e;
  --track: #333b4b;
  --top-bg: rgba(23, 28, 38, .92);
  --shadow: 0 1px 2px rgba(0, 0, 0, .3);
  --shadow-lift: 0 8px 28px rgba(0, 0, 0, .45);
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  font-family: "IBM Plex Sans Thai", "Leelawadee UI", "Tahoma", sans-serif;
  font-size: 15.5px; line-height: 1.6;
  color: var(--ink); background: var(--bg);
  -webkit-font-smoothing: antialiased;
}
img { max-width: 100%; height: auto; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--blue); }
h1, h2, h3, h4 { color: var(--navy); line-height: 1.3; font-weight: 600; }
.ico { flex: none; display: block; }
:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
.spacer { flex: 1; }

/* ---------- Buttons, inputs, badges ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 42px;
  border: 1px solid var(--fill); border-radius: var(--radius-s); padding: 8px 18px; font-weight: 500;
  background: var(--fill); color: #fff; text-decoration: none; white-space: nowrap;
  transition: background .15s ease, border-color .15s ease, box-shadow .15s ease;
}
.btn:hover { filter: brightness(.93); }
.btn.block { width: 100%; min-height: 48px; }
.btn.ghost { background: var(--surface); color: var(--navy); border-color: var(--line); }
.btn.ghost:hover { background: var(--blue-soft); border-color: var(--blue-soft); }
.btn.light { background: #fff; color: var(--navy); border-color: #fff; }
.btn.light:hover { background: var(--blue-soft); border-color: var(--blue-soft); }
.btn.danger { background: var(--surface); color: var(--danger); border-color: #f0c9c5; }
.btn.danger:hover { background: var(--danger-soft); }
.btn.small { min-height: 34px; padding: 4px 12px; font-size: 14px; }
.btn.icon-only { padding: 0; width: 38px; min-height: 38px; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.field { margin-bottom: 14px; }
.field label { display: block; font-weight: 500; font-size: 14px; margin-bottom: 5px; color: var(--navy); }
.field small { display: block; color: var(--ink-2); font-size: 13px; margin-top: 4px; }
.field input, .field select, .field textarea, .control {
  width: 100%; padding: 9px 12px; min-height: 42px; border: 1px solid var(--line); border-radius: var(--radius-s);
  background: var(--surface); outline: none; transition: border-color .15s ease, box-shadow .15s ease;
}
.field input:focus, .field select:focus, .field textarea:focus, .control:focus { border-color: var(--blue); box-shadow: 0 0 0 3px var(--blue-soft); }
.error { color: var(--danger); font-size: 14px; min-height: 22px; margin: 4px 0; }
.badge { display: inline-flex; align-items: center; gap: 4px; font-size: 13px; font-weight: 500; padding: 2px 10px; border-radius: 99px; background: var(--good-soft); color: var(--good); white-space: nowrap; }
.badge .ico { width: 14px; height: 14px; }
.badge.todo { background: var(--track); color: var(--ink-2); }
.badge.doing { background: var(--blue-soft); color: var(--blue); }
.badge.due { background: var(--warn-soft); color: var(--warn); }
.bar { height: 6px; background: var(--track); border-radius: 99px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--blue); border-radius: 99px; transition: width .5s ease; }
.foot-row { display: flex; justify-content: space-between; gap: 10px; font-size: 13px; color: var(--ink-2); margin-top: 6px; }

/* ---------- Login ---------- */
.login-wrap { min-height: 100vh; display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); background: var(--surface); }
.login-side { background: var(--fill); color: #fff; padding: 56px; display: flex; flex-direction: column; justify-content: flex-end; }
.login-side h2 { color: #fff; font-size: 34px; margin: 0 0 12px; max-width: 460px; }
.login-side p { color: #c3d3e6; max-width: 460px; margin: 0; }
.login-side ul { list-style: none; padding: 0; margin: 28px 0 0; display: grid; gap: 12px; color: #dce7f3; }
.login-side li { display: flex; gap: 10px; align-items: center; }
.login-main { display: grid; place-items: center; padding: 32px 20px; }
.login-card { width: 100%; max-width: 380px; }
.login-card h1 { font-size: 24px; margin: 0 0 4px; }
.login-card p.sub { color: var(--ink-2); margin: 0 0 24px; }
.login-brand { padding-bottom: 28px; }
.login-foot { color: var(--ink-2); font-size: 14px; margin-top: 18px; }
.loading { min-height: 100vh; display: grid; place-items: center; color: var(--ink-2); }

/* ---------- Company logo + department ---------- */
.brand-logo { display: inline-flex; flex-direction: column; align-items: center; gap: 6px; text-decoration: none; }
.brand-logo img { display: block; width: 210px; height: auto; }
.brand-logo .dept {
  display: flex; align-items: center; gap: 10px;
  font-family: "Orbitron", "Segoe UI", sans-serif; font-weight: 600; font-size: 11.5px;
  letter-spacing: .38em; margin-right: -.38em; /* letter-spacing adds trailing space; pull it back to stay centered */
  color: var(--navy); text-transform: uppercase; white-space: nowrap;
}
.brand-logo .dept::before, .brand-logo .dept::after { content: ""; width: 16px; height: 1.5px; background: linear-gradient(90deg, transparent, var(--blue)); }
.brand-logo .dept::after { background: linear-gradient(90deg, var(--blue), transparent); margin-right: .38em; }
.brand-logo.small { gap: 3px; }
.brand-logo.small img { width: 132px; }
.brand-logo.small .dept { font-size: 7.5px; gap: 6px; letter-spacing: .34em; margin-right: -.34em; }
.brand-logo.small .dept::before, .brand-logo.small .dept::after { width: 8px; height: 1px; }

/* ---------- App shell ---------- */
.shell { min-height: 100vh; }
.nav {
  position: fixed; inset: 0 auto 0 0; width: var(--nav-w); background: var(--surface); box-shadow: 1px 0 0 var(--line);
  display: flex; flex-direction: column; padding: 16px 12px; z-index: 20; transition: width .2s ease; overflow: visible;
}
.nav nav { display: grid; gap: 2px; }
.nav-brand { display: none; }
.nav-item {
  position: relative; display: flex; align-items: center; justify-content: center; gap: 12px; padding: 11px 0; min-height: 46px; border-radius: 8px; border: 0; background: transparent; width: 100%;
  color: var(--ink-2); text-decoration: none; font-weight: 500; text-align: left; transition: background .15s ease, color .15s ease;
}
.nav-item > span, .nav-item > .chev { display: none; white-space: nowrap; }
.nav-item:hover { background: var(--blue-softer); color: var(--blue); }
.nav-item.active { color: var(--blue); background: var(--blue-softer); }
.nav-sub { display: none; padding: 0 0 4px 44px; }
.nav-sub a { position: relative; display: block; padding: 7px 8px; font-size: 14px; color: var(--ink-2); text-decoration: none; border-radius: 6px; }
.nav-sub a::before { content: ""; position: absolute; left: -14px; top: 50%; width: 6px; height: 6px; margin-top: -3px; border-radius: 50%; border: 1.5px solid var(--ink-3); }
.nav-sub a:hover, .nav-sub a.active { color: var(--blue); }
.nav-sub a.active::before { border-color: var(--blue); }
.nav-group { height: 1px; margin: 10px 8px; background: var(--line); }
.nav-group span { display: none; }
.nav-foot { margin-top: auto; }
.nav-card { display: none; }
.nav-help { background: var(--blue-softer); }
/* ป้ายชื่อเมื่อเมนูย่ออยู่ */
.nav-item[data-tip]::after {
  content: attr(data-tip); position: absolute; left: calc(100% + 12px); top: 50%; transform: translate(-4px, -50%); padding: 5px 10px; border-radius: 8px;
  background: var(--fill); color: #fff; font-size: 13px; font-weight: 400; white-space: nowrap; opacity: 0; pointer-events: none; transition: opacity .12s ease, transform .12s ease; z-index: 30;
}
.nav-item[data-tip]:hover::after, .nav-item[data-tip]:focus-visible::after { opacity: 1; transform: translate(0, -50%); }
.rail-open { --nav-w: 244px; }
.rail-open .nav { overflow-y: auto; }
.rail-open .nav-brand { display: flex; }
.rail-open .nav-mark { display: none; }
.rail-open .nav-item { justify-content: flex-start; padding: 11px 12px; }
.rail-open .nav-item > span { display: inline; flex: 1; }
.rail-open .nav-item > .chev { display: block; transition: transform .15s ease; }
.rail-open .nav-tree.open > .nav-item > .chev { transform: rotate(90deg); }
.rail-open .nav-tree.open > .nav-sub { display: block; }
.rail-open .nav-item::after { display: none; }
.rail-open .nav-group { height: auto; background: none; margin: 0; padding: 14px 12px 4px; font-size: 12.5px; color: var(--ink-3); }
.rail-open .nav-group span { display: inline; }
.rail-open .nav-card { display: block; margin-bottom: 10px; color: inherit; text-decoration: none; }
.nav-card svg { display: block; width: 100%; height: auto; }
.workspace { margin-left: var(--nav-w); min-width: 0; transition: margin-left .2s ease; }
.top {
  position: sticky; top: 0; z-index: 10; height: 70px; display: flex; align-items: center; gap: 8px; padding: 0 24px;
  background: var(--top-bg); backdrop-filter: blur(8px);
}
.top-brand { display: none; }
.top-left { display: flex; align-items: center; flex: 1; min-width: 0; margin-left: 4px; }
.top-search { position: relative; width: min(280px, 100%); }
.top-search .ico { position: absolute; left: 12px; top: 11px; color: var(--ink-3); }
.top-search input { width: 100%; height: 42px; padding: 0 12px 0 40px; border: 0; border-radius: 8px; background: var(--surface); box-shadow: var(--shadow); outline: none; }
.top-search input:focus { box-shadow: 0 0 0 3px var(--blue-soft); }
.top .spacer { display: none; }
.sync { font-size: 13px; color: var(--ink-2); white-space: nowrap; }
.sync.error { color: var(--danger); font-weight: 500; }
.avatar { width: 38px; height: 38px; border-radius: 50%; background: var(--blue-soft); color: var(--navy); display: grid; place-items: center; }
.page { max-width: 1320px; margin: 0 auto; padding: 12px 28px 64px; animation: rise .28s ease both; }
@keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
.page-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap; margin-bottom: 22px; }
.page-head h1 { font-size: 26px; margin: 0; }
.page-head p { margin: 4px 0 0; color: var(--ink-2); }
.page-head-right { display: flex; gap: 8px; flex-wrap: wrap; }
.tabbar { display: none; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 20px 22px; }
.panel-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
.panel-head h2 { font-size: 17px; margin: 0; }
.panel-head a { font-size: 14px; text-decoration: none; white-space: nowrap; }
.muted { color: var(--ink-2); }
.empty { display: grid; justify-items: center; gap: 6px; text-align: center; color: var(--ink-2); padding: 28px 16px; }
.empty .ico { color: var(--ink-3); }
.empty b { color: var(--navy); font-weight: 500; }
.empty p { margin: 0; font-size: 14px; max-width: 380px; }
.notice { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; background: var(--warn-soft); color: #6d4005; border-radius: var(--radius-s); padding: 12px 16px; margin-bottom: 18px; }
.notice > span { flex: 1; min-width: 200px; }

/* ---------- Dashboard ---------- */
.ring { position: relative; width: 128px; flex: none; }
.ring svg { display: block; }
.ring circle { fill: none; stroke-width: 11; }
.ring-track { stroke: var(--track); }
.ring-on { stroke: var(--blue); stroke-linecap: round; }
.ring-text { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; line-height: 1.2; }
.ring-text b { font-size: 24px; font-weight: 600; color: var(--navy); font-variant-numeric: tabular-nums; }
.ring-text span { font-size: 12px; color: var(--ink-2); }
.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; margin-bottom: 18px; }
.stat-tile { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px 18px; display: flex; gap: 14px; align-items: flex-start; min-width: 0; }
.stat-ico { width: 40px; height: 40px; border-radius: 12px; background: var(--blue-soft); color: var(--navy); display: grid; place-items: center; flex: none; }
.stat-tile b { display: block; font-size: 24px; font-weight: 600; color: var(--navy); line-height: 1.2; font-variant-numeric: tabular-nums; }
.stat-tile span { display: block; font-size: 14px; color: var(--ink-2); }
.stat-tile small { display: block; font-size: 12.5px; color: var(--ink-3); }
.event { display: flex; gap: 14px; padding: 12px 0; border-top: 1px solid var(--line); }
.event:first-child { border-top: 0; padding-top: 0; }
.event:last-child { padding-bottom: 0; }
.date-chip { width: 54px; flex: none; border-radius: 12px; background: var(--blue-soft); color: var(--navy); text-align: center; padding: 6px 0; line-height: 1.15; align-self: flex-start; }
.date-chip b { display: block; font-size: 20px; font-weight: 600; }
.date-chip span { font-size: 12px; }
.event-body { min-width: 0; }
.event-body h3 { margin: 0 0 2px; font-size: 15.5px; font-weight: 500; }
.event-body h3 a { color: inherit; text-decoration: none; }
.event-body h3 a:hover { color: var(--blue); }
.event-meta { display: flex; flex-wrap: wrap; gap: 2px 14px; font-size: 13.5px; color: var(--ink-2); }
.event-meta span { display: inline-flex; gap: 5px; align-items: center; }
.event-meta .ico { width: 15px; height: 15px; }
.hbar { display: grid; grid-template-columns: minmax(0, 190px) minmax(40px, 1fr) 62px; gap: 12px; align-items: center; padding: 6px 0; font-size: 14px; }
.hbar-name { line-height: 1.3; overflow-wrap: anywhere; }
.hbar-track { height: 8px; background: var(--track); border-radius: 4px; }
.hbar-track i { display: block; height: 100%; min-width: 2px; background: var(--blue); border-radius: 0 4px 4px 0; transition: width .5s ease; }
.hbar-val { text-align: right; color: var(--ink-2); font-variant-numeric: tabular-nums; white-space: nowrap; }

/* ---------- Catalog ---------- */
.course-ico { width: 42px; height: 42px; flex: none; border-radius: 12px; background: var(--blue-soft); color: var(--navy); display: grid; place-items: center; }
.toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 14px; }
.toolbar .control { width: auto; min-width: 150px; }
.toolbar .search { flex: 1; min-width: 220px; position: relative; }
.toolbar .search .ico { position: absolute; left: 12px; top: 11px; color: var(--ink-3); }
.toolbar .search input { width: 100%; padding-left: 40px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 20px; }
.chip { border: 1px solid var(--line); background: var(--surface); color: var(--ink-2); border-radius: 99px; padding: 6px 14px; font-size: 14px; min-height: 36px; transition: all .15s ease; }
.chip:hover { border-color: var(--blue-soft); color: var(--navy); }
.chip.active { background: var(--fill); border-color: var(--fill); color: #fff; }
.chip em { font-style: normal; opacity: .65; margin-left: 4px; font-variant-numeric: tabular-nums; }
.course-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 16px; }
.course-card {
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px 20px;
  display: flex; flex-direction: column; gap: 10px; text-decoration: none; color: inherit;
  transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease;
}
.course-card:hover { transform: translateY(-3px); box-shadow: var(--shadow-lift); border-color: var(--blue-soft); }
.card-top { display: flex; align-items: center; gap: 12px; }
.card-cat { font-size: 13px; color: var(--ink-2); line-height: 1.35; }
.course-card h3 { margin: 0; font-size: 16.5px; font-weight: 600; }
.course-card p { margin: 0; color: var(--ink-2); font-size: 14px; }
.card-meta { display: flex; flex-wrap: wrap; gap: 2px 12px; font-size: 13px; color: var(--ink-2); margin-top: auto; }
.card-meta span { display: inline-flex; gap: 4px; align-items: center; }
.card-meta .ico { width: 14px; height: 14px; }
.card-foot { border-top: 1px solid var(--line); padding-top: 12px; }
.card-foot-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 8px; font-size: 13px; color: var(--ink-2); }

/* ---------- Training room ---------- */
.crumbs { font-size: 14px; color: var(--ink-2); margin-bottom: 10px; }
.crumbs a { text-decoration: none; }
.room-head { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 20px 24px; margin-bottom: 18px; }
.room-title { display: flex; gap: 14px; align-items: center; }
.room-title h1 { font-size: 22px; margin: 0; }
.room-title p { margin: 0; font-size: 14px; color: var(--ink-2); }
.stepper { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; margin: 18px 0 0; padding: 0; list-style: none; }
.stepper li { position: relative; font-size: 13px; color: var(--ink-2); padding-top: 12px; border-top: 3px solid var(--track); line-height: 1.35; }
.stepper li b { display: block; font-weight: 500; color: inherit; font-size: 14px; }
.stepper li.done { border-color: var(--blue); }
.stepper li.now { border-color: var(--fill); color: var(--navy); }
.room-grid { display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 18px; align-items: start; }
.side { position: sticky; top: 82px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 10px; max-height: calc(100vh - 100px); overflow-y: auto; }
.side summary { list-style: none; display: none; }
.side summary::-webkit-details-marker { display: none; }
.side-item {
  display: flex; gap: 10px; align-items: flex-start; padding: 9px 10px; border-radius: var(--radius-s);
  color: var(--ink); text-decoration: none; font-size: 14px; line-height: 1.4; transition: background .15s ease;
}
a.side-item:hover { background: var(--blue-softer); }
.side-item.active { background: var(--blue-soft); font-weight: 500; color: var(--navy); }
.side-item.locked { color: var(--ink-3); }
.side-label { font-size: 12px; color: var(--ink-3); padding: 10px 10px 4px; }
.dot { flex: 0 0 22px; height: 22px; border-radius: 50%; border: 1.5px solid var(--line); display: grid; place-items: center; color: #fff; margin-top: -1px; }
.dot .ico { width: 13px; height: 13px; }
.dot.done { background: var(--blue); border-color: var(--blue); }
.dot.lock { border: 0; color: var(--ink-3); }
.dot.lock .ico { width: 16px; height: 16px; }
.lesson { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 28px 32px; min-width: 0; font-size: 16px; line-height: 1.75; }
.lesson .kicker { color: var(--blue); font-weight: 500; font-size: 14px; }
.lesson h2 { margin: 2px 0 6px; font-size: 24px; }
.lesson .src { color: var(--ink-2); font-size: 14px; margin-bottom: 18px; }
.lesson h3 { font-size: 19px; margin: 28px 0 10px; }
.lesson h4 { margin: 0 0 6px; font-size: 16.5px; }
.lesson .lead { font-size: 17px; color: var(--ink-2); }
.lesson figure { margin: 16px 0; text-align: center; }
.lesson figure img { border: 1px solid var(--line); border-radius: 10px; background: #fff; max-height: 460px; }
.lesson figcaption { color: var(--ink-2); font-size: 14px; margin-top: 6px; }
.lesson ul, .lesson ol { padding-left: 1.4em; }
.lesson-nav { display: flex; justify-content: space-between; gap: 12px; margin-top: 32px; padding-top: 20px; border-top: 1px solid var(--line); flex-wrap: wrap; }
.video-box { position: relative; aspect-ratio: 16 / 9; border-radius: 12px; overflow: hidden; background: var(--fill); margin: 12px 0 8px; }
.video-box iframe, .video-box video { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
.res-row { display: flex; gap: 12px; align-items: center; padding: 12px 14px; border: 1px solid var(--line); border-radius: 12px; text-decoration: none; color: inherit; margin: 8px 0; }
a.res-row:hover { border-color: var(--blue-soft); background: var(--blue-softer); }
.res-row > div { flex: 1; min-width: 0; }
.res-row b { display: block; font-weight: 500; color: var(--navy); }
.res-row small { color: var(--ink-2); font-size: 13px; }
.res-ico { width: 38px; height: 38px; flex: none; border-radius: 10px; background: var(--blue-soft); color: var(--navy); display: grid; place-items: center; }
.locked-box { display: flex; gap: 12px; align-items: center; padding: 14px 16px; border: 1px dashed var(--line); border-radius: 12px; color: var(--ink-2); margin: 10px 0; font-size: 14.5px; }

/* ---------- Lesson content blocks ---------- */
.callout { background: var(--brand-soft); border-left: 4px solid var(--brand); padding: 14px 16px; border-radius: 10px; margin: 16px 0; }
.callout.strong { background: #fdf2f2; border-color: #dc2626; }
.callout.warn { background: var(--warn-soft); border-color: var(--warn); }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin: 14px 0; }
.grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin: 14px 0; }
.card { border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; background: #fbfdfc; }
.card p { margin: 6px 0; }
.card ul { margin: 6px 0; }
.card.muted { background: #f7f7f7; }
.card.tip { background: #fffbea; border-color: #f4e3a1; margin-top: 20px; }
.tag { font-size: 15px; color: var(--ink-2); }
.example { font-style: italic; }
.muted-text { color: var(--ink-2); font-style: italic; }
.refs { color: var(--ink-2); font-size: 14px; margin-top: 24px; }
table.compare { width: 100%; border-collapse: collapse; margin: 10px 0; font-size: 16px; }
table.compare th { background: var(--brand); color: #fff; padding: 10px; }
table.compare td { border: 1px solid var(--line); padding: 10px; text-align: center; }
table.compare tr:nth-child(even) td { background: #f6faf9; }
.triad { text-align: center; margin: 12px 0; }
.triad-top { display: inline-block; background: #fffbd6; border: 1px solid #e6dd8a; border-radius: 99px; padding: 8px 22px; font-weight: 600; }
.triad-row { display: flex; justify-content: center; align-items: center; gap: 14px; margin-top: 12px; flex-wrap: wrap; }
.triad-row span { background: #fffbd6; border: 1px solid #e6dd8a; border-radius: 50%; width: 96px; height: 96px; display: grid; place-items: center; font-weight: 600; }
.triad-row b { color: var(--brand-ink); }
.steps { list-style: none; padding: 0 !important; display: grid; gap: 10px; }
.steps li { background: #eefcfb; border: 1px solid #bfe9e4; border-radius: 12px; padding: 12px 16px; }
.steps em { color: var(--danger); font-style: normal; font-weight: 600; }
.step-no { display: inline-block; background: var(--brand); color: #fff; border-radius: 6px; padding: 0 10px; margin-right: 8px; font-weight: 700; font-size: 14px; }
.frame4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin: 12px 0; }
.frame4 div { background: #fbfdfc; border: 1px solid var(--line); border-radius: 12px; padding: 12px; text-align: center; }
.frame4 b { display: block; background: var(--brand); color: #fff; border-radius: 99px; padding: 2px 0; margin-bottom: 6px; }
.frame4 span { font-size: 15px; }
.quote-list { list-style: none; padding: 0 !important; font-weight: 600; }
.cols2 { columns: 2; column-gap: 32px; }
.diamond { list-style: "♦  "; }
.check { list-style: "✓  "; }
.check.big li { margin: 6px 0; font-size: 18px; }
.numbered-cards li { margin: 8px 0; }
.smcr { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin: 14px 0; }
.smcr div { text-align: center; background: #eef4ff; border: 1px solid #c9d8fb; border-radius: 12px; padding: 12px 6px; }
.smcr b { display: block; font-size: 30px; color: #2563eb; line-height: 1.2; }
.smcr span { font-size: 15px; }
.pdca-wheel { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; max-width: 320px; margin: 4px auto 20px; }
.pdca-wheel .q { padding: 18px 10px; text-align: center; color: #fff; font-weight: 600; line-height: 1.3; }
.pdca-wheel .q b { display: block; font-size: 30px; }
.pdca-wheel .p { background: #4f97b3; border-radius: 120px 12px 12px 12px; }
.pdca-wheel .d { background: #8b7bb5; border-radius: 12px 120px 12px 12px; }
.pdca-wheel .a { background: #4b9e73; border-radius: 12px 12px 12px 120px; }
.pdca-wheel .c { background: #c4677d; border-radius: 12px 12px 120px 12px; }
.phase { border-left: 5px solid; padding: 2px 0 2px 18px; margin: 18px 0; }
.phase h3 { margin-top: 6px; }
.phase.p { border-color: #4f97b3; } .phase.d { border-color: #8b7bb5; }
.phase.c { border-color: #c4677d; } .phase.a { border-color: #4b9e73; }

.grid5s { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin: 14px 0; }
.grid5s div { text-align: center; background: #f3edff; border: 1px solid #d8c8fb; border-radius: 12px; padding: 10px 4px; font-weight: 600; font-size: 15px; line-height: 1.35; }
.grid5s b { display: block; font-size: 24px; color: #7c3aed; }
.grid5s small { display: block; color: var(--ink-2); font-weight: 400; }
.ghs-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 12px 0; }
.ghs-grid div { text-align: center; font-size: 30px; border: 2px solid #dc2626; border-radius: 10px; padding: 8px 4px; background: #fff; }
.ghs-grid span { display: block; font-size: 14px; color: var(--ink); }
.why-chain { display: grid; gap: 8px; margin: 14px 0; }
.why-chain div { border-left: 4px solid #0891b2; background: #ecfeff; border-radius: 8px; padding: 8px 14px; }
.why-chain div.root { border-color: #dc2626; background: #fdf2f2; font-weight: 600; }
.why-chain b { display: inline-block; min-width: 90px; color: #0e7490; }
.why-chain .root b { color: var(--danger); }


.lesson figure img.page-img { max-height: none; width: 100%; max-width: 820px; }

/* ---------- Quiz ---------- */
.q-item { border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; margin: 14px 0; }
.q-item .q-title { font-weight: 500; margin-bottom: 8px; color: var(--navy); }
.q-item label {
  display: flex; gap: 10px; align-items: flex-start; padding: 9px 12px; border-radius: 10px; margin-top: 4px;
  cursor: pointer; border: 1px solid transparent; transition: background .12s ease, border-color .12s ease;
}
.q-item label:hover { background: var(--blue-softer); }
.q-item label:has(input:checked) { background: var(--blue-soft); border-color: var(--blue-soft); }
.q-item input { margin-top: 6px; accent-color: var(--navy); }
.q-item label.right, .q-item label.right:has(input:checked) { background: var(--good-soft); border-color: #a5d9c1; }
.q-item label.wrong, .q-item label.wrong:has(input:checked) { background: var(--danger-soft); border-color: #f2b8b2; }
.q-item.is-wrong { border-color: #f2b8b2; }
.q-review { display: flex; gap: 8px; align-items: flex-start; margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--line); font-size: 14.5px; line-height: 1.45; }
.q-review .ico { margin-top: 3px; }
.q-review.ok { color: var(--good); }
.q-review.no { color: var(--danger); }
.review-sum { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 6px; margin-top: 12px; font-size: 14.5px; }
.q-count { position: sticky; bottom: 0; background: var(--surface); padding: 8px 0; font-size: 14px; color: var(--ink-2); }
.result { border-radius: 14px; padding: 20px; text-align: center; margin: 20px 0; background: var(--blue-soft); }
.result.pass { background: var(--good-soft); }
.result.fail { background: var(--warn-soft); }
.result .score { font-size: 34px; font-weight: 600; line-height: 1.2; color: var(--navy); font-variant-numeric: tabular-nums; }

/* ---------- Tables ---------- */
.table-wrap { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); }
table.data { width: 100%; border-collapse: collapse; font-size: 14.5px; }
table.data th { text-align: left; background: var(--blue-softer); color: var(--ink-2); padding: 10px 14px; font-weight: 500; font-size: 13.5px; white-space: nowrap; }
table.data td { padding: 11px 14px; border-top: 1px solid var(--line); vertical-align: middle; }
table.data tbody tr:hover td { background: var(--blue-softer); }
table.data a { text-decoration: none; font-weight: 500; }
table.data .num { font-variant-numeric: tabular-nums; white-space: nowrap; }
table.data .actions { white-space: nowrap; text-align: right; }
table.data .actions .btn + .btn { margin-left: 6px; }
.up { color: var(--good); font-weight: 500; }
.title-cell { display: flex; align-items: center; gap: 10px; min-width: 200px; }
.title-cell .course-ico { width: 34px; height: 34px; border-radius: 10px; }

/* ---------- Calendar ---------- */
.cal-grid-wrap { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 18px; align-items: start; }
.cal-head { display: flex; align-items: center; gap: 8px; margin-bottom: 14px; }
.cal-head h2 { font-size: 18px; margin: 0; flex: 1; }
.cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); border-top: 1px solid var(--line); border-left: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.cal-dow { font-size: 13px; color: var(--ink-2); text-align: center; padding: 6px 0; background: var(--blue-softer); border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.cal-day { min-height: 96px; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); padding: 5px; min-width: 0; font-size: 13px; }
.cal-day.off { background: var(--blue-softer); color: var(--ink-3); }
.cal-num { display: inline-grid; place-items: center; width: 24px; height: 24px; border-radius: 50%; font-variant-numeric: tabular-nums; }
.cal-day.today .cal-num { background: var(--fill); color: #fff; }
.cal-ev { display: block; width: 100%; text-align: left; border: 0; border-radius: 6px; background: var(--blue-soft); color: var(--navy); font-size: 12.5px; padding: 2px 6px; margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-decoration: none; }
.cal-ev:hover { background: var(--blue-soft); }
.event.flash { animation: flash 1.2s ease; border-radius: 8px; }
@keyframes flash { 0%, 40% { background: var(--blue-soft); } 100% { background: transparent; } }

/* ---------- HR report ---------- */
.seg { display: inline-flex; background: var(--track); border-radius: 12px; padding: 3px; gap: 2px; margin-bottom: 18px; max-width: 100%; overflow-x: auto; scrollbar-width: none; }
.seg a, .seg button { border: 0; background: transparent; color: var(--ink-2); border-radius: 9px; padding: 7px 16px; font-size: 14px; text-decoration: none; white-space: nowrap; min-height: 36px; display: inline-flex; align-items: center; }
.seg .active { background: var(--surface); color: var(--navy); font-weight: 500; box-shadow: 0 1px 2px rgba(15, 42, 74, .12); }
.report-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 18px; margin-bottom: 18px; }
.legend { display: flex; gap: 14px; font-size: 13px; color: var(--ink-2); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; }
.key-pre { background: #9dbbdc; }
.key-post { background: var(--fill); }
.pair { display: grid; grid-template-columns: minmax(0, 190px) minmax(40px, 1fr) 82px; gap: 12px; align-items: center; padding: 6px 0; font-size: 14px; }
.pair-name { line-height: 1.3; overflow-wrap: anywhere; }
.pair-bars { display: grid; gap: 2px; }
.pair-bars i { display: block; height: 7px; min-width: 2px; border-radius: 0 4px 4px 0; transition: width .5s ease; }
.pair-val { text-align: right; color: var(--ink-2); font-variant-numeric: tabular-nums; white-space: nowrap; }
.months { display: flex; gap: 8px; align-items: flex-end; height: 170px; padding-top: 18px; }
.month { flex: 1; min-width: 0; height: 100%; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; gap: 4px; font-size: 12.5px; color: var(--ink-2); }
.month i { display: block; width: min(32px, 70%); min-height: 2px; background: var(--blue); border-radius: 4px 4px 0 0; transition: height .5s ease; }
.month b { font-weight: 500; color: var(--navy); font-variant-numeric: tabular-nums; }
.filters { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin: 4px 0 12px; }
.filters .control { width: auto; }
.filters input.control { min-width: 220px; }
table.report { width: 100%; border-collapse: collapse; font-size: 14px; }
table.report th { text-align: left; background: var(--blue-softer); color: var(--ink-2); padding: 10px 12px; font-weight: 500; white-space: nowrap; max-width: 200px; overflow: hidden; text-overflow: ellipsis; }
table.report td { padding: 9px 12px; border-top: 1px solid var(--line); vertical-align: top; white-space: nowrap; }
table.report td small { display: block; color: var(--ink-2); font-size: 12.5px; }
table.report th:nth-child(2), table.report td:nth-child(2) { position: sticky; left: 0; background: var(--surface); z-index: 1; }
table.report th:nth-child(2) { background: var(--blue-softer); }
td.c-done b { color: var(--good); font-weight: 500; }
td.c-doing b { color: var(--blue); font-weight: 500; }
td.c-none { color: var(--ink-3); text-align: center; }
td.c-count { font-weight: 500; text-align: center; }
td.c-date { color: var(--ink-2); font-size: 13px; }
.more-row { text-align: center; padding: 14px; }

/* ---------- Dialog ---------- */
dialog { background: var(--surface); border: 0; border-radius: var(--radius); padding: 0; width: min(520px, calc(100vw - 32px)); box-shadow: var(--shadow-lift); color: var(--ink); }
dialog::backdrop { background: rgba(15, 42, 74, .4); }
.dlg-head { padding: 18px 22px 0; }
.dlg-head h2 { margin: 0; font-size: 18px; }
.dlg-body { padding: 16px 22px 4px; max-height: 70vh; overflow-y: auto; }
.dlg-foot { display: flex; justify-content: flex-end; gap: 8px; padding: 12px 22px 18px; }
.field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.check-row { display: flex; gap: 10px; align-items: center; margin-bottom: 14px; }
.check-row input { width: 18px; height: 18px; accent-color: var(--navy); }
.toast { position: fixed; left: 50%; bottom: 84px; transform: translateX(-50%); background: var(--fill); color: #fff; padding: 9px 18px; border-radius: 99px; font-size: 14px; z-index: 50; animation: rise .2s ease both; }

/* ---------- Floating cards on soft blue (reference look) ---------- */
.panel, .stat-tile, .course-card, .room-head, .side, .lesson, .table-wrap { border-color: transparent; box-shadow: var(--shadow); }
.panel-head h2 { font-size: 18px; }
.panel-more { display: block; text-align: center; font-size: 14px; text-decoration: none; padding: 12px 0 0; margin-top: 10px; border-top: 1px solid var(--line); }
.panel-more:hover { text-decoration: underline; }
.num { font-variant-numeric: tabular-nums; }
.pills { display: flex; flex-wrap: wrap; gap: 6px; }
.pill { display: inline-block; max-width: 210px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13px; padding: 3px 10px; border-radius: 7px; background: var(--blue-soft); color: var(--navy-2); }
.pill b { font-weight: 600; margin-right: 2px; }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.good { background: var(--good-soft); color: var(--good); }
.art { display: block; width: 100%; height: 100%; }
.thumb { flex: none; display: block; width: 62px; height: 44px; border-radius: 9px; overflow: hidden; }

/* Rail + top bar */
.nav-brand { justify-content: center; padding: 2px 0 14px; flex: none; }
.nav-mark { display: grid; place-items: center; align-self: center; width: 44px; height: 44px; margin-bottom: 14px; flex: none; border-radius: 12px; background: var(--fill); color: #fff; text-decoration: none; font-family: "Orbitron", "Segoe UI", sans-serif; font-weight: 600; font-size: 15px; letter-spacing: .04em; }
.icon-btn { position: relative; flex: none; display: grid; place-items: center; width: 42px; height: 42px; border: 0; border-radius: 10px; background: transparent; color: var(--blue); transition: background .15s ease; }
.icon-btn:hover { background: var(--blue-soft); }
.rail-btn { background: var(--blue-soft); }
.theme-sun { display: none; }
[data-theme="dark"] .theme-sun { display: block; }
[data-theme="dark"] .theme-moon { display: none; }
.bell-dot { position: absolute; top: 9px; right: 10px; width: 9px; height: 9px; border-radius: 50%; background: #e5484d; border: 2px solid var(--bg); }
.user-btn { display: flex; align-items: center; gap: 10px; border: 0; padding: 0 0 0 6px; background: transparent; text-align: right; line-height: 1.25; }
.user-btn b { display: block; font-size: 14px; font-weight: 600; color: var(--navy); white-space: nowrap; max-width: 170px; overflow: hidden; text-overflow: ellipsis; }
.user-btn small { display: block; font-size: 12px; color: var(--ink-2); white-space: nowrap; max-width: 170px; overflow: hidden; text-overflow: ellipsis; }
.user-btn .avatar { flex: none; width: 42px; height: 42px; font-weight: 600; font-size: 17px; }
.pop-wrap { position: relative; }
.pop { position: absolute; right: 0; top: calc(100% + 8px); z-index: 40; width: 300px; max-width: calc(100vw - 32px); background: var(--surface); border-radius: 12px; box-shadow: var(--shadow-lift); padding: 12px; animation: rise .16s ease both; }
.pop[hidden] { display: none; }
.pop h3 { margin: 2px 6px 8px; font-size: 15px; }
.pop p { margin: 6px; font-size: 14px; }
.pop-user { width: 220px; }
.pop-menu { width: 200px; padding: 6px; }
.notice-item { display: flex; gap: 10px; align-items: center; padding: 8px 6px; border-radius: 10px; font-size: 14px; line-height: 1.4; color: var(--ink); text-decoration: none; }
.notice-item:hover, .menu-row:hover { background: var(--blue-softer); }
.menu-row { display: flex; gap: 10px; align-items: center; width: 100%; padding: 9px 8px; border: 0; border-radius: 10px; background: transparent; color: var(--ink); text-align: left; text-decoration: none; font-size: 14.5px; }
.help-list { margin: 0 0 12px; padding-left: 1.3em; display: grid; gap: 6px; }

/* Dashboard (EduLearn layout) */
.edu-top { display: grid; grid-template-columns: minmax(0, 1fr) 370px; gap: 20px; margin-bottom: 26px; }
.banner { position: relative; display: flex; justify-content: space-between; gap: 16px; min-height: 240px; padding: 28px 30px; border-radius: var(--radius); background: var(--banner); color: #fff; overflow: hidden; }
.banner-text { display: flex; flex-direction: column; min-width: 0; }
.banner h1 { margin: 0 0 6px; font-size: 27px; color: #fff; font-weight: 700; }
.banner p { margin: 0; color: rgba(255, 255, 255, .92); }
.banner-stats { display: flex; flex-wrap: wrap; gap: 14px 30px; margin-top: auto; padding-top: 22px; }
.banner-stat { display: flex; align-items: center; gap: 12px; }
.banner-stat i { flex: none; display: grid; place-items: center; width: 52px; height: 52px; border-radius: 50%; border: 2px solid #fff; color: #fff; }
.banner-stat:nth-child(1) i { background: #e23d66; }
.banner-stat:nth-child(2) i { background: #f2bb1d; color: #14233a; }
.banner-stat b { display: block; font-weight: 600; font-size: 16px; line-height: 1.3; }
.banner-stat span { font-size: 14px; color: rgba(255, 255, 255, .92); }
.banner-art { flex: none; align-self: flex-end; width: 330px; margin: 0 -8px -28px 0; }
.banner-art svg { display: block; width: 100%; height: auto; }
.side-action { display: flex; flex-direction: column; gap: 12px; text-align: center; }
.side-action h2 { margin: 2px auto 0; max-width: 300px; font-size: 19px; font-weight: 500; line-height: 1.35; }
.side-metrics { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; flex: 1; }
.side-metric { display: flex; flex-direction: column; background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; text-decoration: none; color: inherit; transition: transform .18s ease; }
.side-metric:hover { transform: translateY(-2px); }
.side-metric span { padding: 7px 6px; font-size: 13.5px; color: var(--blue); background: var(--blue-softer); }
.side-metric b { flex: 1; display: grid; place-items: center; padding: 8px; font-size: 38px; font-weight: 400; color: var(--navy); font-variant-numeric: tabular-nums; }
.edu-mid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 20px; margin-bottom: 26px; }
.edu-col { min-width: 0; display: flex; flex-direction: column; }
.col-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin-bottom: 14px; }
.col-head h2 { margin: 0; font-size: 19px; font-weight: 600; }
.col-head a { font-size: 13.5px; color: var(--ink-2); text-decoration: none; white-space: nowrap; }
.col-head a:hover { color: var(--blue); }
.col-stack { display: grid; gap: 14px; flex: 1; align-content: start; }
.list-card { display: flex; align-items: center; gap: 14px; padding: 18px 18px; min-height: 92px; background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); min-width: 0; }
.list-card > div:not(.pop-wrap) { flex: 1; min-width: 0; }
.list-card h3 { margin: 0; font-size: 15.5px; font-weight: 500; line-height: 1.35; overflow-wrap: anywhere; }
.list-card p { margin: 2px 0 0; font-size: 13.5px; color: var(--ink-2); }
.tile { flex: none; display: grid; place-items: center; width: 52px; height: 52px; border-radius: 6px; color: #fff; }
.tone-0 .tile { background: #f2bb1d; color: #14233a; } .tone-1 .tile { background: #e23d66; } .tone-2 .tile { background: #2a8577; } .tone-3 .tile { background: #2f6fed; }
.soft-btn { flex: none; padding: 6px 11px; border-radius: 6px; font-size: 13px; text-decoration: none; white-space: nowrap; transition: filter .15s ease; }
.soft-btn:hover { filter: brightness(.96); }
.tone-0 .soft-btn { background: #fdf3cf; color: #7a5a00; } .tone-1 .soft-btn { background: #fde4ea; color: #b3173d; } .tone-2 .soft-btn { background: #dcf3ee; color: #12705f; } .tone-3 .soft-btn { background: #e2edff; color: #1f5fd1; }
.dots-btn { width: 26px; height: 34px; color: var(--ink-2); }
.person { flex: none; display: grid; place-items: center; width: 52px; height: 52px; border-radius: 50%; background: var(--blue-soft); color: var(--blue); font-size: 19px; font-weight: 600; }
.count-tag { flex: none; padding: 5px 10px; border-radius: 6px; font-size: 13px; background: var(--blue-softer); color: var(--ink); white-space: nowrap; }
.chart-card { padding: 20px 20px 12px; flex: none; }
.chart-card h3 { margin: 0; font-size: 18px; font-weight: 500; }
.chart-card > p { margin: 0 0 8px; font-size: 13.5px; color: var(--ink-2); }
.area-chart { display: block; width: 100%; height: auto; max-height: 250px; overflow: visible; }
.area-chart text { fill: var(--ink-2); font-size: 11px; }
.area-chart .grid { stroke: var(--line); stroke-width: 1; }
.area-chart .fill { fill: var(--blue); opacity: .14; }
.area-chart .stroke { fill: none; stroke: var(--blue); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.area-chart .hit { fill: transparent; }
.area-chart .pt-line { stroke: var(--ink-3); stroke-width: 1; stroke-dasharray: 3 3; opacity: 0; }
.area-chart .pt-dot { fill: var(--blue); stroke: var(--surface); stroke-width: 2; opacity: 0; }
.area-chart .pt-tip { opacity: 0; pointer-events: none; }
.area-chart .pt-tip rect { fill: var(--fill); }
.area-chart .pt-tip text { fill: #fff; font-size: 12px; }
.area-chart .pt:hover .pt-line, .area-chart .pt:hover .pt-dot, .area-chart .pt:hover .pt-tip { opacity: 1; }
.highlights { display: grid; grid-template-columns: 1.45fr 1fr; gap: 14px; margin-top: 14px; flex: 1; }
.highlight { position: relative; display: flex; flex-direction: column; padding: 18px 20px; min-height: 138px; border-radius: var(--radius); text-decoration: none; transition: transform .18s ease; }
.highlight:hover { transform: translateY(-2px); }
.highlight b { font-size: 25px; font-weight: 700; line-height: 1.2; font-variant-numeric: tabular-nums; }
.highlight span { font-size: 14px; line-height: 1.35; }
.highlight small { display: block; margin-top: auto; padding-right: 44px; padding-top: 8px; font-size: 12.5px; line-height: 1.3; }
.highlight i { position: absolute; right: 16px; bottom: 16px; display: grid; place-items: center; width: 38px; height: 38px; border-radius: 50%; background: rgba(255, 255, 255, .85); color: #14233a; }
.highlight.yellow { background: #f5ce2f; color: #14233a; }
.highlight.pink { background: #d9335c; color: #fff; }
.edu-bot { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr) minmax(0, 1fr); gap: 20px; }
.edu-bot h2 { font-size: 18px; font-weight: 500; margin: 0 0 14px; }
.edu-bot .hbar { grid-template-columns: minmax(0, 1fr) minmax(40px, .9fr) 52px; }
.donut.stack { flex-direction: column; align-items: stretch; gap: 14px; }
.donut.stack .ring { align-self: center; }

.stat-tile { align-items: center; }
.stat-ico { border-radius: 50%; width: 46px; height: 46px; }
.stats .stat-tile:nth-child(1) .stat-ico { background: #e5f4ed; color: #14734f; }
.stats .stat-tile:nth-child(2) .stat-ico { background: #e4eefb; color: #2563a8; }
.stats .stat-tile:nth-child(3) .stat-ico { background: #fcf0e3; color: #b8651b; }
.stats .stat-tile:nth-child(4) .stat-ico { background: #fbf5d9; color: #8a6d0b; }
.stat-tile b small { display: inline; font-size: 14px; font-weight: 400; color: var(--ink-3); }
.prog-pct { display: inline-flex; align-items: center; gap: 8px; font-size: 14px; }
.mini-ring { flex: none; }
.mini-ring circle { fill: none; stroke: var(--track); stroke-width: 5; }
.mini-ring .on { stroke: var(--blue); }
.mini-ring.full .on { stroke: #2f9e6e; }
.donut { display: flex; align-items: center; gap: 18px; }
.donut .ring { width: 124px; }
.donut .ring circle { fill: none; stroke-width: 15; }
.donut-key { list-style: none; margin: 0; padding: 0; flex: 1; min-width: 0; display: grid; gap: 5px; font-size: 13.5px; }
.donut-key li { display: flex; align-items: center; gap: 8px; }
.donut-key i { flex: none; width: 10px; height: 10px; border-radius: 3px; }
.donut-key span { flex: 1; color: var(--ink-2); line-height: 1.3; }
.donut-key b { font-weight: 600; color: var(--navy); font-variant-numeric: tabular-nums; }
circle.k-done { stroke: var(--blue); } i.k-done { background: var(--blue); }
circle.k-doing { stroke: #2a9d8f; } i.k-doing { background: #2a9d8f; }
circle.k-due { stroke: #efa24c; } i.k-due { background: #efa24c; }
circle.k-todo { stroke: var(--track); } i.k-todo { background: var(--track); }

/* Catalog cards with a picture on top */
.course-card { padding: 0 0 16px; overflow: hidden; }
.course-card > :not(.card-art) { margin-left: 18px; margin-right: 18px; }
.card-art { height: 112px; }
.card-cat { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-size: 13px; }
.title-cell .thumb { width: 50px; height: 36px; }

[data-theme="dark"] .lesson .card, [data-theme="dark"] .lesson .steps li, [data-theme="dark"] .lesson .frame4 div, [data-theme="dark"] .lesson .smcr div, [data-theme="dark"] .lesson .grid5s div,
[data-theme="dark"] .lesson .why-chain div, [data-theme="dark"] .lesson .triad-top, [data-theme="dark"] .lesson .triad-row span, [data-theme="dark"] .lesson .ghs-grid div { background: var(--blue-softer); border-color: var(--line); color: var(--ink); }
[data-theme="dark"] .lesson .ghs-grid span, [data-theme="dark"] .lesson .why-chain b, [data-theme="dark"] .lesson .smcr b, [data-theme="dark"] .lesson .grid5s b { color: var(--blue); }
[data-theme="dark"] .lesson .callout.strong { background: var(--danger-soft); }
[data-theme="dark"] table.compare tr:nth-child(even) td { background: var(--blue-softer); }
[data-theme="dark"] .lesson figure img { background: #fff; }
[data-theme="dark"] .stat-ico { filter: brightness(.9); }
[data-theme="dark"] .side-metric span { color: var(--blue); }
/* ---------- Responsive ---------- */
@media (max-width: 1320px) {
  .banner-art { width: 240px; }
  .edu-mid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .edu-col.chart-col { grid-column: 1 / -1; grid-row: 1; }
  .edu-bot { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .edu-bot > :first-child { grid-column: 1 / -1; }
}
@media (max-width: 1100px) {
  /* แท็บเล็ต: เมนูขยายลอยทับเนื้อหา ไม่เบียดหน้า */
  .rail-open { --nav-w: 76px; }
  .rail-open .nav { width: 244px; box-shadow: var(--shadow-lift); }
  .edu-top { grid-template-columns: minmax(0, 1fr); }
  .side-metric b { font-size: 30px; }
}
@media (max-width: 980px) {
  .report-grid, .cal-grid-wrap { grid-template-columns: minmax(0, 1fr); }
  .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .user-btn > span:first-child { display: none; }
  .room-grid { grid-template-columns: minmax(0, 1fr); }
  .side { position: static; max-height: none; }
  .side summary { display: flex; align-items: center; justify-content: space-between; padding: 8px 10px; font-weight: 500; color: var(--navy); cursor: pointer; }
  .side summary small { color: var(--ink-2); font-weight: 400; }
  .login-wrap { grid-template-columns: minmax(0, 1fr); }
  .login-side { display: none; }
  .grid2, .grid3 { grid-template-columns: 1fr; }
  .frame4, .smcr { grid-template-columns: 1fr 1fr; }
  .grid5s { grid-template-columns: repeat(3, 1fr); }
  .ghs-grid { grid-template-columns: 1fr 1fr; }
  .cols2 { columns: 1; }
}
@media (max-width: 720px) {
  body { font-size: 15px; }
  .nav { display: none; }
  .workspace { margin-left: 0; padding-bottom: 68px; }
  .top { padding: 0 16px; height: 58px; }
  .top-left, .rail-btn { display: none; }
  .top .spacer { display: block; }
  .top-brand { display: block; }
  .fs-btn { display: none; }
  .banner { padding: 20px; min-height: 0; }
  .banner h1 { font-size: 22px; }
  .banner-art { display: none; }
  .edu-mid, .edu-bot { grid-template-columns: minmax(0, 1fr); }
  .edu-col.chart-col { grid-row: auto; }
  .list-card { padding: 14px; gap: 10px; }
  .tile, .person { width: 44px; height: 44px; }
  .prog-pct { gap: 5px; font-size: 13px; }
  .donut { flex-wrap: wrap; justify-content: center; }
  .filters .control, .filters input.control { width: 100%; min-width: 0; }
  .sync { font-size: 12px; white-space: normal; text-align: right; }
  .page { padding: 18px 16px 40px; }
  .page-head h1 { font-size: 22px; }
  .panel { padding: 16px; }
  .lesson { padding: 18px 16px; }
  .room-head { padding: 16px; }
  .room-title h1 { font-size: 19px; }
  .stats { gap: 10px; }
  .stat-tile { padding: 12px; gap: 10px; }
  .stat-ico { width: 40px; height: 40px; }
  .hbar, .pair { grid-template-columns: minmax(0, 104px) minmax(30px, 1fr) 58px; gap: 8px; }
  .pair { grid-template-columns: minmax(0, 104px) minmax(30px, 1fr) 76px; }
  .tabbar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; display: flex; background: var(--surface);
    border-top: 1px solid var(--line); padding: 4px 4px calc(4px + env(safe-area-inset-bottom));
  }
  .tabbar .nav-item { flex: 1 1 0; min-width: 0; flex-direction: column; gap: 1px; padding: 6px 0; font-size: 11px; justify-content: center; }
  .tabbar .nav-item span { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
  .tabbar .nav-item.active { background: transparent; color: var(--navy); font-weight: 600; }
  .tabbar .nav-item.active .ico { color: var(--blue); }
  .cal-day { min-height: 58px; padding: 3px; }
  .cal-ev { font-size: 0; height: 6px; padding: 0; width: 6px; border-radius: 50%; background: var(--blue); display: inline-block; margin: 2px 2px 0 0; }
  .stepper li { font-size: 12px; }
  .stepper li b { font-size: 12.5px; }
  .stepper li small { display: none; }
  .btn.block-sm { width: 100%; }
  /* ตารางกลายเป็นการ์ดเรียงลงมาบนมือถือ */
  table.stack thead { display: none; }
  table.stack, table.stack tbody, table.stack tr, table.stack td { display: block; width: 100%; }
  table.stack tr { padding: 10px 14px; border-top: 1px solid var(--line); }
  table.stack tr:first-child { border-top: 0; }
  table.stack td { border: 0; padding: 3px 0; display: flex; justify-content: space-between; gap: 12px; text-align: right; }
  table.stack td::before { content: attr(data-label); color: var(--ink-2); font-size: 13px; text-align: left; flex: none; }
  table.stack td.title { display: block; text-align: left; padding-bottom: 6px; }
  table.stack td.title::before { display: none; }
  table.stack td.actions { justify-content: flex-end; padding-top: 8px; }
  table.stack td.actions::before { display: none; }
  table.stack tbody tr:hover td { background: transparent; }
  .field-row { grid-template-columns: 1fr; gap: 0; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
.btn-text { overflow: hidden; text-overflow: ellipsis; min-width: 0; }

/* รูปโปรไฟล์และหน้าติดต่อ HRD */
.avatar { overflow: hidden; }
.avatar img, .avatar .cartoon { width: 100%; height: 100%; object-fit: cover; display: block; }
.avatar-big { width: 88px; height: 88px; flex: none; font-size: 32px; font-weight: 600; box-shadow: 0 0 0 3px var(--blue-soft); }
.avatar-now { display: flex; align-items: center; gap: 16px; }
.avatar-actions { display: flex; flex-wrap: wrap; gap: 8px; min-width: 0; }
.avatar-upload { position: relative; gap: 6px; cursor: pointer; }
.avatar-upload input { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; }
.avatar-upload:focus-within { outline: 2px solid var(--blue); outline-offset: 2px; }
.avatar-note { font-size: 13px; line-height: 1.5; margin: 12px 0 0; }
.avatar-title { font-size: 15px; margin: 16px 0 8px; }
.avatar-grid { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 8px; }
.avatar-pick { padding: 0; aspect-ratio: 1; border: 0; border-radius: 50%; overflow: hidden; background: transparent; cursor: pointer; box-shadow: 0 0 0 1px var(--line); transition: box-shadow .12s ease; }
.avatar-pick .cartoon { width: 100%; height: 100%; display: block; }
.avatar-pick:hover { box-shadow: 0 0 0 2px var(--blue-soft); }
.avatar-pick[aria-pressed="true"] { box-shadow: 0 0 0 3px var(--blue); }
.link-btn { padding: 0; border: 0; background: none; color: var(--blue); font: inherit; text-decoration: underline; cursor: pointer; }
.side-contact { gap: 8px; }
.contact-card { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 20px 28px; }
.contact-info { flex: 1 1 240px; display: grid; gap: 14px; justify-items: start; min-width: 0; }
.contact-info .btn { gap: 8px; }
.contact-row { display: flex; align-items: center; gap: 12px; min-width: 0; }
.contact-row small { display: block; font-size: 13px; color: var(--ink-2); }
.contact-row b { display: block; font-size: 16.5px; font-weight: 600; color: var(--navy); overflow-wrap: anywhere; }
.contact-row a { color: inherit; }
.contact-qr { flex: none; margin: 0 auto; text-align: center; }
/* คิวอาร์ต้องอยู่บนพื้นขาวเสมอ แม้โหมดมืด ไม่อย่างนั้นสแกนไม่ติด */
.contact-qr img { display: block; width: 190px; height: auto; padding: 8px; background: #fff; border-radius: 10px; box-shadow: 0 0 0 1px var(--line); }
.contact-qr figcaption { margin-top: 8px; font-size: 13px; color: var(--ink-2); }
.contact-panel { max-width: 680px; }
@media (max-width: 720px) {
  .avatar-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .avatar-big { width: 72px; height: 72px; }
}

          : '<path d="M-20 74-40 112" stroke="#14233a" stroke-width="13" stroke-linecap="round"/><circle cx="-42" cy="117" r="7" fill="' + skin + '"/>') +
        '<circle cy="40" r="18" fill="' + skin + '"/><path d="M-18 40c-3-14 6-22 18-22s21 8 18 22c-6-3-30-3-36 0z" fill="' + hair + '"/>' +
        '<path d="M-27 22 0 11 27 22 0 33Z" fill="#0d1727"/><path d="M0 22 21 26v16" fill="none" stroke="#f2bb1d" stroke-width="2.500"/><circle cx="21" cy="44" r="3" fill="#f2bb1d"/></g>';

    return '<svg viewBox="0 0 340 230" aria-hidden="true"><circle cx="178" cy="112" r="96" fill="rgba(255,255,255,.14)"/><path d="M10 226c70-14 250-14 320 0z" fill="rgba(255,255,255,.22)"/>' +
      '<g fill="rgba(255,255,255,.55)"><circle cx="42" cy="58" r="4"/><circle cx="300" cy="40" r="5"/><circle cx="72" cy="28" r="3"/><circle cx="318" cy="96" r="3"/></g>' +
      grad(78, 26, .98, "#f2c9a5", "#3a2a2a", true) + grad(268, 26, .98, "#d9a177", "#14233a", false) + grad(174, 16, 1.04, "#e8b48c", "#1d2a3f", true) + "</svg>";
  }

  function navTree(item, opt, subs) {
    var inTree = subs.some(function (s) { return s.current; });
    return '<div class="nav-tree' + (inTree ? " open" : "") + '"><button class="nav-item' + (inTree ? " active" : "") + '" type="button" data-tree data-tip="' + item.label + '" aria-label="' + item.label + '">' +
      icon(item.icon) + "<span>" + item.label + '</span><svg class="ico chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + ICONS.right + "</svg></button>" +
      '<div class="nav-sub">' + subs.map(function (s) {
        return '<a class="' + (s.current ? "active" : "") + '" href="' + esc(s.href) + '"' + (s.top ? ' target="_top"' : "") + (s.current ? ' aria-current="page"' : "") + ">" + s.label + "</a>";
      }).join("") + "</div></div>";
  }

  // opt: { page, active, content, user: {name, sub, mark}, notices, topLeft, topActions }
  function shell(opt) {
    var main = NAV.filter(function (n) { return !n.hr; });
    var hr = NAV.filter(function (n) { return n.hr; });
    var other = opt.page === "app" ? "report" : "app";
    var hash = location.hash;
    var overview = navTree(main[0], opt, [
      { label: "ภาพรวมของฉัน", href: navHref(main[0], opt.page), top: opt.page !== "app", current: opt.active === "dashboard" },
      { label: "ภาพรวมองค์กร", href: navHref(hr[0], opt.page), top: opt.page !== "report", current: opt.active === "reports" },
    ]);
    var adminBase = opt.page === "report" ? "" : reportUrl;
    var admin = navTree(hr[1], opt, [["employees", "พนักงาน"], ["courses", "หลักสูตร"], ["schedule", "ตารางอบรม"]].map(function (a, i) {
      var h = "#/admin/" + a[0];
      return { label: a[1], href: adminBase + h, top: opt.page !== "report", current: opt.active === "admin" && (hash === h || (i === 0 && hash.indexOf("#/admin/") !== 0)) };
    }));
    return (
      '<div class="shell">' +
      '<aside class="nav"><a class="nav-mark" href="' + esc(opt.page === "app" ? "#/" : homeUrl + "#/") + '"' + (opt.page === "app" ? "" : ' target="_top"') + ' aria-label="หน้าภาพรวม">HR</a>' +
      '<div class="nav-brand">' + brandLogo(true) + "</div>" +
      '<nav aria-label="เมนูหลัก">' + overview + main.slice(1).map(function (n) { return navLink(n, opt); }).join("") +
      '<div class="nav-group"><span>สำหรับฝ่ายบุคคล</span></div>' + admin + "</nav>" +
      '<div class="nav-foot"><div class="nav-card">' + navArt() + "</div>" +

      '<div class="workspace"><header class="top">' +
      '<button class="icon-btn rail-btn" id="rail-toggle" type="button" aria-label="ย่อหรือขยายเมนู">' + icon("menu", 22) + "</button>" +
      '<div class="top-brand">' + brandLogo(true) + "</div>" +
      '<div class="top-left">' + (opt.topLeft || "") + "</div>" +
      '<div class="spacer"></div><span id="sync" class="sync" role="status"></span>' +
      (opt.topActions || "") +
      '<button class="icon-btn" id="theme-toggle" type="button" aria-label="สลับโหมดกลางวันและกลางคืน"><span class="theme-moon">' + icon("moon", 22) + '</span><span class="theme-sun">' + icon("sun", 22) + "</span></button>" +
      (opt.notices ? bell(opt.notices) : "") +
      (document.fullscreenEnabled ? '<button class="icon-btn fs-btn" id="fs-toggle" type="button" aria-label="เต็มหน้าจอ">' + icon("expand", 22) + "</button>" : "") +
      userMenu(opt.user) + "</header>" +
      '<main class="page" id="page">' + opt.content + "</main></div>" +
      '<nav class="tabbar" aria-label="เมนูหลัก">' +
      (opt.page === "report" ? hr.concat(main.slice(0, 1)) : main.filter(function (n) { return !n.noTab; })).map(function (n) { return navLink(n, opt); }).join("") + "</nav>" +
      "</div>"
    );
  }

  function pageHead(title, sub, right) {
    return '<div class="page-head"><div><h1>' + title + "</h1>" + (sub ? "<p>" + sub + "</p>" : "") + "</div>" +
      (right ? '<div class="page-head-right">' + right + "</div>" : "") + "</div>";
  }
  function emptyState(iconName, title, text) {
    return '<div class="empty">' + icon(iconName, 32) + "<b>" + title + "</b>" + (text ? "<p>" + text + "</p>" : "") + "</div>";
  }
  // วงแหวนความคืบหน้าแบบค่าเดียว (ไม่ใช้สีอื่นนอกจากน้ำเงินหลัก)
  function ring(pct, big, small) {
    var r = 52, c = 2 * Math.PI * r, on = c * Math.max(0, Math.min(100, pct)) / 100;
    return '<div class="ring"><svg viewBox="0 0 120 120" role="img" aria-label="' + esc(big + " " + small) + '">' +
      '<circle cx="60" cy="60" r="' + r + '" class="ring-track"/>' +
      '<circle cx="60" cy="60" r="' + r + '" class="ring-on" stroke-dasharray="' + on.toFixed(1) + " " + (c - on).toFixed(1) + '" transform="rotate(-90 60 60)"/></svg>' +
      '<div class="ring-text"><b>' + esc(big) + "</b><span>" + esc(small) + "</span></div></div>";
  }
  // วงแหวนเล็กในแถวตาราง: เขียว = จบแล้ว น้ำเงิน = กำลังเรียน
  function miniRing(pct) {
    var r = 9, c = 2 * Math.PI * r, on = c * Math.max(0, Math.min(100, pct)) / 100;
    return '<svg class="mini-ring' + (pct >= 100 ? " full" : "") + '" width="26" height="26" viewBox="0 0 26 26" aria-hidden="true"><circle cx="13" cy="13" r="' + r + '"/>' +
      '<circle class="on" cx="13" cy="13" r="' + r + '" stroke-dasharray="' + on.toFixed(1) + " " + (c - on).toFixed(1) + '" transform="rotate(-90 13 13)"/></svg>';
  }
  // โดนัทสัดส่วน: parts = [{label, value, cls}] มีช่องว่างระหว่างส่วน และคำอธิบายพร้อมตัวเลขเสมอ ไม่ต้องดูจากสีอย่างเดียว
  function donut(parts, big, small, stacked) {
    var r = 48, c = 2 * Math.PI * r, total = parts.reduce(function (s, p) { return s + p.value; }, 0), at = 0, gap = 3;
    var arcs = parts.filter(function (p) { return p.value > 0; }).map(function (p, i, shown) {
      var len = c * p.value / total, g = shown.length > 1 ? gap : 0;
      var out = '<circle class="' + p.cls + '" cx="60" cy="60" r="' + r + '" stroke-dasharray="' + Math.max(1, len - g).toFixed(1) + " " + (c - Math.max(1, len - g)).toFixed(1) +
        '" stroke-dashoffset="' + (-at).toFixed(1) + '" transform="rotate(-90 60 60)"><title>' + esc(p.label + ": " + p.value) + "</title></circle>";
      at += len;
      return out;
    }).join("");
    return '<div class="donut' + (stacked ? " stack" : "") + '"><div class="ring"><svg viewBox="0 0 120 120" role="img" aria-label="' + esc(big + " " + small) + '">' + arcs + "</svg>" +
      '<div class="ring-text"><b>' + esc(big) + "</b><span>" + esc(small) + "</span></div></div>" +
      '<ul class="donut-key">' + parts.map(function (p) {
        return '<li><i class="' + p.cls + '"></i><span>' + esc(p.label) + "</span><b>" + p.value + "</b></li>";
      }).join("") + "</ul></div>";
  }
  // กราฟพื้นที่ค่าเดียว 0-100%: points = [{label, value}] เอาเมาส์ชี้หรือแตะแต่ละเดือนเพื่อดูตัวเลข
  function areaChart(points) {
    var W = 420, H = 190, L = 34, R = 10, T = 10, B = 24, step = (W - L - R) / (points.length - 1);
    function px(i) { return L + i * step; }
    function py(v) { return T + (H - T - B) * (1 - v / 100); }
    var d = "M" + px(0) + " " + py(points[0].value);
    for (var i = 1; i < points.length; i++) {
      var mid = px(i - 1) + step / 2;
      d += " C" + mid + " " + py(points[i - 1].value) + " " + mid + " " + py(points[i].value) + " " + px(i) + " " + py(points[i].value);
    }
    var grid = [0, 25, 50, 75, 100].map(function (v) {
      return '<line class="grid" x1="' + L + '" x2="' + (W - R) + '" y1="' + py(v) + '" y2="' + py(v) + '"/><text x="' + (L - 6) + '" y="' + (py(v) + 4) + '" text-anchor="end">' + v + "%</text>";
    }).join("");
    var pts = points.map(function (p, n) {
      var x = px(n), y = py(p.value), tip = esc(p.label + " " + p.value + "%"), tx = Math.max(L, Math.min(W - R - 72, x - 36)), ty = Math.max(0, y - 34);
      return '<g class="pt" tabindex="0"><rect class="hit" x="' + (x - step / 2) + '" y="0" width="' + step + '" height="' + H + '"/><line class="pt-line" x1="' + x + '" x2="' + x + '" y1="' + T + '" y2="' + (H - B) + '"/>' +
        '<circle class="pt-dot" cx="' + x + '" cy="' + y + '" r="5"/><g class="pt-tip"><rect x="' + tx + '" y="' + ty + '" width="72" height="24" rx="5"/><text x="' + (tx + 36) + '" y="' + (ty + 16) + '" text-anchor="middle">' + tip + "</text></g>" +
        '<text x="' + x + '" y="' + (H - 6) + '" text-anchor="middle">' + esc(p.label) + "</text></g>";
    }).join("");
    return '<svg class="area-chart" viewBox="0 0 ' + W + " " + H + '" role="img" aria-label="' + esc(points.map(function (p) { return p.label + " " + p.value + "%"; }).join(", ")) + '">' + grid +
      '<path class="fill" d="' + d + " L" + px(points.length - 1) + " " + py(0) + " L" + px(0) + " " + py(0) + ' Z"/><path class="stroke" d="' + d + '"/>' + pts + "</svg>";
  }  function stat(iconName, value, labelText, hint) {
    return '<div class="stat-tile"><div class="stat-ico">' + icon(iconName) + "</div><div><b>" + value + "</b><span>" + labelText + "</span>" +
      (hint ? "<small>" + hint + "</small>" : "") + "</div></div>";
  }
  // แถบแนวนอนค่าเดียว: ป้ายอยู่ซ้าย ตัวเลขอยู่ขวา เอาเมาส์ชี้ดูรายละเอียดได้
  function hbar(name, pct, value, tip) {
    return '<div class="hbar" title="' + esc(tip || "") + '"><div class="hbar-name">' + esc(name) + '</div>' +
      '<div class="hbar-track"><i style="width:' + Math.max(0, Math.min(100, pct)) + '%"></i></div><div class="hbar-val">' + esc(value) + "</div></div>";
  }

  return {
    app: app, homeUrl: homeUrl, reportUrl: reportUrl, SCOPES: SCOPES, GROUPS: GROUPS,
    icon: icon, esc: esc, api: api, brandLogo: brandLogo, fmtDay: fmtDay, localDate: localDate, ymd: ymd,
    groupLabel: groupLabel, scopeLabel: scopeLabel, courseIcon: courseIcon, courseArt: courseArt, courseThumb: courseThumb, minutes: minutes,
    shell: shell, pageHead: pageHead, emptyState: emptyState, ring: ring, miniRing: miniRing, donut: donut, areaChart: areaChart, initial: initial, bannerArt: bannerArt, stat: stat, hbar: hbar,
    CARTOONS: CARTOONS, cartoonSvg: cartoonSvg, avatarInner: avatarInner, contactCard: contactCard, closePops: closePops,
  };
})();
</script>

      {

        minutes: 8,
        body: `
<h3>แตกต่างจากการสื่อสารแบบส่วนตัวอย่างไร</h3>
<table class="compare">
  <thead><tr><th>การสื่อสารทางธุรกิจ</th><th>การสื่อสารแบบส่วนตัว</th></tr></thead>

<h3>ทักษะ 3 อย่างเพื่อเติมเต็มช่องว่างกับอีกฝ่าย</h3>
<ol class="steps">
  <li><span class="step-no">Step 1</span><b>การจัดระเบียบข้อมูลและการสร้างความไว้วางใจ</b><br>จัดระเบียบและยอมรับข้อเท็จจริงและความรู้สึก<br><em>ทักษะหลัก: ความสามารถในการฟัง</em></li>

        body: `
<p class="lead">การจัดระเบียบข้อมูลและการสร้างความไว้วางใจ — ทักษะ 2 ประการที่จำเป็นสำหรับการฟัง</p>

<h3>1. จัดระเบียบความคิดขณะฟัง</h3>
<p>ตระหนักถึง <b>“กรอบข้อมูล”</b> — เมื่อฟังโดยมีกรอบ คุณจะจัดโครงสร้างสิ่งที่คนอื่นพูด และสังเกตเห็นข้อบกพร่องได้ ลองถามตัวเองขณะฟังว่า:</p>
<div class="frame4">
  <div><b>ประเด็น</b><span>คุณกำลังพูดถึงอะไร?</span></div>
  <div><b>ข้อสรุป</b><span>ข้อสรุป (ข้อคิดเห็น) ที่อยากบอกมากที่สุดคือ?</span></div>
  <div><b>เหตุผล</b><span>เหตุผลสำหรับข้อสรุปนั้นคืออะไร?</span></div>
  <div><b>ข้อเท็จจริง</b><span>ข้อเท็จจริงที่สนับสนุนเหตุผลนั้นคือ?</span></div>
</div>

<h3>2. การฟังเพื่ออีกฝ่าย</h3>
<figure><img src="${IMG["biz-listen-for-others"]}" alt="ฟังเพื่อตัวคุณเอง เทียบกับ ฟังเพื่ออีกฝ่าย"></figure>
<div class="grid2">
  <div class="card muted">
    <h4>❌ ฟังเพื่อตัวคุณเอง</h4>
    <ul><li>ฟังเฉพาะเรื่องที่คุณต้องการจะฟัง</li><li>ฟังด้วยอุปาทาน (ความเชื่อของตัวเอง)</li></ul>
  </div>
  <div class="card">
    <h4>✅ ฟังเพื่ออีกฝ่าย</h4>
    <ul><li>ฟังทั้งคำพูดและความรู้สึกในสิ่งที่อีกฝ่ายพยายามจะสื่อ</li><li>รับฟังสิ่งที่อีกฝ่ายต้องการจะสื่อ</li></ul>
  </div>
</div>
<div class="callout">การฟังเรื่องของอีกฝ่าย = <b>การฟังอย่างตั้งใจ</b> → สร้างความสัมพันธ์และความไว้วางใจด้วยการรับฟัง</div>

<h3>ผลลัพธ์: Rapport</h3>
<p>เมื่อฟังอย่างตั้งใจ อีกฝ่ายจะรู้สึกว่า</p>
<ul class="quote-list"><li>「ถ้าเราพูดกับคนนี้… น่าจะพูดได้」</li><li>「ถ้าเป็นคนนี้… เราอยากจะคุยด้วย」</li><li>「ถ้าเป็นคนนี้… เราสามารถไว้ใจได้」</li></ul>
<p>นี่คือ <b>Rapport</b> — ความเป็นมิตร ความสามัคคี และความปรองดอง</p>`,
      },
      {
        title: "ความสามารถในการตั้งคำถาม",
        minutes: 5,
        body: `
<p class="lead">ความเข้าใจซึ่งกันและกันและการพัฒนาความสัมพันธ์</p>
<div class="callout">การฟังเป็นพื้นฐานของการสื่อสารทางธุรกิจ จากนั้นจึงถาม “คำถาม” เพื่อ <b>“เข้าใจซึ่งกันและกัน”</b> และ <b>“สร้างความสัมพันธ์”</b> กับอีกฝ่าย</div>

<h3>คำถามที่ทำให้คนฟังรู้สึกไม่สบายใจ</h3>
<ol>
  <li>ไม่รู้ว่าจะพูดอะไรดี ทำให้เสียเวลา</li>
  <li>คำถามที่หากแค่ค้นหาได้ด้วยตัวเองก็จะรู้</li>
  <li>คำถามที่คู่สนทนารู้สึกอึดอัด และคิดว่าไม่มีมารยาทเมื่อถูกถาม</li>
</ol>

<h3>ข้อควรทราบเมื่อถามคำถาม</h3>
<p>การถามคำถามนั้น ต้องนึกเสมอว่าเราได้รับทั้ง <b>การสละเวลา</b> และ <b>ความร่วมมือ</b> ของผู้ที่ถูกถาม ควรพยายามถามสิ่งที่เป็นประโยชน์เพื่อลดภาระของอีกฝ่าย</p>
<p>ต้อง「พิจารณา」ว่าถามคำถามแบบไหนออกไปแล้ว จะได้รับความไว้วางใจจากอีกฝ่ายได้ง่ายขึ้น</p>

<h3>รูปแบบการตั้งคำถาม</h3>
<div class="grid2">
  <div class="card">
    <h4>คำถามปลายปิด</h4>
    <p>ตอบได้ด้วย ใช่/ไม่ใช่ หรือคำสั้น ๆ</p>
    <p class="example">「ทำ…ได้มั้ย」 「มี…กี่อัน」</p>
    <p class="tag">ใช้เพื่อ: <b>ยืนยัน · จบเรื่อง · หาข้อสรุปที่เห็นพ้องกัน</b></p>
  </div>
  <div class="card">
    <h4>คำถามปลายเปิด</h4>
    <p>ไม่สามารถตอบด้วยคำสั้น ๆ ได้</p>
    <p class="example">「คุณคิดยังไงบ้าง」 「โดยรูปธรรมเป็นเรื่องอะไร」 「คิดว่ามีวิธีการอย่างไรบ้าง」</p>
    <p class="tag">ใช้เพื่อ: <b>ดึงความคิดออกมา · เจาะลึก · ขยายประเด็น</b></p>
  </div>
</div>`,
      },
      {
        title: "ความสามารถในการถ่ายทอด",
        minutes: 7,
        body: `
<p class="lead">ความโน้มน้าวใจและส่งเสริมพฤติกรรม — การจัดระเบียบเรียบเรียงข้อมูลในการสื่อสาร</p>

<h3>ทัศนคติและวิธีการสื่อสารของผู้พูดที่ไม่ดี</h3>
<ol class="cols2">
  <li>พูดเพียงฝ่ายเดียว (ไม่ให้อีกฝ่ายพูด)</li>
  <li>สกัดกั้นเรื่องราว</li>
  <li>เข้าจากการปฏิเสธของอีกฝ่าย</li>
  <li>ใช้สำนวนเชิงลบมากเกินไป</li>
  <li>พูดโดยไม่มองหน้า</li>
  <li>มีหลายอย่างที่อยากพูด ไม่เป็นระเบียบ ไม่มีอยู่จริง</li>
  <li>จุดประสงค์ไม่ใช่เพื่อโน้มน้าวคนอื่น แต่เพื่อรับทราบตัวเอง</li>
  <li>ไม่ระบุเหตุผล</li>
  <li>อัตนัยมากเกินไป</li>
</ol>
<p>แล้วจะ <b>“ส่งสาร”</b> ให้อีกฝ่ายได้อย่างไร?</p>

<h3>จัดระเบียบและเรียบเรียงข้อมูลก่อนพูด</h3>
<figure><img src="${IMG["biz-organize-info"]}" alt="ข้อมูลที่กระจัดกระจาย A-K ถูกจัดเป็น 3 กลุ่มก่อนพูด"><figcaption>หากจัดระเบียบและเรียบเรียงข้อมูล การสนทนาจะง่ายต่อการเข้าใจทั้งสำหรับผู้ฟังและตัวคุณเอง</figcaption></figure>

<h3>กรณีตัวอย่าง</h3>
<p class="muted-text">เจ้านาย: “ได้ยินว่ามีโทรศัพท์จากบริษัท Z ลูกค้าของเราโทรมา ใช่มั้ย? น่าจะเป็นเรื่องเอกสารข้อเสนอการวางแผนงานที่เราเสนอไปนะ เขาพูดว่าอะไรรึ?”</p>
<div class="grid2">
  <div class="card muted">
    <h4>❌ นาย A — เข้าใจยาก</h4>
    <p>“บอกว่าตอนนี้บริษัท Z กำลังยุ่งอยู่หลายเรื่อง ได้รับเอกสารข้อเสนอเต็มไปหมด แล้วยังมีข้อเสนอเข้าไปอีกเยอะ คงเป็นของคู่แข่งนั่นแหละ บอกว่าน่าจะจำเป็นต้องมีการประเมินราคา ไม่รู้ว่าราคาเหมาะสมจะเป็นสักเท่าไร รู้สึกจะกังวลเรื่องว่าจะทำ project ต่อไปยังไงดี… บอกว่าอยากให้ส่งประมาณภายในสัปดาห์หน้าครับ”</p>
    <p class="tag">ท้ายสุด <b>ไม่รู้ว่าต้องการจะพูดอะไร</b></p>
  </div>
  <div class="card">
    <h4>✅ นาย B — เข้าใจง่าย</h4>
    <p>“ครับ เป็น<u>เรื่องเอกสารข้อเสนอฯ เมื่อวันก่อน</u> ทราบว่าหลังเปรียบเทียบกับคู่แข่ง<u>จนเหลือ 3 บริษัท</u>สุดท้าย และบริษัทเราติดอยู่ด้วยครับ แล้วยังขอให้ทำเพิ่มอีก 2 เรื่อง <u>เรื่องแรก</u> ให้จัดทำเอกสารประเมินราคา <u>เรื่องที่ 2</u> ให้เสนอโครงสร้างโครงการ (project structure) และให้ส่งเมล์ถึงหัวหน้า C <u>ภายในวันพุธหน้า</u>ครับ”</p>
    <p class="tag">เจ้านาย: “อืม… ดีมาก เข้าใจแล้ว รีบไปทำเลย!”<br><b>มีการจัดระเบียบในสิ่งที่คู่สนทนาต้องการ</b></p>
  </div>
</div>

<div class="callout strong">
  ผู้พูด<b>กำลังดึงเอาเวลา</b>ของผู้ฟังอยู่!<br>
  พระเอกของการสื่อสารไม่ใช่ผู้พูด — <b>พระเอกคือฝ่ายของผู้ฟัง</b><br>
  ขอให้ผู้พูด<b>รับผิดชอบ</b>กับเรื่องที่จะแชร์ ให้คุ้มกับเวลาอันมีค่าของผู้ฟัง
</div>`,

      {
        title: "เทคนิคการเจรจาและต่อรอง",
        minutes: 5,
        body: `
<h3>หลักการสร้างโอกาสในการต่อรอง</h3>
<div class="callout">ต้อง<b>เปิดใจอีกฝ่าย</b>เพื่อแลกเปลี่ยนความคิด จนมองที่<b>จุดมุ่งหมายเดียวกัน</b></div>

<h3>วิธีการนำเสนอในการต่อรอง</h3>
<p>ต้องรู้จักข้อดีของข้อเสนอในการต่อรอง:</p>
<div class="grid2">
  <div class="card"><h4>ประโยชน์ที่แท้จริง</h4><p>เช่น ประโยชน์ที่แท้จริงของรถยนต์ก็คือ “ขับ”</p></div>
  <div class="card"><h4>ประโยชน์จากสิ่งรอบด้าน</h4><p>เช่น รถคันเล็กประหยัดพื้นที่ใช้สอย, รถบางประเภทใช้เปิดร้านขายของได้</p></div>
</div>
<ul class="diamond">
  <li>เน้นผลกระทบที่รุนแรง เช่น ถ้าไม่เปลี่ยนตัวที่ใช้อยู่ อาจทำให้เกิดอันตรายได้</li>
  <li>เพิ่มทางเลือกให้ลูกค้า</li>
  <li>ลดตัวที่ขายไม่ดีออก ให้ตัวที่ทำเงินได้เข้ามาแทนที่</li>
</ul>

<h3>เหตุผลของการเกิดคำปฏิเสธ</h3>
<ul>
  <li>ความไม่มั่นใจในบางสิ่งบางอย่าง</li>
  <li>ยังไม่ตรงตามความต้องการ</li>
  <li>สถานการณ์ไม่ตรงกับที่คาดหวังไว้</li>

<h3>สรุป</h3>
<div class="callout strong">การโน้มน้าวที่ดีที่สุด คือ การทำให้ลูกค้าตระหนักได้ว่า<b>เราหวังดี</b> ให้เราเชื่อมั่นในสินค้าและบริการ และนำเสนอด้วย<b>ความจริงใจ</b></div>`,

<h3>การสื่อสารภายในองค์กร คืออะไร</h3>
<p>กระบวนการแลกเปลี่ยน<b>ข้อมูลข่าวสาร ความคิด ความรู้สึก</b>ระหว่างบุคคลภายในองค์กร เพื่อให้เกิด<b>ความเข้าใจร่วมกัน</b> และมุ่งสู่<b>เป้าหมายเดียวกัน</b> โดยใช้ช่องทางที่หลากหลายทั้งแบบทางการและไม่เป็นทางการ</p>
<div class="callout">การสื่อสารภายในองค์กรเป็นเครื่องมือสำคัญในการขับเคลื่อนความสำเร็จขององค์กร ช่วยให้พนักงานเข้าใจ <b>เป้าหมาย กลยุทธ์ นโยบาย</b> และทำงานร่วมกันได้อย่างมีประสิทธิภาพ</div>`,

      {
        title: "กระบวนการสื่อสาร (Communication Process)",
        minutes: 5,
        body: `
<p>แบบจำลอง <b>S-M-C-R</b> ตามแนวคิดของเบอร์โล (Berlo)</p>
<div class="smcr">
  <div><b>S</b><span>ผู้ส่งสาร<br>Sender</span></div>
  <div><b>M</b><span>สาร<br>Message</span></div>
  <div><b>C</b><span>ช่องทาง<br>Channel</span></div>
  <div><b>R</b><span>ผู้รับสาร<br>Receiver</span></div>
</div>

<h3>ผู้ส่งสาร (Sender)</h3>
<p>ผู้ที่ต้องการสื่อสารต้องทำความเข้าใจเรื่องที่จะสื่อสารให้ชัดเจนก่อน อาจใช้การพูดคุย ออกคำสั่ง บันทึกข้อความ ข่าวสาร หรือรายงาน ปัจจัยของผู้ส่งสาร ได้แก่ ทักษะการสื่อสาร ทัศนคติ ความรู้ ระบบสังคม และวัฒนธรรม</p>

<h3>สาร (Message)</h3>
<p>ประกอบด้วย เนื้อหา ส่วนประกอบ โครงสร้าง การจัดสาร และรหัส</p>

<h3>ช่องทาง / สื่อ (Channel / Media)</h3>
<p>ตัวกลางที่ทำให้ข่าวสารเดินทางจากแหล่งกำเนิดไปถึงผู้รับ เช่น เครื่องขยายเสียง วิทยุ โทรทัศน์ อินเทอร์เน็ต เว็บไซต์ e-mail — รับรู้ผ่านการเห็น การได้ยิน การสัมผัส การได้กลิ่น และการลิ้มรส</p>

<h3>ผู้รับสาร (Receiver)</h3>
<p>ต้องมีความรู้ความเข้าใจ ประสบการณ์ และทักษะในการ<b>ถอดรหัส (Decoding)</b> เพื่อเข้าใจข่าวสารที่ผู้ส่งเข้ารหัส <b>(Encoding)</b> มา ปัจจัยของผู้รับเช่นเดียวกับผู้ส่ง: ทักษะการสื่อสาร ทัศนคติ ความรู้ ระบบสังคม และวัฒนธรรม</p>`,

<div class="grid2">
  <div class="card"><h4>⬆️ 1. จากล่างขึ้นบน (Upward)</h4><p>จากพนักงานไปยังผู้บริหาร (Bottom-Up) ใช้สื่อสารปัญหา อุปสรรค ข้อเสนอแนะ ความคิดเห็น เป็นการสื่อสารสองทางที่เปิดโอกาสให้พนักงานมีส่วนร่วม และสร้าง <b>Employee Engagement</b> หรือความผูกพันกับองค์กร</p></div>
  <div class="card"><h4>⬇️ 2. จากบนลงล่าง (Downward)</h4><p>จากผู้บังคับบัญชาไปยังผู้ใต้บังคับบัญชา เช่น สั่งงาน บอกเป้าหมาย มอบหมายงาน ให้ข้อมูลย้อนกลับ (Performance Feedback) และการประชุม ช่วยให้บุคลากรเห็นว่างานของตนสำคัญและมีผลต่อแผนงานขององค์กรอย่างไร</p></div>
  <div class="card"><h4>↗️ 3. แนวทแยง (Diagonal)</h4><p>สื่อสาร<b>ข้ามแผนกและข้ามระดับ</b> มักเป็นระหว่างฝ่ายให้คำแนะนำ (Staff) กับฝ่ายปฏิบัติการ (Line) เช่น ผู้จัดการฝ่ายบุคคลแจ้งกฎระเบียบใหม่ให้พนักงานฝ่ายผลิต</p></div>
  <div class="card"><h4>↔️ 4. แนวนอน (Horizontal)</h4><p>สื่อสารในกลุ่มงานหรือระดับเดียวกัน เช่น เพื่อนร่วมงาน (ไม่จำเป็นต้องแผนกเดียวกัน) มักเป็นมิตรและเป็นกันเอง ช่วยให้สนิทสนมและสร้างความสัมพันธ์ที่ดีในองค์กร</p></div>

        title: "9 เทคนิคการสื่อสาร และข้อดีของการสื่อสารที่ดี",

        body: `
<h3>9 เทคนิคการสื่อสารอย่างมีประสิทธิภาพ</h3>
<ol class="numbered-cards">
  <li><b>เป็นผู้ฟังที่ดี (Active Listening)</b> — ใส่ใจคู่สนทนา สังเกตทั้งคำพูด ท่าทาง สีหน้า น้ำเสียง ฟังเพื่อเข้าใจ ไม่ใช่ฟังเพื่อโต้แย้ง</li>
  <li><b>สื่อสารตรงประเด็นและกระชับ</b> — บอกสิ่งสำคัญให้ชัด ไม่วกวน</li>
  <li><b>ทักษะการเล่าเรื่อง (Storytelling)</b> — หาจุดร่วมกับผู้ฟัง เปิดด้วยประโยคที่ดึงความสนใจ เช่น เริ่มจาก pain point ของผู้ฟัง</li>
  <li><b>ศิลปะในการพูด (วาทศิลป์)</b> — รู้ว่าเวลาและสถานการณ์นี้ควรพูดอะไร รักษาบรรยากาศเชิงบวก สำคัญมากเมื่อต้องเจรจา ปฏิเสธ หรือให้ feedback เชิงลบ</li>
  <li><b>ภาษากาย</b> — การสบตา การยิ้ม บุคลิกภาพ ช่วยถ่ายทอดความมั่นใจและความรู้สึกร่วม</li>
  <li><b>ความกล้าแสดงออก</b> — สร้างความมั่นใจและความเชื่อมั่นให้ผู้รับสาร</li>
  <li><b>ความโปร่งใสและเป็นกลาง</b> — สื่อสารตามข้อเท็จจริง ไม่ลำเอียง</li>
  <li><b>การรักษาเวลา</b> — เคารพเวลาของผู้ฟังและผู้ร่วมประชุม</li>
  <li><b>การรับฟังข้อเสนอของผู้อื่น</b> — เปิดใจรับความคิดเห็นที่แตกต่าง</li>
</ol>

<h3>การสื่อสารที่มีประสิทธิภาพช่วยชีวิตส่วนบุคคล</h3>
<ul>
  <li>สร้างและบริหารความสัมพันธ์ได้ดียิ่งขึ้น</li>
  <li>รับมือกับความขัดแย้ง และหาทางออกร่วมกันอย่างสร้างสรรค์</li>
  <li>สุขภาพจิตดีขึ้น จิตใจมั่นคง เพราะรู้จักสื่อสารอารมณ์ของตนเอง</li>
</ul>

<h3>ข้อดีต่อทีมและองค์กร</h3>
<ul class="check">
  <li>ทีมร่วมมือกันมากขึ้น แรงจูงใจในองค์กรเพิ่มขึ้น</li>
  <li>ลดความสับสนและความเข้าใจผิด</li>
  <li>ส่งเสริมภาวะผู้นำ — ทักษะสำคัญในการก้าวเป็นหัวหน้าทีม</li>
  <li>ผู้นำสร้างทีมเวิร์คและการประสานงานที่ดีขึ้น</li>
  <li>คนในทีมรู้ความคาดหวังขององค์กรและหัวหน้าอย่างชัดเจน</li>
  <li>โปร่งใสในการรายงานความคืบหน้า บทบาทหน้าที่ และความรับผิดชอบ</li>
  <li>ความสัมพันธ์ดีขึ้น คนในทีมสนับสนุนกัน</li>
</ul>

<p class="refs">แหล่งอ้างอิงจากเอกสารต้นฉบับ: disruptignite.com/blog/communication · humansoft.co.th · thaiprint.org · flash-hr.com</p>`,
